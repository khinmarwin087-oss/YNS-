<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>မြင်သာကြက်ကင် — Counter POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#1d2822;--sub:#778078;--line:#e7dfd0;--brand:#285442;--brand2:#17392d;--gold:#d9a441;--warn:#fff4dc;--danger:#b43f3f;--r:20px;--shadow:0 16px 40px -26px #1d3328}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Noto Sans Myanmar',sans-serif;padding-bottom:32px}button,input{font:inherit}button{cursor:pointer;border:0}.top{background:linear-gradient(145deg,#173e30,#0d2c23);color:white;padding:18px 18px 24px}.topin{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:43px;height:43px;display:grid;place-items:center;border:1px solid #f5d48d;border-radius:14px 14px 14px 4px;color:#f5d48d;font-size:20px}.brand b{display:block;font-size:18px}.brand small{color:#f5d48d}.top h1{max-width:1180px;margin:22px auto 0;font-size:28px;line-height:1.4}.layout{max-width:1180px;margin:-12px auto 0;padding:0 14px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;position:relative}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;background:#fbf8f1;padding:11px 13px;outline:0}.toolbar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #28544218}.btn{border-radius:13px;padding:11px 14px;font-weight:700}.btn.primary{background:var(--brand);color:white}.btn.dark{background:var(--ink);color:white}.btn.soft{background:#eef2eb;color:var(--brand2)}.btn.gold{background:var(--gold);color:#3b2807}.btn.danger{background:#fdeaea;color:var(--danger)}.cats{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.cat{white-space:nowrap;padding:8px 13px;border-radius:99px;background:#f2eee5;color:#58635b;font-weight:700}.cat.on{background:var(--brand);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;display:flex;flex-direction:column}.product .pbody{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}.product b{font-size:13px;line-height:1.5}.product .price{font:800 17px 'Bricolage Grotesque';color:var(--brand);margin-top:auto}.product button{margin-top:4px;background:var(--brand);color:white;padding:9px;border-radius:10px;font-weight:700}.product button:disabled{background:#d9ded9;color:#859087}.thumb{aspect-ratio:1.15;background:#eee8dc;display:grid;place-items:center;overflow:hidden;font-size:30px}.thumb img{width:100%;height:100%;object-fit:cover}.cart{position:sticky;top:12px}.cart h2{font-size:17px;margin:0}.carthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.badge{background:#e5eee5;color:var(--brand2);border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.cartlist{max-height:390px;overflow:auto}.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}.line b{font-size:13px}.line small{display:block;color:var(--sub)}.qty{display:flex;align-items:center;gap:6px;background:#edf2ea;border-radius:10px;padding:3px}.qty button{width:27px;height:27px;border-radius:8px;background:transparent;color:var(--brand);font-weight:800}.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:13px 0;font-weight:700}.total strong{font:800 22px 'Bricolage Grotesque';color:var(--brand)}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.form input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#fbf8f1}.form input:first-child{grid-column:1/-1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .full{grid-column:1/-1}.ticket{display:none;margin:16px auto 0;max-width:420px}.ticket.show{display:block}.ticketpaper{background:white;color:#111;padding:22px 18px;border:1px dashed #888;box-shadow:var(--shadow);text-align:center}.ticketpaper .shop{font-weight:800;font-size:19px}.queue{font:800 56px/1 'Bricolage Grotesque';color:var(--brand);margin:10px 0}.ticketline{display:flex;justify-content:space-between;border-bottom:1px dotted #aaa;padding:5px 0;text-align:left;gap:10px}.ticketline span:last-child{text-align:right;font-weight:700}.pin{display:inline-block;margin:13px 0 5px;padding:7px 16px;border:2px solid var(--ink);border-radius:10px;font:800 24px 'Bricolage Grotesque';letter-spacing:3px}.muted{color:var(--sub);font-size:12px}.verify{max-width:1180px;margin:16px auto 0;padding:0 14px}.verifybox{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.verifybox label{font-size:12px;font-weight:700}.verifybox input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fbf8f1}.msg{margin-top:10px;padding:10px 12px;border-radius:11px;background:#eef2eb;color:var(--brand2);display:none}.msg.show{display:block}.msg.err{background:#fdeaea;color:var(--danger)}
@media(max-width:820px){.layout{grid-template-columns:1fr;margin-top:-10px}.cart{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.verifybox{grid-template-columns:1fr 1fr}.verifybox button{grid-column:1/-1}.ticket{margin-top:14px}}
@media print{body{background:white;padding:0}.top,.layout,.verify,.tickethead,.print-hide{display:none!important}.ticket{display:block;margin:0}.ticketpaper{box-shadow:none;border:0;width:72mm;margin:0 auto;padding:4mm}.queue{font-size:48px}.ticketpaper .shop{font-size:16px}.ticketline{font-size:11px}.pin{font-size:20px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><span class="brandmark">✦</span><div><b>မြင်သာကြက်ကင်</b><small>Counter POS · Queue Ticket</small></div></div><button class="btn soft" onclick="showHelp()">အသုံးပြုပုံ</button></div><h1>ဆိုင်မှာဝယ်သူအတွက် အမြန်ဘောက်ချာထုတ်ရန်</h1></header>
<main class="layout">
<section class="panel"><div class="toolbar"><input id="search" placeholder="ပစ္စည်းရှာရန်" oninput="renderProducts()"><button class="btn soft" onclick="loadProducts()">ပြန်ဖတ်မည်</button></div><div class="cats" id="cats"></div><div class="grid" id="products"></div></section>
<aside class="panel cart"><div class="carthead"><h2>🧾 လက်ရှိအော်ဒါ</h2><span class="badge" id="count">0 ခု</span></div><div class="cartlist" id="cart"></div><div class="total"><span>စုစုပေါင်း</span><strong id="total">0 Ks</strong></div><div class="form"><input id="name" placeholder="ဝယ်သူအမည် (ရှိလျှင်)"><input id="phone" placeholder="ဖုန်း (ရှိလျှင်)"><input id="note" placeholder="မှတ်ချက် (ရှိလျှင်)"></div><div class="actions"><button class="btn danger" onclick="clearCart()">ရှင်းမည်</button><button class="btn primary" onclick="createOrder()">အော်ဒါတင်မည်</button><button class="btn dark full" onclick="printLast()">ဘောက်ချာ ပြန်ထုတ်မည်</button></div><div class="msg" id="msg"></div></aside>
</main>
<section class="verify"><div class="panel"><div class="carthead"><div><h2 style="margin:0;font-size:17px">လာယူသူ စစ်ဆေးရန်</h2><span class="muted">Voucher နံပါတ် + Pickup PIN နှစ်ခုလုံးကိုက်မှ ထုတ်ပေးပါ</span></div><span class="badge">Pickup Verification</span></div><div class="verifybox"><label>Voucher နံပါတ်<input id="verifyCode" placeholder="#MS-0001"></label><label>Pickup PIN<input id="verifyPin" inputmode="numeric" maxlength="4" placeholder="၄ လုံး"></label><button class="btn gold" onclick="verifyPickup()">စစ်ပြီး ထုတ်ပေးမည်</button></div><div class="msg" id="verifyMsg"></div></div></section>
<section class="ticket" id="ticket"><div class="ticketpaper" id="ticketpaper"></div><div class="tickethead print-hide" style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" style="flex:1" onclick="printLast()">Print / Bluetooth Printer</button><button class="btn soft" onclick="newOrder()">အော်ဒါအသစ်</button></div></section>
<script>
const API='https://yns.khinmarwin087.workers.dev';let products=[],cart={},active='အားလုံး',last=null;
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('en-US')+' Ks';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadProducts(){try{const r=await fetch(API+'/api/products');const d=await r.json();if(!d.ok)throw Error(d.error);products=d.products||[];renderCats();renderProducts();}catch(e){showMsg(e.message||'ပစ္စည်းစာရင်းရယူမရပါ',true)}}
function renderCats(){const cats=['အားလုံး',...new Set(products.map(x=>x.category||'အခြား'))];$('cats').innerHTML=cats.map(c=>`<button class="cat ${c===active?'on':''}" onclick="active='${esc(c)}';renderCats();renderProducts()">${esc(c)}</button>`).join('')}
function renderProducts(){const q=$('search').value.trim().toLowerCase();const list=products.filter(p=>(active==='အားလုံး'||(p.category||'အခြား')===active)&&p.name.toLowerCase().includes(q));$('products').innerHTML=list.map(p=>{const sold=!p.available||(p.daily_stock>0&&Number(p.stock)<=0);return `<article class="product"><div class="thumb">${p.image?`<img src="${esc(p.image)}" onerror="this.style.display='none'">`:'🍗'}</div><div class="pbody"><b>${esc(p.name)}</b><span class="price">${money(p.price)}</span><button ${sold?'disabled':''} onclick="add(${p.id})">${sold?'ကုန်ပါပြီ':'＋ ထည့်မည်'}</button></div></article>`}).join('')||'<p class="muted">မတွေ့ပါ</p>'}
function add(id){cart[id]=(cart[id]||0)+1;renderCart()}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
function renderCart(){const ids=Object.keys(cart);let total=0,count=0;$('cart').innerHTML=ids.length?ids.map(id=>{const p=products.find(x=>x.id==id),q=cart[id];total+=p.price*q;count+=q;return `<div class="line"><div><b>${esc(p.name)}</b><small>${money(p.price)} · ${q} ခု</small></div><div class="qty"><button onclick="change(${id},-1)">−</button><b>${q}</b><button onclick="change(${id},1)">＋</button></div></div>`}).join(''):'<p class="muted">ပစ္စည်းမရွေးရသေးပါ</p>';$('count').textContent=count+' ခု';$('total').textContent=money(total)}
function clearCart(){cart={};renderCart()}
function showMsg(t,err=false){const el=$('msg');el.textContent=t;el.className='msg show'+(err?' err':'')}
function showVerifyMsg(t,err=false){const el=$('verifyMsg');el.textContent=t;el.className='msg show'+(err?' err':'')}
function key(){const k=prompt('ဆိုင် Admin Key ထည့်ပါ');return k||''}
async function createOrder(){if(!Object.keys(cart).length)return showMsg('ပစ္စည်းအရင်ရွေးပါ',true);const admin=key();if(!admin)return;const body={name:$('name').value.trim(),phone:$('phone').value.trim(),note:$('note').value.trim(),payment_status:'Paid',items:Object.entries(cart).map(([id,qty])=>({id:Number(id),qty}))};try{const r=await fetch(API+'/api/admin/counter-order',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':admin},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'အော်ဒါသိမ်းမရပါ');last=d;renderTicket(d);$('verifyCode').value='';$('verifyPin').value='';showMsg(`Queue ${d.queue_no} ထုတ်ပြီးပါပြီ — Voucher နဲ့ Pickup PIN ကို customer ကို ပေးပါ`);clearCart();}catch(e){showMsg(e.message,true)}}
function renderTicket(d){const rows=d.items.map(x=>`<div class="ticketline"><span>${esc(x.name)} ×${x.qty}</span><span>${money(x.total)}</span></div>`).join('');$('ticketpaper').innerHTML=`<div class="shop">မြင်သာကြက်ကင်</div><div class="muted">ဆိုင်လာဝယ်သူ ဘောက်ချာ</div><div class="queue">${String(d.queue_no).padStart(2,'0')}</div><div class="muted">လာယူရန် Queue နံပါတ်</div><div class="ticketline"><span>Voucher</span><span>${esc(d.vCode)}</span></div>${rows}<div class="ticketline"><span>စုစုပေါင်း</span><span>${money(d.total)}</span></div><div class="pin">${esc(d.pickup_pin)}</div><div class="muted">Pickup PIN — လာယူချိန်တွင် Voucher နှင့်အတူ ပြပါ</div>`;$('ticket').classList.add('show');$('ticket').scrollIntoView({behavior:'smooth'})}
function printLast(){if(!last)return showMsg('အရင်ဆုံး အော်ဒါတင်ပါ',true);window.print()}
function newOrder(){last=null;$('ticket').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
async function verifyPickup(){const admin=key();if(!admin)return;const code=$('verifyCode').value.trim(),pin=$('verifyPin').value.trim();if(!code||pin.length!==4)return showVerifyMsg('Voucher နံပါတ်နဲ့ ၄ လုံး Pickup PIN ဖြည့်ပါ',true);try{const r=await fetch(API+'/api/admin/pickup/verify',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':admin},body:JSON.stringify({vCode:code,pickup_pin:pin,verified_by:'counter'})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'စစ်ဆေးမရပါ');showVerifyMsg(`အောင်မြင်ပါသည် — Queue ${d.queue_no} ကို ထုတ်ပေးနိုင်ပါပြီ`);$('verifyCode').value='';$('verifyPin').value='';}catch(e){showVerifyMsg(e.message,true)}}
function showHelp(){alert('၁။ ပစ္စည်းရွေးပါ\n၂။ အော်ဒါတင်ပါ\n၃။ Queue ticket ကို print ထုတ်ပြီး customer ကို Voucher + Pickup PIN ပေးပါ\n၄။ လာယူသူက Voucher နဲ့ PIN နှစ်ခုလုံးပြမှ ထုတ်ပေးပါ\n\nBluetooth printer အတွက် Android print service သို့မဟုတ် printer brand app မှတစ်ဆင့် ဒီ Print ခလုတ်ကို သုံးပါ။')}
loadProducts();renderCart();
</script>
</body></html>
