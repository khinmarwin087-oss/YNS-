<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Customers • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root { --card-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 24px -14px rgba(15,23,42,.18); }
    html, body { overflow-x: hidden; }
    body { line-height: 1.5; }
    .main { padding: 0 14px 80px; min-width: 0; }
    .c-wrap { max-width: 860px; margin: 0 auto; }
    @media (min-width: 769px) { .main { padding: 0 28px 60px; } .menu-btn-o { display: none !important; } }

    /* ---------- sticky top ---------- */
    .c-top { position: sticky; top: 0; z-index: 40; margin: 0 -14px; padding: 10px 14px; background: rgba(244,246,251,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    @media (min-width: 769px) { .c-top { margin: 0 -28px; padding: 18px 28px 12px; } }
    .c-top-inner { max-width: 860px; margin: 0 auto; }
    .c-bar { display: flex; align-items: center; gap: 10px; }
    .c-title { flex: 1; min-width: 0; }
    .c-title h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.3px; color: var(--ink); line-height: 1.3; }
    .c-title small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
    .ibtn { width: 42px; height: 42px; flex-shrink: 0; border-radius: 13px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; font-size: 15px; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.05); transition: transform .15s; }
    .ibtn:active { transform: scale(.93); }
    .ibtn.spin i { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search { display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 0 13px; margin-top: 11px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .search i { color: #94a3b8; font-size: 13px; }
    .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 12px 0; font-size: 14px; }
    .search .x { display: none; color: #94a3b8; font-size: 14px; padding: 6px; }
    .search.has .x { display: block; }

    .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .chip { min-width: 0; padding: 8px 2px; border-radius: 12px; background: #fff; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: .2s; }
    .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

    /* ---------- summary ---------- */
    .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 6px; }
    .sum > div { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 11px; box-shadow: var(--card-shadow); min-width: 0; }
    .sum small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum b { display: block; font-size: 18px; font-weight: 800; color: var(--ink); font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -.3px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum .money b { font-size: 15.5px; padding-top: 2px; }
    .sum .money { background: linear-gradient(135deg, #0f172a, #1e293b); border-color: #0f172a; }
    .sum .money small { color: #94a3b8; } .sum .money b { color: #fff; }

    .list-head { display: flex; justify-content: space-between; align-items: center; margin: 14px 2px 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .sortsel { border: 0; background: transparent; font-size: 12px; font-weight: 700; color: var(--ink); outline: none; font-family: inherit; }

    /* ---------- rows ---------- */
    .list { display: flex; flex-direction: column; gap: 8px; }
    @media (min-width: 900px) { .list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--card-shadow); transition: transform .15s; min-width: 0; }
    .row:active { transform: scale(.985); }
    .av { position: relative; flex-shrink: 0; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #fff; font-family: "Plus Jakarta Sans", "Noto Sans Myanmar", sans-serif; }
    .av .crown { position: absolute; top: -7px; right: -6px; font-size: 13px; }
    .mid { flex: 1; min-width: 0; }
    .mid .n { font-size: 14.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mid .p { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
    .tag.vip { background: #fef3c7; color: #b45309; } .tag.reg { background: #ecfdf3; color: #15803d; } .tag.new { background: #eff6ff; color: #2563eb; }
    .rt { text-align: right; flex-shrink: 0; }
    .rt b { display: block; font-size: 14px; font-weight: 800; color: var(--ink); font-family: "Plus Jakarta Sans", sans-serif; }
    .rt small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }

    .state { text-align: center; padding: 44px 20px; color: var(--muted); font-size: 13.5px; }
    .state .ico { font-size: 34px; margin-bottom: 8px; color: #cbd5e1; }
    .state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 3px; }
    .state button { margin-top: 12px; background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; }
    .sk { height: 70px; border-radius: 18px; background: linear-gradient(90deg, #e8ecf4 25%, #f3f5fa 50%, #e8ecf4 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    .more { display: block; margin: 14px auto 0; background: #fff; border: 1px solid var(--line); padding: 10px 20px; border-radius: 13px; font-weight: 700; font-size: 13px; color: var(--ink); }

    /* ---------- detail sheet ---------- */
    .backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 1200; }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1210; display: flex; flex-direction: column; max-height: 92vh; max-height: 92dvh; background: #f4f6fb; border-radius: 26px 26px 0 0; box-shadow: 0 -20px 60px rgba(15,23,42,.3); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.85,.25,1); visibility: hidden; }
    .sheet.show { transform: translateY(0); visibility: visible; }
    @media (min-width: 900px) { .sheet { left: auto; top: 0; width: 450px; max-height: none; border-radius: 26px 0 0 26px; transform: translateX(105%); } .sheet.show { transform: translateX(0); } .grab { display: none; } }
    .grab { width: 42px; height: 5px; border-radius: 99px; background: #cbd5e1; margin: 9px auto 0; flex-shrink: 0; }
    .s-head { display: flex; align-items: center; gap: 13px; padding: 14px 18px 8px; }
    .s-head .av { width: 56px; height: 56px; border-radius: 18px; font-size: 22px; }
    .s-head .t { flex: 1; min-width: 0; }
    .s-head .t b { display: block; font-size: 17px; font-weight: 800; color: var(--ink); word-break: break-word; }
    .s-head .t span { font-size: 12.5px; color: var(--muted); }
    .s-close { width: 38px; height: 38px; border-radius: 12px; background: #fff; border: 1px solid var(--line); color: #64748b; font-size: 15px; flex-shrink: 0; }
    .s-body { flex: 1; overflow-y: auto; padding: 6px 18px 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 12px; }
    .acts a, .acts button { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 13.5px; text-decoration: none; }
    .acts .call { background: #16a34a; color: #fff; } .acts .copy { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .acts .full { grid-column: 1 / -1; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .stats > div { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 11px 6px; text-align: center; min-width: 0; }
    .stats b { display: block; font-size: 15px; font-weight: 800; color: var(--ink); font-family: "Plus Jakarta Sans", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats small { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
    .card h4 { margin: 0 0 8px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .3px; }
    .fav { display: flex; flex-wrap: wrap; gap: 6px; }
    .fav span { background: #fff7ed; color: #c2410c; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; }
    .ord { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #f1f5f9; text-decoration: none; color: inherit; }
    .ord:first-of-type { border-top: 0; padding-top: 2px; }
    .ord .a { flex: 1; min-width: 0; }
    .ord .a b { font-size: 13px; font-weight: 700; color: var(--ink); }
    .ord .a small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ord .m { font-size: 13px; font-weight: 800; color: var(--ink); white-space: nowrap; }
    .pill { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; margin-left: 6px; }
    .pill.New { background: #eff6ff; color: #2563eb; } .pill.Processing { background: #fff4ec; color: #ea580c; } .pill.Ready { background: #ecfdf3; color: #16a34a; } .pill.Completed { background: #f1f5f9; color: #64748b; } .pill.Cancelled { background: #fef2f2; color: #dc2626; }
    .muted { color: var(--muted); font-size: 12.5px; text-align: center; padding: 10px 0; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div><b>YNS Kitchen</b><small>Admin Panel</small></div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <main class="main">
    <div class="c-top">
      <div class="c-top-inner">
        <div class="c-bar">
          <button class="ibtn menu-btn-o" onclick="toggleSidebar()" aria-label="Menu" type="button"><i class="fa-solid fa-bars"></i></button>
          <div class="c-title"><h1>Customers</h1><small id="subTitle">ဝယ်သူများ</small></div>
          <button class="ibtn" id="refreshBtn" onclick="loadCustomers()" aria-label="Refresh" type="button"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <label class="search" id="searchBox"><i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="q" placeholder="အမည် သို့မဟုတ် ဖုန်းနံပါတ် ရှာပါ..." oninput="onSearch()" autocomplete="off">
          <button class="x" type="button" onclick="clearSearch()" aria-label="ရှင်းမည်"><i class="fa-solid fa-circle-xmark"></i></button>
        </label>
        <div class="chips" id="chips">
          <button class="chip on" data-seg="all" type="button">အားလုံး</button>
          <button class="chip" data-seg="vip" type="button">👑 VIP</button>
          <button class="chip" data-seg="reg" type="button">ပုံမှန်</button>
          <button class="chip" data-seg="new" type="button">အသစ်</button>
        </div>
      </div>
    </div>

    <div class="c-wrap">
      <div class="sum" id="sum"></div>
      <div class="list-head">
        <span id="countTxt">&nbsp;</span>
        <select class="sortsel" id="sort" onchange="onSort()" aria-label="စီရန်">
          <option value="spent">ငွေအများဆုံး</option>
          <option value="orders">အော်ဒါအများဆုံး</option>
          <option value="recent">မကြာသေးမီ</option>
          <option value="name">အမည်</option>
        </select>
      </div>
      <div class="list" id="list"></div>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Customer အသေးစိတ်">
  <div class="grab"></div>
  <div class="s-head" id="sHead"></div>
  <div class="s-body" id="sBody"></div>
</div>

<script src="js/main.js"></script>
<script>
  let all = [];            // server မှ ရလာသမျှ
  let seg = "all", sortBy = "spent", query = "";
  let shown = 30;          // တစ်ကြိမ်ပြမည့် အရေအတွက်
  let openPhone = null;

  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = v => Number(String(v ?? 0).replace(/[^\d.\-]/g, "")) || 0;
  const mny = n => typeof money === "function" ? money(n) : Math.round(n).toLocaleString() + " Ks";
  const short = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : Math.round(n).toLocaleString();
  const isTel = p => /^[+\d][\d\s\-()]{5,}$/.test(String(p || "").trim());
  const PAL = ["#2563eb", "#0d9488", "#7c3aed", "#ea580c", "#db2777", "#4f46e5", "#0891b2", "#65a30d"];
  const colorOf = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
  const initial = n => { const t = String(n || "?").trim(); return (Array.from(t)[0] || "?").toUpperCase(); };

  function toDate(s) {
    if (!s) return null;
    const d = new Date(/[zZ]$|[+-]\d\d:?\d\d$/.test(s) ? s : String(s).replace(" ", "T") + "Z");
    return isNaN(d) ? null : d;
  }
  function ago(s) {
    const d = toDate(s); if (!d) return "-";
    const m = Math.floor((Date.now() - d) / 60000);
    if (m < 1) return "ယခုလေးတင်";
    if (m < 60) return m + " မိနစ်က";
    const h = Math.floor(m / 60); if (h < 24) return h + " နာရီက";
    const dd = Math.floor(h / 24); if (dd < 30) return dd + " ရက်က";
    const mo = Math.floor(dd / 30); return mo < 12 ? mo + " လက" : Math.floor(mo / 12) + " နှစ်က";
  }
  // ဝယ်သူအမျိုးအစား: VIP = ၅ ကြိမ်နှင့်အထက် (သို့) ၅၀,၀၀၀ Ks နှင့်အထက်၊ ပုံမှန် = ၂ ကြိမ်နှင့်အထက်၊ အသစ် = ၁ ကြိမ်
  function kind(c) {
    const o = num(c.orders), s = num(c.spent);
    if (o >= 5 || s >= 50000) return "vip";
    if (o >= 2) return "reg";
    return "new";
  }
  const KIND_TXT = { vip: "VIP", reg: "ပုံမှန်", new: "အသစ်" };

  async function loadCustomers() {
    const btn = $("refreshBtn"); btn.classList.add("spin");
    if (!all.length) $("list").innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    try {
      const res = await apiFetch("/api/admin/customers");
      all = (res && res.customers) ? res.customers : (Array.isArray(res) ? res : []);
      render();
    } catch (e) {
      if (!all.length) $("list").innerHTML = '<div class="state"><div class="ico"><i class="fa-solid fa-triangle-exclamation"></i></div><b>Data ရယူ၍ မရပါ</b>အင်တာနက် သို့မဟုတ် Admin Key ကို စစ်ပါ<br><button type="button" onclick="loadCustomers()">ပြန်ကြိုးစားမည်</button></div>';
    } finally { btn.classList.remove("spin"); }
  }

  function filtered() {
    const q = query.toLowerCase().replace(/[\s\-()+]/g, "");
    let l = all.filter(c => {
      if (seg !== "all" && kind(c) !== seg) return false;
      if (!q) return true;
      return String(c.name || "").toLowerCase().includes(query.toLowerCase().trim()) ||
             String(c.phone || "").toLowerCase().replace(/[\s\-()+]/g, "").includes(q);
    });
    const by = {
      spent: (a, b) => num(b.spent) - num(a.spent),
      orders: (a, b) => num(b.orders) - num(a.orders) || num(b.spent) - num(a.spent),
      recent: (a, b) => String(b.last_order || "").localeCompare(String(a.last_order || "")),
      name: (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "my"),
    }[sortBy];
    return l.sort(by);
  }

  function render() {
    // အနှစ်ချုပ်
    const tot = all.length, rep = all.filter(c => num(c.orders) >= 2).length, sp = all.reduce((a, c) => a + num(c.spent), 0);
    $("sum").innerHTML = `
      <div><small>ဝယ်သူ</small><b>${tot}</b></div>
      <div><small>ပြန်ဝယ်သူ</small><b>${rep}${tot ? ` <span style="font-size:11px;color:var(--muted);font-weight:700">${Math.round(rep / tot * 100)}%</span>` : ""}</b></div>
      <div class="money"><small>စုစုပေါင်း</small><b>${short(sp)} Ks</b></div>`;
    $("subTitle").textContent = tot ? `ဝယ်သူ ${tot} ယောက်` : "ဝယ်သူများ";

    const l = filtered(), vis = l.slice(0, shown);
    $("countTxt").textContent = l.length === all.length ? `${l.length} ယောက်` : `${l.length} / ${all.length} ယောက်`;

    if (!all.length) {
      $("list").innerHTML = '<div class="state" style="grid-column:1/-1"><div class="ico"><i class="fa-solid fa-users"></i></div><b>ဝယ်သူ မရှိသေးပါ</b>အော်ဒါတင်သူများ ဤနေရာတွင် အလိုအလျောက် စာရင်းဝင်ပါမည်</div>';
      return;
    }
    if (!l.length) {
      $("list").innerHTML = '<div class="state" style="grid-column:1/-1"><div class="ico"><i class="fa-solid fa-magnifying-glass"></i></div><b>ရှာမတွေ့ပါ</b>အခြားစကားလုံးဖြင့် ရှာကြည့်ပါ</div>';
      return;
    }
    $("list").innerHTML = vis.map(c => {
      const k = kind(c), name = c.name || "အမည်မသိ";
      return `<button class="row" type="button" onclick="openSheet('${esc(encodeURIComponent(c.phone))}')">
        <div class="av" style="background:${colorOf(c.phone)}">${esc(initial(name))}${k === "vip" ? '<span class="crown">👑</span>' : ""}</div>
        <div class="mid"><div class="n">${esc(name)}<span class="tag ${k}">${KIND_TXT[k]}</span></div><div class="p">${esc(c.phone)}</div></div>
        <div class="rt"><b>${mny(num(c.spent))}</b><small>${num(c.orders)} ကြိမ် · ${ago(c.last_order)}</small></div>
      </button>`;
    }).join("") + (l.length > shown ? `<button class="more" style="grid-column:1/-1" type="button" onclick="shown+=30;render()">နောက်ထပ် ${Math.min(30, l.length - shown)} ယောက် ပြမည်</button>` : "");
  }

  let _t;
  function onSearch() { query = $("q").value; $("searchBox").classList.toggle("has", !!query); clearTimeout(_t); _t = setTimeout(() => { shown = 30; render(); }, 120); }
  function clearSearch() { $("q").value = ""; onSearch(); $("q").focus(); }
  function onSort() { sortBy = $("sort").value; shown = 30; render(); }
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    seg = b.dataset.seg; shown = 30;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    render();
  });

  // ================= Detail sheet =================
  async function openSheet(enc) {
    const phone = decodeURIComponent(enc);
    const c = all.find(x => String(x.phone) === phone); if (!c) return;
    openPhone = phone;
    const k = kind(c), name = c.name || "အမည်မသိ", o = num(c.orders), s = num(c.spent);
    const tel = isTel(phone), tg = /^@/.test(phone) ? phone.slice(1) : null;
    $("sHead").innerHTML = `
      <div class="av" style="background:${colorOf(phone)}">${esc(initial(name))}${k === "vip" ? '<span class="crown">👑</span>' : ""}</div>
      <div class="t"><b>${esc(name)}<span class="tag ${k}">${KIND_TXT[k]}</span></b><span>${esc(phone)}</span></div>
      <button class="s-close" type="button" onclick="closeSheet()" aria-label="ပိတ်မည်"><i class="fa-solid fa-xmark"></i></button>`;
    $("sBody").innerHTML = `
      <div class="acts">
        ${tel ? `<a class="call" href="tel:${esc(phone.replace(/[^\d+]/g, ""))}"><i class="fa-solid fa-phone"></i> ဖုန်းခေါ်မည်</a>`
              : tg ? `<a class="call" href="https://t.me/${esc(tg)}" target="_blank" rel="noopener"><i class="fa-brands fa-telegram"></i> Telegram</a>`
              : `<span></span>`}
        <button class="copy" type="button" onclick="copyPhone()"><i class="fa-regular fa-copy"></i> ကူးမည်</button>
      </div>
      <div class="stats">
        <div><b>${o}</b><small>အော်ဒါ</small></div>
        <div><b>${short(s)}</b><small>စုစုပေါင်း Ks</small></div>
        <div><b>${o ? short(s / o) : 0}</b><small>ပျမ်းမျှ Ks</small></div>
      </div>
      <div class="card"><h4>နောက်ဆုံး မှာယူခဲ့ချိန်</h4><div style="font-size:14px;font-weight:700;color:var(--ink)">${ago(c.last_order)} <span style="color:var(--muted);font-weight:500;font-size:12.5px">· ${esc(typeof fmtDate === "function" ? fmtDate(c.last_order) : c.last_order)}</span></div></div>
      <div id="favBox"></div>
      <div class="card"><h4>မှာယူခဲ့သော အော်ဒါများ</h4><div id="ordBox"><div class="muted"><i class="fa-solid fa-spinner fa-spin"></i> ရယူနေသည်...</div></div></div>`;
    $("backdrop").classList.add("show"); $("sheet").classList.add("show");
    try { history.pushState({ sheet: 1 }, ""); } catch (_) {}
    $("sBody").scrollTop = 0;

    // ဤဝယ်သူ၏ အော်ဒါများ (phone ဖြင့် ရှာ)
    try {
      const res = await apiFetch("/api/admin/orders?search=" + encodeURIComponent(phone) + "&pageSize=50");
      if (openPhone !== phone) return;
      const list = (res.orders || []).filter(x => String(x.phone) === phone);
      const box = $("ordBox");
      if (!list.length) { box.innerHTML = '<div class="muted">အော်ဒါ မတွေ့ပါ</div>'; return; }

      // အကြိုက်ဆုံး ပစ္စည်းများ
      const cnt = {};
      list.forEach(x => { let it = []; try { it = JSON.parse(x.items_json || "[]"); } catch (_) {} (Array.isArray(it) ? it : []).forEach(i => { const n = i.name || i.title; if (n) cnt[n] = (cnt[n] || 0) + (num(i.qty ?? i.quantity) || 1); }); });
      const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 4);
      if (top.length) $("favBox").innerHTML = `<div class="card"><h4>အကြိုက်ဆုံး ပစ္စည်းများ</h4><div class="fav">${top.map(([n, q]) => `<span>${esc(n)} ×${q}</span>`).join("")}</div></div>`;

      box.innerHTML = list.slice(0, 10).map(x => {
        let it = []; try { it = JSON.parse(x.items_json || "[]"); } catch (_) {}
        const sum = (Array.isArray(it) ? it : []).map(i => esc(i.name || "?") + " ×" + (num(i.qty ?? i.quantity) || 1)).join(", ") || "—";
        const st = x.status || "New";
        return `<a class="ord" href="orders.html#o${esc(x.id)}"><div class="a"><b>${esc(x.voucher_code || "#" + x.id)}<span class="pill ${esc(st)}">${esc(st)}</span></b><small>${esc(ago(x.created_at))} · ${sum}</small></div><div class="m">${mny(num(x.total))}</div></a>`;
      }).join("") + (list.length > 10 ? `<div class="muted">နောက်ဆုံး ၁၀ ခုကိုသာ ပြထားသည်</div>` : "");
    } catch (_) { if (openPhone === phone) $("ordBox").innerHTML = '<div class="muted">အော်ဒါများ ရယူ၍မရပါ</div>'; }
  }

  function closeSheet(fromPop) {
    if (!$("sheet").classList.contains("show")) return;
    $("sheet").classList.remove("show"); $("backdrop").classList.remove("show"); openPhone = null;
    if (!fromPop) { try { if (history.state && history.state.sheet) history.back(); } catch (_) {} }
  }
  window.addEventListener("popstate", () => closeSheet(true));
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  async function copyPhone() {
    try { await navigator.clipboard.writeText(openPhone || ""); showToast("ကူးပြီးပါပြီ ✅"); }
    catch (_) { showToast(openPhone || ""); }
  }

  window.onload = function () {
    if (typeof renderAdminLayout === "function") renderAdminLayout("customers");
    loadCustomers();
  };
</script>
</body>
</html>
