<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>မြင်သာကြက်ကင် • Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">🍗</div><div><b>မြင်သာကြက်ကင်</b><small>Premium Admin</small></div></div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
    <div class="side-bottom"><button class="nav" style="background:transparent;color:#aeb8c8;width:100%;padding:11px 12px" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1>Dashboard</h1><p>လုပ်ငန်းအခြေအနေကို တစ်နေရာတည်းက ကြည့်ရှုစီမံပါ</p></div>
    </header>

    <div class="card panel">
      <h2>Overview Summary</h2>
      <div id="summaryBox" style="margin-top:15px;">Loading metrics...</div>
    </div>
  </main>
</div>

<script src="js/main.js"></script>
<script>
  window.onload = async () => {
    renderAdminLayout("dashboard");
    try {
      const s = await apiFetch("/api/admin/stats");
      if (s.ok) {
        document.getElementById("summaryBox").innerHTML = `
          <p>Today Revenue: <b>${money(s.revenue.today)}</b></p>
          <p>Today Orders: <b>${s.orders.today}</b></p>
        `;
      }
    } catch(e) { console.error(e); }
  };
</script>
</body>
</html>
