<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Inventory • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --c-bg: #f6f3ee; --c-card: #ffffff; --c-ink: #1c1917; --c-sub: #78716c; --c-line: #ebe5dc; --c-soft: #f3efe8;
      --c-gold: #c9892b; --c-gold-d: #9a6516; --c-gold-bg: #fdf4e3; --c-dark: #1c1917; --c-dark2: #2b2420;
      --good: #15803d; --good-bg: #ecfdf3; --bad: #dc2626; --bad-bg: #fef2f2; --warn: #c2680c; --warn-bg: #fff7e6;
      --sh: 0 1px 2px rgba(28,25,23,.04), 0 12px 28px -16px rgba(60,40,15,.28);
      --sh-lg: 0 24px 60px -20px rgba(60,40,15,.45);
    }
    html, body { overflow-x: hidden; }
    body { line-height: 1.5; background: var(--c-bg); color: var(--c-ink); font-family: "Noto Sans Myanmar", "Plus Jakarta Sans", system-ui, sans-serif; }
    button { font-family: inherit; cursor: pointer; border: 0; }
    .main { padding: 0 14px 120px; min-width: 0; }
    .i-wrap { max-width: 880px; margin: 0 auto; }
    @media (min-width: 769px) { .main { padding: 0 30px 100px; } .menu-btn-o { display: none !important; } }

    /* ---------- top ---------- */
    .i-top { position: sticky; top: 0; z-index: 40; margin: 0 -14px; padding: 12px 14px 10px; background: rgba(246,243,238,.88); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); }
    @media (min-width: 769px) { .i-top { margin: 0 -30px; padding: 22px 30px 12px; } }
    .i-top-inner { max-width: 880px; margin: 0 auto; }
    .i-bar { display: flex; align-items: center; gap: 12px; }
    .i-title { flex: 1; min-width: 0; }
    .i-title h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.5px; line-height: 1.25; font-family: "Plus Jakarta Sans", "Noto Sans Myanmar", sans-serif; }
    .i-title h1 em { font-style: normal; color: var(--c-gold); }
    .i-title small { display: block; font-size: 12px; color: var(--c-sub); font-weight: 500; margin-top: 1px; }
    .ibtn { width: 44px; height: 44px; flex-shrink: 0; border-radius: 15px; background: var(--c-card); border: 1px solid var(--c-line); display: grid; place-items: center; font-size: 15px; color: var(--c-ink); box-shadow: 0 1px 2px rgba(28,25,23,.05); transition: transform .15s, box-shadow .2s; }
    .ibtn:hover { box-shadow: var(--sh); } .ibtn:active { transform: scale(.92); }
    .ibtn.spin i { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search { display: flex; align-items: center; gap: 10px; background: var(--c-card); border: 1px solid var(--c-line); border-radius: 16px; padding: 0 15px; margin-top: 13px; box-shadow: 0 1px 2px rgba(28,25,23,.04); transition: border-color .2s, box-shadow .2s; }
    .search:focus-within { border-color: var(--c-gold); box-shadow: 0 0 0 4px rgba(201,137,43,.14); }
    .search i { color: #a8a29e; font-size: 14px; }
    .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 13px 0; font-size: 14.5px; font-family: inherit; color: var(--c-ink); }

    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 11px; }
    .tab { min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 9px 2px 8px; border-radius: 16px; background: var(--c-card); border: 1px solid var(--c-line); color: var(--c-sub); box-shadow: 0 1px 2px rgba(28,25,23,.04); transition: all .22s; }
    .tab b { font-size: 19px; font-weight: 800; line-height: 1.2; color: var(--c-ink); font-family: "Plus Jakarta Sans", sans-serif; }
    .tab span { font-size: 11px; font-weight: 600; line-height: 1.6; white-space: nowrap; }
    .tab.on { background: linear-gradient(145deg, var(--c-dark2), var(--c-dark)); border-color: var(--c-dark); color: #d6cfc6; box-shadow: 0 10px 22px -10px rgba(28,25,23,.7); transform: translateY(-1px); }
    .tab.on b { color: #f5c46a; }
    .tab.out:not(.on) b { color: var(--bad); } .tab.low:not(.on) b { color: var(--warn); }

    /* ---------- auto strip ---------- */
    .auto { margin-top: 14px; display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 20px; background: linear-gradient(135deg, var(--c-dark2) 0%, var(--c-dark) 100%); color: #fff; box-shadow: var(--sh); position: relative; overflow: hidden; }
    .auto::after { content: ""; position: absolute; right: -30px; top: -40px; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle, rgba(245,196,106,.28), transparent 70%); pointer-events: none; }
    .auto .ic { flex-shrink: 0; width: 40px; height: 40px; border-radius: 13px; background: rgba(245,196,106,.16); color: #f5c46a; display: grid; place-items: center; font-size: 16px; }
    .auto.off .ic { background: rgba(255,255,255,.08); color: #a8a29e; }
    .auto .tx { flex: 1; min-width: 0; position: relative; z-index: 1; } .auto .tx b { display: block; font-size: 13.5px; font-weight: 700; }
    .auto .tx small { display: block; font-size: 11.5px; color: #b8aea2; font-weight: 500; line-height: 1.65; }
    .auto .go { color: #78716c; font-size: 13px; position: relative; z-index: 1; }

    /* ---------- list ---------- */
    .list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    @media (min-width: 900px) { .list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } }
    .grp { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; color: var(--c-sub); letter-spacing: .4px; margin: 10px 4px 0; }
    .grp::after { content: ""; flex: 1; height: 1px; background: var(--c-line); }
    .row { display: flex; align-items: center; gap: 13px; padding: 12px 13px; background: var(--c-card); border: 1px solid var(--c-line); border-radius: 22px; box-shadow: var(--sh); min-width: 0; transition: transform .2s, box-shadow .2s, opacity .2s; animation: rise .35s both; }
    .row:hover { transform: translateY(-2px); box-shadow: var(--sh-lg); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .row.out { background: #fffbfa; border-color: #f6d3cf; }
    .row.out .thumb { filter: grayscale(1); opacity: .5; }
    .thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(145deg, #f7efe1, #efe3cc) center / cover no-repeat; display: grid; place-items: center; font-size: 26px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
    .body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
    .body .n { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body .d { font-size: 12px; color: var(--c-sub); margin-top: 1px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; line-height: 1.6; }
    .body .m { font-size: 12px; color: var(--c-sub); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .price { font-weight: 800; color: var(--c-gold-d); font-family: "Plus Jakarta Sans", sans-serif; font-size: 13px; }
    .badge { font-size: 10.5px; font-weight: 800; padding: 2px 9px; border-radius: 99px; }
    .badge.ok { background: var(--good-bg); color: var(--good); } .badge.no { background: var(--bad-bg); color: var(--bad); } .badge.lo { background: var(--warn-bg); color: var(--warn); }
    .badge.op { background: var(--c-gold-bg); color: var(--c-gold-d); }
    .meter { height: 5px; border-radius: 99px; background: var(--c-soft); margin-top: 7px; overflow: hidden; max-width: 170px; }
    .meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #22a35a, #15803d); transition: width .3s; } .meter i.lo { background: linear-gradient(90deg, #f0a43a, var(--warn)); } .meter i.no { background: var(--bad); }
    .ctl { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
    .stepper { display: flex; align-items: center; background: var(--c-soft); border-radius: 13px; }
    .stepper button { background: transparent; width: 32px; height: 32px; font-size: 14px; color: var(--c-ink); border-radius: 11px; }
    .stepper button:active { background: #e7e0d4; }
    .stepper b { min-width: 26px; text-align: center; font-size: 14px; font-weight: 800; font-family: "Plus Jakarta Sans", sans-serif; }

    .sw { position: relative; width: 50px; height: 30px; border-radius: 99px; background: #d6d0c7; transition: background .2s; flex-shrink: 0; display: inline-block; }
    .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .22s cubic-bezier(.3,1.4,.5,1); }
    .sw.on { background: var(--good); } .sw.on::after { transform: translateX(20px); }

    .state { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--c-sub); font-size: 13.5px; }
    .state .ico { font-size: 38px; margin-bottom: 10px; color: #d6cfc6; } .state b { display: block; color: var(--c-ink); font-size: 15px; margin-bottom: 3px; }
    .state button { margin-top: 14px; background: var(--c-dark); color: #fff; padding: 10px 18px; border-radius: 13px; font-weight: 700; font-size: 13px; }
    .sk { height: 88px; border-radius: 22px; background: linear-gradient(90deg, #ece6db 25%, #f6f2ea 50%, #ece6db 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }

    .fab { position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 60; display: flex; align-items: center; gap: 9px; background: linear-gradient(135deg, #d99a35, #b9731c); color: #fff; padding: 15px 22px; border-radius: 20px; font-weight: 800; font-size: 14px; box-shadow: 0 16px 32px -10px rgba(185,115,28,.7); transition: transform .15s; }
    .fab:active { transform: scale(.94); }

    /* ---------- sheet ---------- */
    .backdrop { position: fixed; inset: 0; background: rgba(28,25,23,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 1200; }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1210; display: flex; flex-direction: column; max-height: 94vh; max-height: 94dvh; background: var(--c-bg); border-radius: 28px 28px 0 0; box-shadow: 0 -24px 70px rgba(28,25,23,.35); transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.85,.25,1); visibility: hidden; }
    .sheet.show { transform: translateY(0); visibility: visible; }
    @media (min-width: 900px) { .sheet { left: auto; top: 0; width: 480px; max-height: none; border-radius: 28px 0 0 28px; transform: translateX(105%); } .sheet.show { transform: translateX(0); } .grab { display: none; } }
    .grab { width: 44px; height: 5px; border-radius: 99px; background: #d6cfc6; margin: 10px auto 0; flex-shrink: 0; }
    .s-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px 8px; }
    .s-head h3 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
    .s-close { width: 40px; height: 40px; border-radius: 13px; background: var(--c-card); border: 1px solid var(--c-line); color: var(--c-sub); font-size: 15px; }
    .s-body { flex: 1; overflow-y: auto; padding: 6px 20px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .s-foot { display: flex; gap: 9px; padding: 13px 20px calc(15px + env(safe-area-inset-bottom)); background: var(--c-card); border-top: 1px solid var(--c-line); }
    .s-foot button { flex: 1; padding: 15px; border-radius: 16px; font-weight: 800; font-size: 14.5px; transition: transform .15s; } .s-foot button:active { transform: scale(.97); }
    .btn-main { background: linear-gradient(135deg, var(--c-dark2), var(--c-dark)); color: #fff; box-shadow: 0 10px 22px -10px rgba(28,25,23,.7); } .btn-main:disabled { opacity: .55; }
    .btn-del { flex: 0 0 auto !important; background: var(--bad-bg); color: var(--bad); padding: 15px 17px !important; }
    .btn-sub { background: var(--c-card); color: var(--c-ink); border: 1px solid var(--c-line) !important; }
    .btn-warn { background: var(--warn-bg); color: #92400e; border: 1px solid #f6dca4 !important; }

    /* form */
    .sec { margin: 18px 2px 9px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: .6px; color: var(--c-gold-d); text-transform: uppercase; }
    .sec::after { content: ""; flex: 1; height: 1px; background: var(--c-line); }
    .sec:first-child { margin-top: 6px; }
    .fld { margin-bottom: 12px; }
    .fld label { display: block; font-size: 12px; font-weight: 700; color: var(--c-sub); margin: 0 3px 6px; }
    .fld label small { font-weight: 500; color: #a8a29e; }
    .fld input[type=text], .fld input[type=number], .fld input[type=url], .fld select, .fld textarea { width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--c-line); background: var(--c-card); font-size: 15px; outline: none; font-family: inherit; color: var(--c-ink); transition: border-color .2s, box-shadow .2s; }
    .fld textarea { resize: none; line-height: 1.7; min-height: 84px; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--c-gold); box-shadow: 0 0 0 4px rgba(201,137,43,.14); }
    .cnt { text-align: right; font-size: 11px; color: #a8a29e; margin: 3px 4px 0; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .imgrow { display: flex; gap: 11px; align-items: center; }
    .imgrow .pv { flex-shrink: 0; width: 52px; height: 52px; border-radius: 15px; background: linear-gradient(145deg, #f7efe1, #efe3cc) center / cover no-repeat; display: grid; place-items: center; font-size: 22px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
    .imgrow .fld { flex: 1; margin: 0; }
    .opt { display: flex; align-items: center; gap: 12px; background: var(--c-card); border: 1px solid var(--c-line); border-radius: 17px; padding: 13px 14px; margin-bottom: 10px; width: 100%; text-align: left; color: var(--c-ink); }
    .opt .t { flex: 1; min-width: 0; } .opt .t b { display: block; font-size: 13.5px; font-weight: 700; } .opt .t small { display: block; font-size: 11.5px; color: var(--c-sub); line-height: 1.6; }
    .hint { font-size: 11.5px; color: var(--c-sub); line-height: 1.7; margin: -4px 2px 12px; }
    .confirm { display: none; background: var(--bad-bg); border: 1px solid #f6d3cf; border-radius: 16px; padding: 13px 15px; margin: 4px 0 8px; font-size: 13px; color: #991b1b; font-weight: 600; }
    .confirm.show { display: block; }
    .set-block { background: var(--c-card); border: 1px solid var(--c-line); border-radius: 20px; padding: 15px; margin-bottom: 12px; }
    .set-block h4 { margin: 0 0 4px; font-size: 13px; font-weight: 800; } .set-block p { margin: 0 0 10px; font-size: 12px; color: var(--c-sub); line-height: 1.7; }
    .set-block .btns { display: flex; flex-direction: column; gap: 8px; } .set-block .btns button { padding: 13px; border-radius: 14px; font-weight: 700; font-size: 13.5px; }

    /* ---------- options builder ---------- */
    .presets { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 11px; }
    .preset { padding: 8px 13px; border-radius: 99px; background: var(--c-gold-bg); color: var(--c-gold-d); font-size: 12px; font-weight: 700; border: 1px dashed #e7c688; transition: transform .15s; } .preset:active { transform: scale(.95); }
    .og { background: var(--c-card); border: 1px solid var(--c-line); border-radius: 20px; padding: 13px; margin-bottom: 11px; box-shadow: 0 1px 2px rgba(28,25,23,.03); animation: rise .25s both; }
    .og-h { display: flex; gap: 8px; align-items: center; }
    .og-h .gi { width: 34px; height: 34px; flex-shrink: 0; border-radius: 11px; background: var(--c-gold-bg); color: var(--c-gold-d); display: grid; place-items: center; font-size: 13px; }
    .og-h input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--c-line); background: var(--c-soft); font-size: 14.5px; font-weight: 700; outline: none; font-family: inherit; color: var(--c-ink); }
    .og-h input:focus, .oc input:focus { border-color: var(--c-gold); background: #fff; box-shadow: 0 0 0 3px rgba(201,137,43,.13); }
    .x { width: 34px; height: 34px; flex-shrink: 0; border-radius: 11px; background: transparent; color: #a8a29e; font-size: 13px; } .x:hover, .x:active { background: var(--bad-bg); color: var(--bad); }
    .og-t { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0 4px; }
    .chip { padding: 6px 12px; border-radius: 99px; background: var(--c-soft); color: var(--c-sub); font-size: 11.5px; font-weight: 700; border: 1px solid transparent; transition: all .18s; }
    .chip.on { background: var(--c-dark); color: #f5c46a; }
    .oc { display: flex; gap: 7px; align-items: center; margin-top: 8px; }
    .oc .dot { width: 8px; height: 8px; border-radius: 50%; background: #e7c688; flex-shrink: 0; margin: 0 4px; }
    .oc input { min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--c-line); background: var(--c-soft); font-size: 14px; outline: none; font-family: inherit; color: var(--c-ink); }
    .oc .on { flex: 1; }
    .oc .pw { display: flex; align-items: center; gap: 4px; flex-shrink: 0; } .oc .pw input { width: 78px; text-align: right; } .oc .pw span { font-size: 12px; color: var(--c-gold-d); font-weight: 800; } .oc .pw em { font-size: 11px; color: var(--c-sub); font-style: normal; }
    .addc { margin-top: 10px; width: 100%; padding: 10px; border-radius: 13px; background: transparent; border: 1px dashed #d6cfc6; color: var(--c-sub); font-size: 12.5px; font-weight: 700; } .addc:hover { border-color: var(--c-gold); color: var(--c-gold-d); }
    .addg { width: 100%; padding: 14px; border-radius: 18px; background: var(--c-card); border: 1.5px dashed #e0c48f; color: var(--c-gold-d); font-size: 13.5px; font-weight: 800; }
    .empty-o { text-align: center; padding: 18px 12px; color: var(--c-sub); font-size: 12.5px; line-height: 1.7; background: var(--c-card); border: 1px dashed var(--c-line); border-radius: 18px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div><b>YNS Kitchen</b><small>Admin Panel</small></div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <main class="main">
    <div class="i-top">
      <div class="i-top-inner">
        <div class="i-bar">
          <button class="ibtn menu-btn-o" onclick="toggleSidebar()" aria-label="Menu" type="button"><i class="fa-solid fa-bars"></i></button>
          <div class="i-title"><h1>Menu <em>Inventory</em></h1><small id="subTitle">ပစ္စည်းစာရင်း</small></div>
          <button class="ibtn" id="refreshBtn" onclick="load()" aria-label="Refresh" type="button"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="q" placeholder="Menu အမည် ရှာပါ..." oninput="onSearch()" autocomplete="off"></label>
        <div class="tabs" id="tabs">
          <button class="tab on" data-t="all" type="button"><b id="cAll">–</b><span>အားလုံး</span></button>
          <button class="tab" data-t="in" type="button"><b id="cIn">–</b><span>ရှိသည်</span></button>
          <button class="tab out" data-t="out" type="button"><b id="cOut">–</b><span>ကုန်သည်</span></button>
          <button class="tab low" data-t="low" type="button"><b id="cLow">–</b><span>နည်းနေ</span></button>
        </div>
      </div>
    </div>

    <div class="i-wrap">
      <button class="auto" id="autoStrip" type="button" onclick="openSettings()"></button>
      <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </div>
  </main>
</div>

<button class="fab" type="button" onclick="openForm()"><i class="fa-solid fa-plus"></i> ပစ္စည်းအသစ်</button>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="s-head"><h3 id="sTitle"></h3><button class="s-close" type="button" onclick="closeSheet()" aria-label="ပိတ်မည်"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="s-body" id="sBody"></div>
  <div class="s-foot" id="sFoot"></div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const parseOpts = p => { try { const a = JSON.parse(p.options_json || "[]"); return Array.isArray(a) ? a : []; } catch (_) { return []; } };
  const hourLabel = h => { h = int(h); const hh = h % 12 || 12; return (h < 12 ? "မနက် " : h < 15 ? "နေ့လယ် " : h < 19 ? "ညနေ " : "ည ") + hh + " နာရီ"; };

  async function load() {

  function render() {

  // ---- optimistic update ----
  async function patch(id, data, okMsg) {
    const p = P.find(x => x.id == id); if (!p) return;
    const before = { ...p };
    Object.assign(p, data); render();
    try { await apiFetch("/api/admin/products/" + id, { method: "PATCH", body: JSON.stringify(data) }); if (okMsg) showToast(okMsg); }
    catch (_) { Object.assign(p, before); render(); }
  }
  function toggleAvail(id) {

      patch(id, { available: 1, ...(tracked(p) && int(p.stock) <= 0 ? { stock: int(p.daily_stock) } : {}) }, `${p.name} ပြန်ရှိပြီ ✅`);
    } else {
      patch(id, { available: 0, ...(tracked(p) ? { stock: 0 } : {}) }, `${p.name} ကုန်ပြီဟု မှတ်ပြီး`);
    }
  }

    clearTimeout(stepTimers[id]);       // ဆက်တိုက်နှိပ်လျှင် နောက်ဆုံးတန်ဖိုးကိုသာ ပို့

    }, 450);
  }

    let avail = form.avail;
    if (track) { if (stock <= 0) avail = false; else if (!form.avail && stock > 0 && editing === null) avail = true; }
    // option များ စစ်ဆေး — အမည်မရှိသော ရွေးချယ်စရာ ဖယ်၊ အုပ်စုအမည် မပါလျှင် သတိပေး
    const options = [];
    for (const g of form.options) {
      const choices = g.choices.map(c => ({ name: String(c.name || "").trim(), price: int(c.price) })).filter(c => c.name);
      const gn = String(g.name || "").trim();
      if (!gn && !choices.length) continue;
      if (!gn) { showToast("Option အုပ်စုအမည် ထည့်ပါ"); return; }
      if (!choices.length) { showToast(`“${gn}” တွင် ရွေးချယ်စရာ ထည့်ပါ`); return; }
      options.push({ name: gn, required: !!g.required, multi: !!g.multi, choices });
    }
    const data = { name, price, category: $("fCat").value.trim(), image: $("fImg").value.trim(), description: ($("fDesc").value || "").trim(), options, available: avail, daily_stock: daily, stock: track ? stock : (editing ? undefined : 0), auto_restock: form.auto };
    if (data.stock === undefined) delete data.stock;
    const b = $("saveBtn"); b.disabled = true; b.textContent = "သိမ်းနေသည်...";
    try {
      if (editing) await apiFetch("/api/admin/products/" + editing, { method: "PATCH", body: JSON.stringify(data) });
      else await apiFetch("/api/admin/products", { method: "POST", body: JSON.stringify(data) });
      showToast(editing ? "ပြင်ပြီးပါပြီ ✅" : "ထည့်ပြီးပါပြီ ✅");
      closeSheet(); load();
    } catch (_) { b.disabled = false; b.textContent = editing ? "သိမ်းမည်" : "ထည့်မည်"; }
  }
  function askDelete() {
    const box = $("delBox"), btn = $("delBtn");
    if (!box.classList.contains("show")) { box.classList.add("show"); btn.innerHTML = '<i class="fa-solid fa-trash-can"></i> ဖျက်မည်'; $("sBody").scrollTop = 9999; return; }
    doDelete();
  }
  async function doDelete() {
    const id = editing, p = P.find(x => x.id == id);
    try { await apiFetch("/api/admin/products/" + id, { method: "DELETE" }); showToast((p ? p.name : "ပစ္စည်း") + " ဖျက်ပြီးပါပြီ"); closeSheet(); load(); } catch (_) {}
  }

  // ---- auto-reset settings ----
  function openSettings() {
    const hrs = Array.from({ length: 24 }, (_, h) => `<option value="${h}"${h == S.reset_hour ? " selected" : ""}>${hourLabel(h)}</option>`).join("");
    showSheet("နေ့စဉ် ပြန်စခြင်း", `
      <button class="opt" type="button" onclick="setAuto()"><div class="t"><b>အလိုအလျောက် ပြန်စမည်</b><small>သတ်မှတ်ချိန်ရောက်ပြီး ကုန်နေဆဲ ဖြစ်လျှင် ပြန်ဖွင့်ပေးမည်။ သင်ကိုယ်တိုင် ပြန်ဖွင့်ပြီးသားဆိုလျှင် မထိပါ။</small></div><span class="sw${S.auto_reset ? " on" : ""}" id="swAR"></span></button>
      <div class="fld"><label>ပြန်စမည့် အချိန် (မြန်မာစံတော်ချိန်)</label><select id="hrSel" onchange="setHour(this.value)">${hrs}</select></div>
      <div class="hint">⚠️ Cloudflare Worker တွင် Cron Trigger <b>* * * * *</b> ထည့်ထားမှ အလိုအလျောက် အလုပ်လုပ်ပါမည်။</div>
      <div class="set-block"><h4>ယခုချက်ချင်း ပြန်စမည်</h4><p>မနက်ဖြန်ကို မစောင့်ချင်သည့်အခါ ကိုယ်တိုင် နှိပ်နိုင်သည်။</p>
        <div class="btns"><button class="btn-main" type="button" onclick="manualReset('soldout')">ကုန်နေသည်များကို ပြန်ဖွင့်မည်</button>
        <button class="btn-warn" type="button" onclick="manualReset('all')">အားလုံးကို နေ့စဉ်အရေအတွက်သို့ ပြန်စမည်</button></div></div>`,
      '<button class="btn-sub" type="button" onclick="closeSheet()">ပိတ်မည်</button>');
  }
  async function setAuto() {
    const v = !S.auto_reset; S.auto_reset = v; $("swAR").classList.toggle("on", v); render();
    try { await apiFetch("/api/admin/inventory/settings", { method: "POST", body: JSON.stringify({ auto_reset: v }) }); showToast(v ? "အလိုအလျောက် ပြန်စမည် ✅" : "ပိတ်ထားသည်"); }
    catch (_) { S.auto_reset = !v; $("swAR").classList.toggle("on", !v); render(); }
  }
  async function setHour(h) {
    const old = S.reset_hour; S.reset_hour = int(h); render();
    try { await apiFetch("/api/admin/inventory/settings", { method: "POST", body: JSON.stringify({ reset_hour: int(h) }) }); showToast("နေ့စဉ် " + hourLabel(h) + " တွင် ပြန်စမည်"); }
    catch (_) { S.reset_hour = old; $("hrSel").value = old; render(); }
  }
  async function manualReset(mode) {
    if (mode === "all" && !confirm("auto ပြန်စ ဖွင့်ထားသော ပစ္စည်းအားလုံးကို နေ့စဉ်အရေအတွက်သို့ ပြန်ထားမည်။ သေချာပါသလား?")) return;
    try { const r = await apiFetch("/api/admin/inventory/reset", { method: "POST", body: JSON.stringify({ mode }) }); showToast(`ပစ္စည်း ${r.changed || 0} မျိုး ပြန်စပြီး ✅`); closeSheet(); load(); } catch (_) {}
  }

  window.onload = function () { if (typeof renderAdminLayout === "function") renderAdminLayout("inventory"); load(); };
</script>
</body>
</html>
