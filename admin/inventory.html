<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Inventory • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root { --good: #16a34a; --good-bg: #ecfdf3; --bad: #dc2626; --bad-bg: #fef2f2; --warn: #d97706; --warn-bg: #fffbeb; --blue: #2563eb;
      --card-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 24px -14px rgba(15,23,42,.18); }
    html, body { overflow-x: hidden; }
    body { line-height: 1.5; }
    .main { padding: 0 14px 110px; min-width: 0; }
    .i-wrap { max-width: 860px; margin: 0 auto; }
    @media (min-width: 769px) { .main { padding: 0 28px 90px; } .menu-btn-o { display: none !important; } }

    .i-top { position: sticky; top: 0; z-index: 40; margin: 0 -14px; padding: 10px 14px; background: rgba(244,246,251,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    @media (min-width: 769px) { .i-top { margin: 0 -28px; padding: 18px 28px 12px; } }
    .i-top-inner { max-width: 860px; margin: 0 auto; }
    .i-bar { display: flex; align-items: center; gap: 10px; }
    .i-title { flex: 1; min-width: 0; }
    .i-title h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.3px; color: var(--ink); line-height: 1.3; }
    .i-title small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
    .ibtn { width: 42px; height: 42px; flex-shrink: 0; border-radius: 13px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; font-size: 15px; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.05); transition: transform .15s; }
    .ibtn:active { transform: scale(.93); }
    .ibtn.spin i { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search { display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 0 13px; margin-top: 11px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .search i { color: #94a3b8; font-size: 13px; }
    .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 12px 0; font-size: 14px; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .tab { min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 7px 2px 6px; border-radius: 14px; background: #fff; border: 1px solid var(--line); color: var(--muted); box-shadow: 0 1px 2px rgba(15,23,42,.04); transition: .2s; }
    .tab b { font-size: 17px; font-weight: 800; line-height: 1.25; color: var(--ink); font-family: "Plus Jakarta Sans", sans-serif; }
    .tab span { font-size: 10.5px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
    .tab.on { background: var(--navy); border-color: var(--navy); color: #cbd5e1; } .tab.on b { color: #fff; }
    .tab.out:not(.on) b { color: var(--bad); } .tab.low:not(.on) b { color: var(--warn); }

    /* ---------- auto-reset strip ---------- */
    .auto { margin-top: 12px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 18px; background: #fff; border: 1px solid var(--line); box-shadow: var(--card-shadow); }
    .auto .ic { flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; background: #eff6ff; color: var(--blue); display: grid; place-items: center; font-size: 16px; }
    .auto.off .ic { background: #f1f5f9; color: #94a3b8; }
    .auto .tx { flex: 1; min-width: 0; } .auto .tx b { display: block; font-size: 13.5px; font-weight: 800; color: var(--ink); }
    .auto .tx small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; line-height: 1.6; }
    .auto .go { color: #cbd5e1; font-size: 13px; }

    /* ---------- list ---------- */
    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    @media (min-width: 900px) { .list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } }
    .grp { grid-column: 1 / -1; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .3px; margin: 8px 4px 0; }
    .row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--card-shadow); min-width: 0; transition: opacity .2s; }
    .row.out { background: #fffafa; border-color: #fecaca; }
    .row.out .thumb { filter: grayscale(1); opacity: .55; }
    .thumb { flex-shrink: 0; width: 50px; height: 50px; border-radius: 14px; background: #f1f5f9 center / cover no-repeat; display: grid; place-items: center; font-size: 22px; }
    .body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
    .body .n { font-size: 14.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body .m { font-size: 12px; color: var(--muted); margin-top: 1px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { font-size: 10.5px; font-weight: 800; padding: 1px 8px; border-radius: 99px; }
    .badge.ok { background: var(--good-bg); color: var(--good); } .badge.no { background: var(--bad-bg); color: var(--bad); } .badge.lo { background: var(--warn-bg); color: var(--warn); }
    .meter { height: 5px; border-radius: 99px; background: #eef1f6; margin-top: 6px; overflow: hidden; max-width: 160px; }
    .meter i { display: block; height: 100%; border-radius: 99px; background: var(--good); transition: width .3s; } .meter i.lo { background: var(--warn); } .meter i.no { background: var(--bad); }
    .ctl { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .stepper { display: flex; align-items: center; background: #f1f5f9; border-radius: 12px; }
    .stepper button { background: transparent; width: 32px; height: 32px; font-size: 14px; color: var(--ink); border-radius: 10px; }
    .stepper button:active { background: #e2e8f0; }
    .stepper b { min-width: 26px; text-align: center; font-size: 14px; font-weight: 800; font-family: "Plus Jakarta Sans", sans-serif; }

    .sw { position: relative; width: 50px; height: 30px; border-radius: 99px; background: #cbd5e1; transition: background .2s; flex-shrink: 0; }
    .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
    .sw.on { background: var(--good); } .sw.on::after { transform: translateX(20px); }

    .state { grid-column: 1 / -1; text-align: center; padding: 44px 20px; color: var(--muted); font-size: 13.5px; }
    .state .ico { font-size: 34px; margin-bottom: 8px; color: #cbd5e1; } .state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 3px; }
    .state button { margin-top: 12px; background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; }
    .sk { height: 74px; border-radius: 18px; background: linear-gradient(90deg, #e8ecf4 25%, #f3f5fa 50%, #e8ecf4 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }

    .fab { position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 60; display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; padding: 14px 20px; border-radius: 18px; font-weight: 800; font-size: 14px; box-shadow: 0 14px 30px -10px rgba(15,23,42,.6); transition: transform .15s; }
    .fab:active { transform: scale(.95); }

    /* ---------- sheet ---------- */
    .backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 1200; }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1210; display: flex; flex-direction: column; max-height: 92vh; max-height: 92dvh; background: #f4f6fb; border-radius: 26px 26px 0 0; box-shadow: 0 -20px 60px rgba(15,23,42,.3); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.85,.25,1); visibility: hidden; }
    .sheet.show { transform: translateY(0); visibility: visible; }
    @media (min-width: 900px) { .sheet { left: auto; top: 0; width: 440px; max-height: none; border-radius: 26px 0 0 26px; transform: translateX(105%); } .sheet.show { transform: translateX(0); } .grab { display: none; } }
    .grab { width: 42px; height: 5px; border-radius: 99px; background: #cbd5e1; margin: 9px auto 0; flex-shrink: 0; }
    .s-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 8px; }
    .s-head h3 { flex: 1; margin: 0; font-size: 17px; font-weight: 800; color: var(--ink); }
    .s-close { width: 38px; height: 38px; border-radius: 12px; background: #fff; border: 1px solid var(--line); color: #64748b; font-size: 15px; }
    .s-body { flex: 1; overflow-y: auto; padding: 6px 18px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .s-foot { display: flex; gap: 8px; padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); }
    .s-foot button { flex: 1; padding: 14px; border-radius: 15px; font-weight: 800; font-size: 14.5px; }
    .btn-main { background: var(--navy); color: #fff; } .btn-main:disabled { opacity: .55; }
    .btn-del { flex: 0 0 auto !important; background: var(--bad-bg); color: var(--bad); padding: 14px 16px !important; }
    .btn-sub { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn-warn { background: var(--warn-bg); color: #92400e; border: 1px solid #fde68a; }

    .fld { margin-bottom: 12px; }
    .fld label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 2px 5px; }
    .fld input[type=text], .fld input[type=number], .fld input[type=url], .fld select { width: 100%; box-sizing: border-box; padding: 12px 13px; border-radius: 13px; border: 1px solid var(--line); background: #fff; font-size: 15px; outline: none; font-family: inherit; }
    .fld input:focus, .fld select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 12px 13px; margin-bottom: 10px; width: 100%; text-align: left; }
    .opt .t { flex: 1; min-width: 0; } .opt .t b { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); } .opt .t small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.55; }
    .hint { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin: -4px 2px 12px; }
    .confirm { display: none; background: var(--bad-bg); border: 1px solid #fecaca; border-radius: 15px; padding: 12px 14px; margin: 4px 0 8px; font-size: 13px; color: #991b1b; font-weight: 600; }
    .confirm.show { display: block; }
    .set-block { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
    .set-block h4 { margin: 0 0 4px; font-size: 13px; font-weight: 800; color: var(--ink); } .set-block p { margin: 0 0 10px; font-size: 12px; color: var(--muted); line-height: 1.65; }
    .set-block .btns { display: flex; flex-direction: column; gap: 8px; } .set-block .btns button { padding: 12px; border-radius: 13px; font-weight: 700; font-size: 13.5px; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div><b>YNS Kitchen</b><small>Admin Panel</small></div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <main class="main">
    <div class="i-top">
      <div class="i-top-inner">
        <div class="i-bar">
          <button class="ibtn menu-btn-o" onclick="toggleSidebar()" aria-label="Menu" type="button"><i class="fa-solid fa-bars"></i></button>
          <div class="i-title"><h1>Inventory</h1><small id="subTitle">ပစ္စည်းစာရင်း</small></div>
          <button class="ibtn" id="refreshBtn" onclick="load()" aria-label="Refresh" type="button"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="q" placeholder="ပစ္စည်းအမည် ရှာပါ..." oninput="onSearch()" autocomplete="off"></label>
        <div class="tabs" id="tabs">
          <button class="tab on" data-t="all" type="button"><b id="cAll">–</b><span>အားလုံး</span></button>
          <button class="tab" data-t="in" type="button"><b id="cIn">–</b><span>ရှိသည်</span></button>
          <button class="tab out" data-t="out" type="button"><b id="cOut">–</b><span>ကုန်သည်</span></button>
          <button class="tab low" data-t="low" type="button"><b id="cLow">–</b><span>နည်းနေ</span></button>
        </div>
      </div>
    </div>

    <div class="i-wrap">
      <button class="auto" id="autoStrip" type="button" onclick="openSettings()"></button>
      <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </div>
  </main>
</div>

<button class="fab" type="button" onclick="openForm()"><i class="fa-solid fa-plus"></i> ပစ္စည်းအသစ်</button>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="s-head"><h3 id="sTitle"></h3><button class="s-close" type="button" onclick="closeSheet()" aria-label="ပိတ်မည်"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="s-body" id="sBody"></div>
  <div class="s-foot" id="sFoot"></div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const int = v => { const n = Math.round(Number(v)); return Number.isFinite(n) && n >= 0 ? n : 0; };
  const fmt = n => int(n).toLocaleString();

  let P = [], S = { auto_reset: true, reset_hour: 15, last_reset: "", last_reset_count: 0 };
  let tab = "all", query = "", editing = null, form = null, loaded = false;

  const tracked = p => int(p.daily_stock) > 0;
  const isOut = p => !(p.available == 1 || p.available === true) || (tracked(p) && int(p.stock) <= 0);
  const isLow = p => !isOut(p) && tracked(p) && int(p.stock) <= Math.max(1, int(p.low_stock_threshold ?? 10) > int(p.daily_stock) ? Math.ceil(int(p.daily_stock) * 0.25) : int(p.low_stock_threshold ?? 10));
  const hourLabel = h => { h = int(h); const hh = h % 12 || 12; return (h < 12 ? "မနက် " : h < 15 ? "နေ့လယ် " : h < 19 ? "ညနေ " : "ည ") + hh + " နာရီ"; };

  async function load() {
    const btn = $("refreshBtn"); btn.classList.add("spin");
    try {
      const [pr, st] = await Promise.all([apiFetch("/api/admin/products"), apiFetch("/api/admin/inventory/settings").catch(() => null)]);
      P = (pr && pr.products) || (Array.isArray(pr) ? pr : []);
      if (st && st.ok) S = st;
      loaded = true; render();
    } catch (e) {
      if (!loaded) $("list").innerHTML = '<div class="state"><div class="ico"><i class="fa-solid fa-triangle-exclamation"></i></div><b>Data ရယူ၍ မရပါ</b>အင်တာနက် သို့မဟုတ် Admin Key ကို စစ်ပါ<br><button type="button" onclick="load()">ပြန်ကြိုးစားမည်</button></div>';
    } finally { btn.classList.remove("spin"); }
  }

  function render() {
    const out = P.filter(isOut), low = P.filter(isLow);
    $("cAll").textContent = P.length; $("cOut").textContent = out.length; $("cLow").textContent = low.length; $("cIn").textContent = P.length - out.length;
    $("subTitle").textContent = out.length ? `ကုန်နေသည် ${out.length} မျိုး` : "ပစ္စည်းအားလုံး ရှိနေသည် ✅";

    const on = S.auto_reset;
    const el = $("autoStrip"); el.className = "auto" + (on ? "" : " off");
    el.innerHTML = `<div class="ic"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <div class="tx"><b>${on ? `နေ့စဉ် ${hourLabel(S.reset_hour)}တွင် stock အသစ်ပြန်စမည်` : "နေ့စဉ် အလိုအလျောက် ပြန်စခြင်း ပိတ်ထားသည်"}</b>
      <small>${on ? "ထိုအချိန်ထိ ကုန်နေဆဲ ပစ္စည်းများကိုသာ ပြန်ဖွင့်ပေးမည်" : "ကိုယ်တိုင်သာ ပြန်ဖွင့်ရမည်"}${S.last_reset ? ` · နောက်ဆုံး ${esc(S.last_reset)} (${S.last_reset_count} မျိုး)` : ""}</small></div><i class="fa-solid fa-chevron-right go"></i>`;

    const q = query.trim().toLowerCase();
    let l = P.filter(p => {
      if (tab === "in" && isOut(p)) return false;
      if (tab === "out" && !isOut(p)) return false;
      if (tab === "low" && !isLow(p)) return false;
      return !q || String(p.name || "").toLowerCase().includes(q) || String(p.category || "").toLowerCase().includes(q);
    });
    l.sort((a, b) => (isOut(b) - isOut(a)) || String(a.category || "").localeCompare(String(b.category || ""), "my") || String(a.name || "").localeCompare(String(b.name || ""), "my"));

    if (!P.length) { $("list").innerHTML = '<div class="state"><div class="ico"><i class="fa-solid fa-box-open"></i></div><b>ပစ္စည်း မရှိသေးပါ</b>အောက်က "ပစ္စည်းအသစ်" ခလုတ်ဖြင့် ထည့်ပါ</div>'; return; }
    if (!l.length) { $("list").innerHTML = `<div class="state"><div class="ico"><i class="fa-solid fa-${tab === "out" ? "circle-check" : "magnifying-glass"}"></i></div><b>${tab === "out" ? "ကုန်နေသော ပစ္စည်း မရှိပါ" : "မတွေ့ပါ"}</b></div>`; return; }

    let html = "", lastOut = null;
    for (const p of l) {
      const o = isOut(p);
      if (tab === "all" && lastOut !== o) { html += `<div class="grp">${o ? "🔴 ကုန်နေသည်" : "🟢 ရှိသည်"}</div>`; lastOut = o; }
      const t = tracked(p), stock = int(p.stock), daily = int(p.daily_stock), low = isLow(p);
      const img = p.image ? `style="background-image:url('${esc(String(p.image).replace(/'/g, "%27"))}')"` : "";
      html += `<div class="row${o ? " out" : ""}" data-id="${p.id}">
        <div class="thumb" ${img}>${p.image ? "" : "🍗"}</div>
        <button class="body" type="button" onclick="openForm(${p.id})" aria-label="ပြင်မည်">
          <div class="n">${esc(p.name)}</div>
          <div class="m"><span>${fmt(p.price)} Ks</span>${p.category ? `<span>· ${esc(p.category)}</span>` : ""}<span class="badge ${o ? "no" : low ? "lo" : "ok"}">${o ? "ကုန်" : low ? "နည်းနေ" : "ရှိ"}</span></div>
          ${t ? `<div class="m" style="margin-top:3px">ကျန် <b style="color:var(--ink)">${stock}</b> / ${daily}</div><div class="meter"><i class="${o ? "no" : low ? "lo" : ""}" style="width:${Math.min(100, daily ? stock / daily * 100 : 0)}%"></i></div>` : ""}
        </button>
        <div class="ctl">
          <button class="sw${o ? "" : " on"}" type="button" onclick="toggleAvail(${p.id})" role="switch" aria-checked="${!o}" aria-label="ရှိ/ကုန်"></button>
          ${t && !o ? `<div class="stepper"><button type="button" onclick="step(${p.id},-1)" aria-label="လျှော့">−</button><b>${stock}</b><button type="button" onclick="step(${p.id},1)" aria-label="တိုး">+</button></div>` : ""}
        </div>
      </div>`;
    }
    $("list").innerHTML = html;
  }

  // ---- optimistic update ----
  async function patch(id, data, okMsg) {
    const p = P.find(x => x.id == id); if (!p) return;
    const before = { ...p };
    Object.assign(p, data); render();
    try { await apiFetch("/api/admin/products/" + id, { method: "PATCH", body: JSON.stringify(data) }); if (okMsg) showToast(okMsg); }
    catch (_) { Object.assign(p, before); render(); }
  }
  function toggleAvail(id) {
    const p = P.find(x => x.id == id); if (!p) return;
    if (isOut(p)) {      // ပြန်ဖွင့် — stock စစ်သောပစ္စည်းဆို နေ့စဉ်အရေအတွက်ပြန်ထည့်
      patch(id, { available: 1, ...(tracked(p) && int(p.stock) <= 0 ? { stock: int(p.daily_stock) } : {}) }, `${p.name} ပြန်ရှိပြီ ✅`);
    } else {
      patch(id, { available: 0, ...(tracked(p) ? { stock: 0 } : {}) }, `${p.name} ကုန်ပြီဟု မှတ်ပြီး`);
    }
  }
  const stepTimers = {};
  function step(id, d) {
    const p = P.find(x => x.id == id); if (!p) return;
    const ns = Math.max(0, int(p.stock) + d);
    p.stock = ns; p.available = ns > 0 ? 1 : 0; render();
    clearTimeout(stepTimers[id]);       // ဆက်တိုက်နှိပ်လျှင် နောက်ဆုံးတန်ဖိုးကိုသာ ပို့
    stepTimers[id] = setTimeout(() => {
      apiFetch("/api/admin/products/" + id, { method: "PATCH", body: JSON.stringify({ stock: p.stock, available: p.stock > 0 ? 1 : 0 }) }).catch(() => load());
    }, 450);
  }

  // ---- search / tabs ----
  let _t; function onSearch() { query = $("q").value; clearTimeout(_t); _t = setTimeout(render, 120); }
  $("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; tab = b.dataset.t; document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); render(); });

  // ---- sheet ----
  function showSheet(title, body, foot) {
    $("sTitle").textContent = title; $("sBody").innerHTML = body; $("sFoot").innerHTML = foot; $("sBody").scrollTop = 0;
    $("backdrop").classList.add("show"); $("sheet").classList.add("show");
    try { history.pushState({ sheet: 1 }, ""); } catch (_) {}
  }
  function closeSheet(fromPop) {
    if (!$("sheet").classList.contains("show")) return;
    $("sheet").classList.remove("show"); $("backdrop").classList.remove("show"); editing = null; form = null;
    if (!fromPop) { try { if (history.state && history.state.sheet) history.back(); } catch (_) {} }
  }
  window.addEventListener("popstate", () => closeSheet(true));
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  // ---- add / edit form ----
  function openForm(id) {
    const p = id ? P.find(x => x.id == id) : null; editing = p ? p.id : null;
    form = p ? { name: p.name || "", price: int(p.price), category: p.category || "", image: p.image || "", track: tracked(p), daily: int(p.daily_stock), stock: int(p.stock), avail: !isOut(p), auto: p.auto_restock === undefined || p.auto_restock === null ? true : (p.auto_restock == 1 || p.auto_restock === true) }
             : { name: "", price: "", category: "", image: "", track: false, daily: "", stock: "", avail: true, auto: true };
    const cats = [...new Set(P.map(x => x.category).filter(Boolean))];
    showSheet(p ? "ပစ္စည်း ပြင်မည်" : "ပစ္စည်းအသစ် ထည့်မည်", `
      <div class="fld"><label>ပစ္စည်းအမည်</label><input type="text" id="fName" value="${esc(form.name)}" placeholder="ဥပမာ ကြက်ရင်အုံ" maxlength="100"></div>
      <div class="two">
        <div class="fld"><label>ဈေး (Ks)</label><input type="number" id="fPrice" inputmode="numeric" min="0" value="${esc(form.price)}" placeholder="4000"></div>
        <div class="fld"><label>အမျိုးအစား</label><input type="text" id="fCat" list="catList" value="${esc(form.category)}" placeholder="အသား" maxlength="50"><datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
      </div>
      <div class="fld"><label>ပုံ link (မထည့်လည်းရ)</label><input type="url" id="fImg" value="${esc(form.image)}" placeholder="https://..."></div>

      <button class="opt" type="button" onclick="fToggle('avail')"><div class="t"><b>ရောင်းနေသည် (ရှိ)</b><small>ပိတ်လိုက်လျှင် ဝယ်သူက မှာမရတော့ပါ</small></div><span class="sw${form.avail ? " on" : ""}" id="swAvail"></span></button>
      <button class="opt" type="button" onclick="fToggle('track')"><div class="t"><b>နေ့စဉ် အရေအတွက် စစ်မည်</b><small>မှာတိုင်း အလိုအလျောက် လျော့ပြီး ၀ ဖြစ်ရင် "ကုန်" ဖြစ်မည်</small></div><span class="sw${form.track ? " on" : ""}" id="swTrack"></span></button>
      <div id="trackBox" style="display:${form.track ? "block" : "none"}">
        <div class="two">
          <div class="fld"><label>နေ့စဉ် စတင်အရေအတွက်</label><input type="number" id="fDaily" inputmode="numeric" min="0" value="${esc(form.daily)}" placeholder="20"></div>
          <div class="fld"><label>ယခု ကျန်ရှိ</label><input type="number" id="fStock" inputmode="numeric" min="0" value="${esc(form.stock)}" placeholder="20"></div>
        </div>
      </div>
      <button class="opt" type="button" onclick="fToggle('auto')"><div class="t"><b>နေ့စဉ် ပြန်စမည်</b><small>ပိတ်ထားလျှင် ဤပစ္စည်းကို အလိုအလျောက် ပြန်မဖွင့်ပါ (ရာသီစာ၊ ရပ်ထားသည့် ပစ္စည်းများအတွက်)</small></div><span class="sw${form.auto ? " on" : ""}" id="swAuto"></span></button>
      <div class="confirm" id="delBox">ဤပစ္စည်းကို အပြီးအပိုင် ဖျက်မှာ သေချာပါသလား? ယခင်အော်ဒါများ မပျက်ပါ။</div>`,
      `${p ? '<button class="btn-del" id="delBtn" type="button" onclick="askDelete()"><i class="fa-solid fa-trash-can"></i></button>' : ""}<button class="btn-main" id="saveBtn" type="button" onclick="saveForm()">${p ? "သိမ်းမည်" : "ထည့်မည်"}</button>`);
    if (!p) setTimeout(() => { try { $("fName").focus(); } catch (_) {} }, 350);
  }
  function fToggle(k) {
    form[k] = !form[k];
    $({ avail: "swAvail", track: "swTrack", auto: "swAuto" }[k]).classList.toggle("on", form[k]);
    if (k === "track") {
      $("trackBox").style.display = form.track ? "block" : "none";
      if (form.track && !int($("fDaily").value)) { $("fDaily").focus(); }
    }
  }
  async function saveForm() {
    const name = $("fName").value.trim(); if (!name) { showToast("ပစ္စည်းအမည် ထည့်ပါ"); $("fName").focus(); return; }
    const price = int($("fPrice").value), track = form.track;
    let daily = track ? int($("fDaily").value) : 0, stock = track ? int($("fStock").value) : 0;
    if (track && daily <= 0) { showToast("နေ့စဉ် စတင်အရေအတွက် ထည့်ပါ"); $("fDaily").focus(); return; }
    if (track && $("fStock").value === "") stock = daily;
    let avail = form.avail;
    if (track) { if (stock <= 0) avail = false; else if (!form.avail && stock > 0 && editing === null) avail = true; }
    const data = { name, price, category: $("fCat").value.trim(), image: $("fImg").value.trim(), available: avail, daily_stock: daily, stock: track ? stock : (editing ? undefined : 0), auto_restock: form.auto };
    if (data.stock === undefined) delete data.stock;
    const b = $("saveBtn"); b.disabled = true; b.textContent = "သိမ်းနေသည်...";
    try {
      if (editing) await apiFetch("/api/admin/products/" + editing, { method: "PATCH", body: JSON.stringify(data) });
      else await apiFetch("/api/admin/products", { method: "POST", body: JSON.stringify(data) });
      showToast(editing ? "ပြင်ပြီးပါပြီ ✅" : "ထည့်ပြီးပါပြီ ✅");
      closeSheet(); load();
    } catch (_) { b.disabled = false; b.textContent = editing ? "သိမ်းမည်" : "ထည့်မည်"; }
  }
  function askDelete() {
    const box = $("delBox"), btn = $("delBtn");
    if (!box.classList.contains("show")) { box.classList.add("show"); btn.innerHTML = '<i class="fa-solid fa-trash-can"></i> ဖျက်မည်'; $("sBody").scrollTop = 9999; return; }
    doDelete();
  }
  async function doDelete() {
    const id = editing, p = P.find(x => x.id == id);
    try { await apiFetch("/api/admin/products/" + id, { method: "DELETE" }); showToast((p ? p.name : "ပစ္စည်း") + " ဖျက်ပြီးပါပြီ"); closeSheet(); load(); } catch (_) {}
  }

  // ---- auto-reset settings ----
  function openSettings() {
    const hrs = Array.from({ length: 24 }, (_, h) => `<option value="${h}"${h == S.reset_hour ? " selected" : ""}>${hourLabel(h)}</option>`).join("");
    showSheet("နေ့စဉ် ပြန်စခြင်း", `
      <button class="opt" type="button" onclick="setAuto()"><div class="t"><b>အလိုအလျောက် ပြန်စမည်</b><small>သတ်မှတ်ချိန်ရောက်ပြီး ကုန်နေဆဲ ဖြစ်လျှင် ပြန်ဖွင့်ပေးမည်။ သင်ကိုယ်တိုင် ပြန်ဖွင့်ပြီးသားဆိုလျှင် မထိပါ။</small></div><span class="sw${S.auto_reset ? " on" : ""}" id="swAR"></span></button>
      <div class="fld"><label>ပြန်စမည့် အချိန် (မြန်မာစံတော်ချိန်)</label><select id="hrSel" onchange="setHour(this.value)">${hrs}</select></div>
      <div class="hint">⚠️ Cloudflare Worker တွင် Cron Trigger <b>* * * * *</b> ထည့်ထားမှ အလိုအလျောက် အလုပ်လုပ်ပါမည်။</div>
      <div class="set-block"><h4>ယခုချက်ချင်း ပြန်စမည်</h4><p>မနက်ဖြန်ကို မစောင့်ချင်သည့်အခါ ကိုယ်တိုင် နှိပ်နိုင်သည်။</p>
        <div class="btns"><button class="btn-main" type="button" onclick="manualReset('soldout')">ကုန်နေသည်များကို ပြန်ဖွင့်မည်</button>
        <button class="btn-warn" type="button" onclick="manualReset('all')">အားလုံးကို နေ့စဉ်အရေအတွက်သို့ ပြန်စမည်</button></div></div>`,
      '<button class="btn-sub" type="button" onclick="closeSheet()">ပိတ်မည်</button>');
  }
  async function setAuto() {
    const v = !S.auto_reset; S.auto_reset = v; $("swAR").classList.toggle("on", v); render();
    try { await apiFetch("/api/admin/inventory/settings", { method: "POST", body: JSON.stringify({ auto_reset: v }) }); showToast(v ? "အလိုအလျောက် ပြန်စမည် ✅" : "ပိတ်ထားသည်"); }
    catch (_) { S.auto_reset = !v; $("swAR").classList.toggle("on", !v); render(); }
  }
  async function setHour(h) {
    const old = S.reset_hour; S.reset_hour = int(h); render();
    try { await apiFetch("/api/admin/inventory/settings", { method: "POST", body: JSON.stringify({ reset_hour: int(h) }) }); showToast("နေ့စဉ် " + hourLabel(h) + " တွင် ပြန်စမည်"); }
    catch (_) { S.reset_hour = old; $("hrSel").value = old; render(); }
  }
  async function manualReset(mode) {
    if (mode === "all" && !confirm("auto ပြန်စ ဖွင့်ထားသော ပစ္စည်းအားလုံးကို နေ့စဉ်အရေအတွက်သို့ ပြန်ထားမည်။ သေချာပါသလား?")) return;
    try { const r = await apiFetch("/api/admin/inventory/reset", { method: "POST", body: JSON.stringify({ mode }) }); showToast(`ပစ္စည်း ${r.changed || 0} မျိုး ပြန်စပြီး ✅`); closeSheet(); load(); } catch (_) {}
  }

  window.onload = function () { if (typeof renderAdminLayout === "function") renderAdminLayout("inventory"); load(); };
</script>
</body>
</html>
