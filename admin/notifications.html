<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>မြင်သာကြက်ကင် • Notifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notif-item { display: flex; gap: 14px; padding: 14px; border-bottom: 1px solid var(--line); align-items: center; }
    .notif-icon { width: 40px; height: 40px; border-radius: 50%; background: #eff6ff; color: var(--blue); display: grid; place-items: center; font-size: 18px; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">🍗</div><div><b>မြင်သာကြက်ကင်</b><small>Premium Admin</small></div></div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
    <div class="side-bottom"><button class="nav" style="background:transparent;color:#aeb8c8;width:100%;padding:11px 12px" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1>Notifications</h1><p>အသိပေးချက်များ</p></div>
    </header>

    <div class="card panel">
      <div class="notif-item">
        <div class="notif-icon"><i class="fa-solid fa-bell"></i></div>
        <div>
          <b style="display:block; font-size:14px;">System Ready</b>
          <span style="font-size:12px; color:var(--muted);">Admin system running properly.</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/main.js"></script>
<script>
  window.onload = () => { renderAdminLayout("notifications"); };
</script>
</body>
</html>
