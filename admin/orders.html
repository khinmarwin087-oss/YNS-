<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Orders Management • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .app { display: flex; width: 100%; min-height: 100vh; background-color: #f8fafc; }

    .dash-header-custom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 12px 4px;
      margin-bottom: 12px;
    }

    .header-center-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
      white-space: nowrap;
    }

    .top-actions-right {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
      position: relative;
      z-index: 20;
    }

    .icon-circle-btn {
      width: 40px; height: 40px; border-radius: 10px; background: #fff;
      border: 1px solid #e2e8f0; display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: #0f172a;
      box-shadow: 0 2px 4px rgba(0,0,0,.04); cursor: pointer; transition: .2s;
    }
    .icon-circle-btn:active { transform: scale(.96); }
    .icon-circle-btn.active { background: #0f172a; color: #fff; }

    /* Search & Date Popovers */
    .search-popover {
      display: none; margin-bottom: 12px; background: #fff; padding: 8px 14px;
      border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px rgba(0,0,0,.05);
      align-items: center; gap: 10px;
    }
    .search-popover.show { display: flex; }
    .search-popover input { width: 100%; border: 0; outline: none; font-size: 14px; background: transparent; }

    .date-popover {
      display: none; position: absolute; top: 50px; right: 0; background: #fff;
      border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,.1); z-index: 100; width: 230px;
      flex-direction: column; gap: 8px;
    }
    .date-popover.show { display: flex; }
    .date-popover label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .date-popover input { width: 100%; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; font-size: 13px; outline: none; }
    .date-reset-btn { background: #f1f5f9; border: 0; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #334155; cursor: pointer; }

    /* Status Tabs Filter */
    .status-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      padding: 8px 16px; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff;
      font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; white-space: nowrap; transition: .2s;
    }
    .tab-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    /* Order Cards List */
    .order-card {
      background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px;
      border: 1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(15,23,42,.03);
    }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .voucher-label { display: inline-block; font-size: 11px; background: #f1f5f9; padding: 4px 9px; border-radius: 6px; color: #64748b; font-weight: 700; }
    .customer-name { margin: 6px 0 2px; font-size: 16px; font-weight: 800; color: #0f172a; word-break: break-word; }
    .customer-phone { color: #64748b; font-size: 12px; }

    .order-header-right { text-align: right; flex-shrink: 0; }
    .order-date { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; white-space: nowrap; }

    /* Status Badges */
    .order-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
    .badge-new, .badge-pending { background: #eff6ff; color: #2563eb; }
    .badge-cooking, .badge-processing { background: #fff7ed; color: #ea580c; }
    .badge-ready { background: #f0fdf4; color: #16a34a; }
    .badge-completed { background: #f1f5f9; color: #475569; }
    .badge-cancelled { background: #fef2f2; color: #dc2626; }

    /* Payment Badges */
    .pay-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700; margin-left: 6px; display: inline-block; }
    .pay-paid { background: #dcfce7; color: #15803d; }
    .pay-pending { background: #fef9c3; color: #a16207; }

    /* Table Setup */
    .items-table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; }
    .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .items-table thead tr { background: #f8fafc; color: #64748b; font-size: 11px; border-bottom: 1px solid #e2e8f0; }
    .items-table th { padding: 8px 10px; font-weight: 700; }
    .items-table td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
    .items-table tbody tr:last-child td { border-bottom: 0; }

    .item-name { text-align: left; font-weight: 700; color: #0f172a; }
    .item-price, .item-total { text-align: right; white-space: nowrap; }
    .item-qty { text-align: center; font-weight: 700; white-space: nowrap; }

    /* Card Bottom Controls */
    .total-status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .order-grand-total {
      flex: 1; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 10px 14px; background: #fef2f2; border-radius: 12px; border: 1px solid #fecaca;
    }
    .order-grand-total-label { font-size: 12px; font-weight: 700; color: #991b1b; white-space: nowrap; }
    .red-total { font-size: 16px; font-weight: 800; color: #dc2626; white-space: nowrap; }

    .order-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-shrink: 0; }
    .btn-action {
      min-height: 38px; padding: 8px 12px; border-radius: 8px; border: none;
      font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; cursor: pointer; color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.08); transition: .15s; white-space: nowrap;
    }
    .btn-action:active { transform: scale(.97); }
    .btn-accept { background: #2563eb; }
    .btn-ready { background: #16a34a; }
    .btn-cancel { background: #dc2626; }
    .btn-complete { background: #0f172a; }

    @media (max-width: 620px) {
      .total-status-row { flex-direction: column; align-items: stretch; }
      .order-actions { flex-direction: row; width: 100%; }
      .order-actions .btn-action { flex: 1; }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Sidebar Nav -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div><b>YNS Kitchen</b><small>Admin Panel</small></div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Main Content -->
  <main class="main" style="width: 100%; overflow-x: hidden; padding: 12px;">

    <!-- Top Navigation Header -->
    <header class="dash-header-custom">
      <button class="icon-circle-btn" onclick="toggleSidebar()" aria-label="Menu" type="button">
        <i class="fa-solid fa-bars"></i>
      </button>

      <h1 class="header-center-title">Orders</h1>

      <div class="top-actions-right">
        <button class="icon-circle-btn" id="searchBtn" onclick="toggleSearch()" aria-label="Search" type="button">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button class="icon-circle-btn" id="dateBtn" onclick="toggleDate()" aria-label="Date" type="button">
          <i class="fa-solid fa-calendar-days"></i>
        </button>

        <button class="icon-circle-btn" onclick="loadOrders()" aria-label="Refresh" type="button">
          <i class="fa-solid fa-rotate-right"></i>
        </button>

        <!-- Date Popover -->
        <div class="date-popover" id="datePopover">
          <label>Filter By Date</label>
          <input type="date" id="filterDate" onchange="applyFilters()">
          <button class="date-reset-btn" onclick="clearDateFilter()" type="button">
            <i class="fa-solid fa-rotate-right"></i> Reset
          </button>
        </div>
      </div>
    </header>

    <!-- Search Input Popover -->
    <div class="search-popover" id="searchPopover">
      <i class="fa-solid fa-magnifying-glass" style="color:#94a3b8;"></i>
      <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Voucher, Name, Phone ရှာရန်...">
      <i class="fa-solid fa-xmark" onclick="toggleSearch()" style="cursor:pointer; color:#94a3b8;"></i>
    </div>

    <!-- Status Filter Tabs -->
    <div class="status-tabs">
      <button class="tab-btn active" onclick="filterStatus('new', this)" type="button">New / Pending</button>
      <button class="tab-btn" onclick="filterStatus('cooking', this)" type="button">Cooking</button>
      <button class="tab-btn" onclick="filterStatus('ready', this)" type="button">Ready</button>
      <button class="tab-btn" onclick="filterStatus('all', this)" type="button">All Orders</button>
    </div>

    <!-- Orders Container -->
    <div id="ordersListContainer">
      <div style="text-align:center; color:#94a3b8; padding:40px;">အော်ဒါများကို ရယူနေသည်...</div>
    </div>

  </main>
</div>

<script src="js/main.js"></script>

<script>
  let rawOrders = [];
  let currentStatus = "new";

  function safeJsonParse(value) {
    if (typeof value !== "string") return value;
    try { return JSON.parse(value); } catch (e) { return []; }
  }

  function parseOrderItems(order) {
    let raw = order.items_json ?? order.items ?? order.order_items ?? order.cart ?? [];
    raw = safeJsonParse(raw);
    if (raw && !Array.isArray(raw)) {
      if (Array.isArray(raw.items)) raw = raw.items;
      else if (typeof raw === 'object') raw = Object.values(raw);
    }
    return Array.isArray(raw) ? raw : [];
  }

  function getItemName(item) {
    return item.name ?? item.title ?? item.product_name ?? "Unknown Item";
  }

  // Price အကျအန စစ်ထုတ်ခြင်း
  function getItemPrice(item) {
    const p = item.price ?? item.unit_price ?? item.unitPrice ?? item.amount ?? item.cost ?? 0;
    return Number(p) || 0;
  }

  function getItemQty(item) {
    const q = item.qty ?? item.quantity ?? item.count ?? 1;
    return Number(q) || 1;
  }

  function getCustomerName(order) {
    return order.customer_name ?? order.customerName ?? order.name ?? "Guest";
  }

  function getPhone(order) {
    return order.phone ?? order.customer_phone ?? "-";
  }

  function getOrderTotal(order, items) {
    let total = Number(order.total ?? order.grand_total ?? order.total_amount ?? 0) || 0;
    if (!total && items.length) {
      total = items.reduce((sum, item) => sum + (getItemPrice(item) * getItemQty(item)), 0);
    }
    return total;
  }

  async function loadOrders() {
    const container = document.getElementById("ordersListContainer");
    try {
      const res = await apiFetch("/api/admin/orders?pageSize=50");
      rawOrders = Array.isArray(res) ? res : ((res && res.orders) || []);
      applyFilters();
    } catch (error) {
      console.error("Load orders error:", error);
      container.innerHTML = `<div style="color:#ef4444; text-align:center; padding:40px;">အော်ဒါ ဒေတာ ရယူ၍ မရပါ။</div>`;
    }
  }

  function toggleSearch() {
    const box = document.getElementById("searchPopover");
    const btn = document.getElementById("searchBtn");
    box.classList.toggle("show");
    btn.classList.toggle("active");
    if (box.classList.contains("show")) document.getElementById("searchInput").focus();
  }

  function toggleDate() {
    const box = document.getElementById("datePopover");
    const btn = document.getElementById("dateBtn");
    box.classList.toggle("show");
    btn.classList.toggle("active");
  }

  function clearDateFilter() {
    document.getElementById("filterDate").value = "";
    applyFilters();
    document.getElementById("datePopover").classList.remove("show");
    document.getElementById("dateBtn").classList.remove("active");
  }

  function filterStatus(status, btn) {
    currentStatus = String(status).toLowerCase();
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyFilters();
  }

  function normalizeStatus(status) {
    const value = String(status || "new").trim().toLowerCase();
    if (value === "pending") return "pending";
    if (value === "processing") return "processing";
    if (value === "cancelled" || value === "canceled") return "cancelled";
    return value;
  }

  function getOrderDate(order) {
    const value = order.created_at ?? order.createdAt ?? order.order_date ?? "";
    if (!value) return "";
    return String(value).split("T")[0].split(" ")[0];
  }

  function applyFilters() {
    const searchInput = document.getElementById("searchInput");
    const dateInput = document.getElementById("filterDate");

    const query = searchInput ? searchInput.value.toLowerCase().trim() : "";
    const filterDateVal = dateInput ? dateInput.value : "";

    const filtered = rawOrders.filter(order => {
      const status = normalizeStatus(order.status);

      if (!query && currentStatus !== "all") {
        if (currentStatus === "new" && status !== "new" && status !== "pending") return false;
        if (currentStatus === "cooking" && status !== "cooking" && status !== "processing") return false;
        if (currentStatus === "ready" && status !== "ready") return false;
      }

      if (query) {
        const voucher = String(order.voucher_code || "").toLowerCase();
        const name = String(getCustomerName(order)).toLowerCase();
        const phone = String(getPhone(order)).toLowerCase();

        if (!voucher.includes(query) && !name.includes(query) && !phone.includes(query)) return false;
      }

      if (filterDateVal) {
        const orderDate = getOrderDate(order);
        if (orderDate !== filterDateVal) return false;
      }

      return true;
    });

    renderOrders(filtered);
  }

  function renderOrders(orders) {
    const container = document.getElementById("ordersListContainer");

    if (!Array.isArray(orders) || orders.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;">အော်ဒါများ မရှိသေးပါ။</div>`;
      return;
    }

    container.innerHTML = orders.map(order => {
      const items = parseOrderItems(order);
      const status = normalizeStatus(order.status);
      const dbId = order.id; // Backend API Update ရန် Numeric ID
      const voucherCode = order.voucher_code || dbId || "N/A";
      const customerName = getCustomerName(order);
      const phone = getPhone(order);
      const total = getOrderTotal(order, items);
      const displayStatus = order.status || "New";
      const payStatus = order.payment_status || "Pending";

      let itemsHTML = "";
      if (items.length > 0) {
        itemsHTML = items.map(item => {
          const name = getItemName(item);
          const price = getItemPrice(item);
          const qty = getItemQty(item);
          const itemTotal = price * qty;

          return `
            <tr>
              <td class="item-name">${escapeHtml(name)}</td>
              <td class="item-price">${formatMoney(price)}</td>
              <td class="item-qty">x${qty}</td>
              <td class="item-total">${formatMoney(itemTotal)}</td>
            </tr>
          `;
        }).join("");
      } else {
        itemsHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding:12px;">အကြောင်းအရာ စာရင်း မရှိပါ။</td></tr>`;
      }

      let actionHTML = "";
      if (status === "new" || status === "pending") {
        actionHTML = `
          <button class="btn-action btn-accept" onclick="updateOrderStatus(${dbId}, 'Processing', this)" type="button">
            <i class="fa-solid fa-fire"></i> Accept
          </button>
          <button class="btn-action btn-cancel" onclick="updateOrderStatus(${dbId}, 'Cancelled', this)" type="button">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
        `;
      } else if (status === "cooking" || status === "processing") {
        actionHTML = `
          <button class="btn-action btn-ready" onclick="updateOrderStatus(${dbId}, 'Ready', this)" type="button">
            <i class="fa-solid fa-check"></i> Ready
          </button>
        `;
      } else if (status === "ready") {
        actionHTML = `
          <button class="btn-action btn-complete" onclick="updateOrderStatus(${dbId}, 'Completed', this)" type="button">
            <i class="fa-solid fa-circle-check"></i> Complete
          </button>
        `;
      }

      return `
        <div class="order-card">
          <div class="order-header">
            <div class="order-header-left">
              <span class="voucher-label">Voucher: #${escapeHtml(voucherCode)}</span>
              <h3 class="customer-name">${escapeHtml(customerName)}</h3>
              <small class="customer-phone"><i class="fa-solid fa-phone"></i> ${escapeHtml(phone)}</small>
            </div>
            <div class="order-header-right">
              <span class="order-date">${getOrderDate(order)}</span>
              <span class="order-badge badge-${status}">${escapeHtml(displayStatus)}</span>
            </div>
          </div>

          <div class="items-table-wrap">
            <table class="items-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Name</th>
                  <th style="text-align:right;">Price</th>
                  <th style="text-align:center;">Qty</th>
                  <th style="text-align:right;">Total</th>
                </tr>
              </thead>
              <tbody>${itemsHTML}</tbody>
            </table>
          </div>

          <div class="total-status-row">
            <div class="order-grand-total">
              <div>
                <span class="order-grand-total-label">Grand Total:</span>
                <span class="pay-badge ${payStatus === 'Paid' ? 'pay-paid' : 'pay-pending'}">${payStatus}</span>
              </div>
              <b class="red-total">${formatMoney(total)}</b>
            </div>
            <div class="order-actions">${actionHTML}</div>
          </div>
        </div>
      `;
    }).join("");
  }

  function escapeHtml(val) {
    return String(val ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function formatMoney(amount) {
    return typeof money === 'function' ? money(amount) : Number(amount).toLocaleString() + ' Ks';
  }

  // numeric ID ခေါ်ဆို၍ Backend သို့ PATCH တောင်းခံခြင်း
  async function updateOrderStatus(dbId, newStatus, btn) {
    if (!dbId) {
      alert("Order Database ID မရှိပါ");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
    }

    try {
      await apiFetch(`/api/admin/orders/${dbId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: newStatus })
      });

      if (typeof showToast === "function") {
        showToast(`Status ကို ${newStatus} သို့ ပြောင်းလဲပြီးပါပြီ`);
      }
      await loadOrders();
    } catch (error) {
      console.error("Update status error:", error);
      alert("Order Status ပြောင်း၍ မရပါ");
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `Retry`;
      }
    }
  }

  window.onload = function() {
    if (typeof renderAdminLayout === "function") renderAdminLayout("orders");
    loadOrders();
  };
</script>

</body>
</html>
