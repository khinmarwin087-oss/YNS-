<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Orders Management • YNS Kitchen</title>
  <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Search & Filter Compact Bar */
    .search-filter-wrapper {
      display: flex; gap: 10px; margin-bottom: 16px; position: relative;
    }
    .search-input-box {
      flex: 1; display: flex; align-items: center; background: #fff; border: 1px solid var(--line);
      border-radius: 16px; padding: 0 16px; gap: 10px; box-shadow: var(--shadow-sm);
    }
    .search-input-box i { color: var(--muted); font-size: 15px; }
    .search-input-box input {
      width: 100%; border: 0; outline: none; padding: 12px 0; background: transparent; font-size: 14px;
    }
    .icon-filter-btn {
      width: 46px; height: 46px; border-radius: 16px; background: #fff; border: 1px solid var(--line);
      display: grid; place-items: center; font-size: 16px; color: var(--navy); box-shadow: var(--shadow-sm); transition: 0.2s;
    }
    .icon-filter-btn.active { background: var(--navy); color: #fff; }

    /* Date Filter Popup Container */
    .date-popup {
      display: none; position: absolute; top: 54px; right: 0; background: #fff; border: 1px solid var(--line);
      border-radius: 18px; padding: 16px; box-shadow: var(--shadow-md); z-index: 50; width: 280px; flex-direction: column; gap: 10px;
    }
    .date-popup.show { display: flex; }
    .date-popup label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .date-popup input {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; outline: none; margin-top: 4px;
    }

    /* Red Grand Total Box */
    .order-grand-total {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #fef2f2; border-radius: 14px; border: 1px solid #fecaca; margin-top: 14px;
    }
    .order-grand-total span { font-size: 13px; font-weight: 700; color: #991b1b; }
    .red-total { font-size: 18px; font-weight: 800; color: #dc2626; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div><b>YNS Kitchen</b><small>Admin Panel</small></div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <main class="main">
    <header class="dash-header">
      <div class="header-left">
        <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div class="greeting">
          <h1>Orders Management</h1>
          <small>အော်ဒါများကို စစ်ဆေးပါ သို့မဟုတ် Status ပြောင်းပါ</small>
        </div>
      </div>
    </header>

    <!-- Compact Search & Icon Filter Bar -->
    <div class="search-filter-wrapper">
      <div class="search-input-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Voucher, Customer Name, Phone စသည်ဖြင့် ရှာရန်...">
      </div>
      <button class="icon-filter-btn" id="filterToggleBtn" onclick="toggleDatePopup()"><i class="fa-solid fa-sliders"></i></button>

      <!-- Date Popup Box -->
      <div class="date-popup" id="datePopup">
        <div>
          <label>From Date</label>
          <input type="date" id="fromDate" onchange="applyFilters()">
        </div>
        <div>
          <label>To Date</label>
          <input type="date" id="toDate" onchange="applyFilters()">
        </div>
        <button onclick="resetDateFilter()" style="background:#f1f5f9; color:var(--ink); border-radius:10px; padding:8px; font-size:12px; font-weight:700; margin-top:4px;"><i class="fa-solid fa-rotate-right"></i> Reset Dates</button>
      </div>
    </div>

    <!-- Status Navigation Tabs -->
    <div class="status-tabs">
      <button class="tab-btn active" onclick="filterStatus('all', this)">All</button>
      <button class="tab-btn" onclick="filterStatus('new', this)">New</button>
      <button class="tab-btn" onclick="filterStatus('cooking', this)">Cooking</button>
      <button class="tab-btn" onclick="filterStatus('ready', this)">Ready</button>
    </div>

    <!-- Orders Cards List Container -->
    <div id="ordersListContainer">
      <p style="color:gray;">အော်ဒါများကို ရယူနေသည်...</p>
    </div>
  </main>
</div>

<script src="js/main.js"></script>
<script>
  let rawOrders = [];
  let currentStatus = 'all';

  async function loadOrders() {
    const container = document.getElementById("ordersListContainer");
    try {
      const res = await apiFetch("/api/admin/orders");
      rawOrders = res.orders || res || [];
      applyFilters();
    } catch (err) {
      container.innerHTML = "<p style='color:red;'>Orders ဒေတာ ရယူ၍ မရပါ။</p>";
    }
  }

  function toggleDatePopup() {
    const popup = document.getElementById("datePopup");
    const btn = document.getElementById("filterToggleBtn");
    popup.classList.toggle("show");
    btn.classList.toggle("active");
  }

  function resetDateFilter() {
    document.getElementById("fromDate").value = "";
    document.getElementById("toDate").value = "";
    applyFilters();
    toggleDatePopup();
  }

  function filterStatus(status, btn) {
    currentStatus = status.toLowerCase();
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const fromDateVal = document.getElementById("fromDate").value;
    const toDateVal = document.getElementById("toDate").value;

    let filtered = rawOrders.filter(o => {
      const oStatus = (o.status || 'new').toLowerCase();

      // 1. Status Filter Flexibly
      if (currentStatus !== 'all') {
        if (currentStatus === 'new' && !(oStatus === 'new' || oStatus === 'pending')) return false;
        if (currentStatus === 'cooking' && !(oStatus === 'cooking' || oStatus === 'processing')) return false;
        if (currentStatus === 'ready' && oStatus !== 'ready') return false;
      }

      // 2. Search Query Matching
      const voucher = (o.id || o.voucher_id || '').toString().toLowerCase();
      const name = (o.customer_name || o.name || '').toLowerCase();
      const phone = (o.phone || '').toString().toLowerCase();
      
      const matchesSearch = !query || voucher.includes(query) || name.includes(query) || phone.includes(query);
      if (!matchesSearch) return false;

      // 3. Date Filters
      if (fromDateVal || toDateVal) {
        if (!o.created_at) return false;
        const orderDate = new Date(o.created_at.replace(" ", "T")).setHours(0,0,0,0);
        
        if (fromDateVal) {
          const fromD = new Date(fromDateVal).setHours(0,0,0,0);
          if (orderDate < fromD) return false;
        }
        if (toDateVal) {
          const toD = new Date(toDateVal).setHours(0,0,0,0);
          if (orderDate > toD) return false;
        }
      }

      return true;
    });

    renderOrders(filtered);
  }

  function renderOrders(orders) {
    const container = document.getElementById("ordersListContainer");

    if (!Array.isArray(orders) || orders.length === 0) {
      container.innerHTML = "<div style='text-align:center; padding:40px; color:gray;'>အော်ဒါများ မရှိပါ။</div>";
      return;
    }

    container.innerHTML = orders.map(o => {
      const items = typeof o.items === 'string' ? JSON.parse(o.items) : (o.items || []);
      const st = (o.status || 'Pending').toLowerCase();

      return `
        <div class="order-card">
          <div class="order-header">
            <div>
              <span class="voucher-tag">Voucher: #${o.id || o.voucher_id || 'N/A'}</span>
              <h3 class="cust-name">${o.customer_name || o.name || 'Guest'}</h3>
              <small class="cust-phone">📞 ${o.phone || '-'}</small>
            </div>
            <div style="text-align:right;">
              <span class="order-time">${fmtDate(o.created_at)}</span>
              <span class="order-badge badge-${st}">${o.status || 'New'}</span>
            </div>
          </div>

          <!-- Items Table (Name, Price, Quantity, Total) -->
          <div class="table-responsive">
            <table class="items-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Name</th>
                  <th style="text-align:right;">Price</th>
                  <th style="text-align:center;">Qty</th>
                  <th style="text-align:right;">Total</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(i => {
                  const price = Number(i.price) || 0;
                  const qty = Number(i.qty || i.quantity) || 1;
                  const rowTotal = price * qty;
                  return `
                    <tr>
                      <td style="text-align:left; font-weight:600;">${i.name || i.title}</td>
                      <td style="text-align:right;">${money(price)}</td>
                      <td style="text-align:center;">x${qty}</td>
                      <td style="text-align:right; font-weight:700;">${money(rowTotal)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- Red Total Display -->
          <div class="order-grand-total">
            <span>Grand Total:</span>
            <b class="red-total">${money(o.total)}</b>
          </div>

          <!-- Action Buttons -->
          <div class="order-actions">
            ${(st === 'pending' || st === 'new') ? `
              <button class="btn-action btn-accept" onclick="updateOrderStatus('${o.id}', 'Cooking')"><i class="fa-solid fa-fire"></i> Accept & Cook</button>
              <button class="btn-action btn-cancel" onclick="updateOrderStatus('${o.id}', 'Cancelled')"><i class="fa-solid fa-xmark"></i> Cancel</button>
            ` : ''}

            ${(st === 'cooking' || st === 'processing') ? `
              <button class="btn-action btn-ready" onclick="updateOrderStatus('${o.id}', 'Ready')"><i class="fa-solid fa-check"></i> Mark Ready</button>
            ` : ''}

            ${st === 'ready' ? `
              <button class="btn-action btn-accept" onclick="updateOrderStatus('${o.id}', 'Completed')"><i class="fa-solid fa-circle-check"></i> Complete</button>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function updateOrderStatus(orderId, status) {
    try {
      await apiFetch(`/api/admin/orders/${orderId}`, {
        method: "PATCH",
        body: JSON.stringify({ status })
      });
      showToast(`Status ကို ${status} သို့ ပြောင်းလိုက်ပါပြီ`);
      loadOrders();
    } catch(e) {
      showToast("ပြင်ဆင်မှု မအောင်မြင်ပါ");
    }
  }

  window.onload = () => {
    renderAdminLayout("orders");
    loadOrders();
  };
</script>
</body>
</html>
