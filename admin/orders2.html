<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B5A45">
<title>Orders • Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
    :root {
        --bg: #F4F6F5; --card: #FFFFFF; --ink: #1A2421; --sub: #6B7A75;
        --brand: #0B5A45; --brand-light: #E4F3EC; --gold: #F0A033;
        --red: #EF4444; --red-bg: #FEE2E2; --green: #10B981; --green-bg: #D1FAE5;
        --shadow: 0 4px 20px -10px rgba(0,0,0,0.08);
        --radius: 20px;
    }
    body { background: var(--bg); font-family: 'Noto Sans Myanmar', sans-serif; margin: 0; padding-bottom: 90px; color: var(--ink); -webkit-tap-highlight-color: transparent; }
    
    /* ===== HEADER & TABS ===== */
    .header { background: var(--brand); padding: calc(16px + env(safe-area-inset-top)) 20px 0; border-radius: 0 0 24px 24px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(11,90,69,0.2); }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; color: #fff; }
    .header-top h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .header-top small { font-size: 12.5px; opacity: 0.8; display: block; font-weight: 400; margin-top: 2px; }
    .top-actions { display: flex; gap: 10px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.15); color: #fff; border: none; display: grid; place-items: center; font-size: 16px; backdrop-filter: blur(4px); }
    
    .search-bar { display: flex; align-items: center; background: #fff; border-radius: 12px; padding: 0 16px; height: 44px; margin-bottom: 16px; }
    .search-bar i { color: var(--sub); }
    .search-bar input { flex: 1; border: none; outline: none; padding: 0 10px; font-family: inherit; font-size: 14px; color: var(--ink); background: transparent; }
    
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 8px 16px; border-radius: 99px; background: rgba(255,255,255,0.15); color: #fff; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
    .tab.active { background: #fff; color: var(--brand); border-color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .tab span { margin-left: 6px; background: rgba(0,0,0,0.08); padding: 2px 6px; border-radius: 8px; font-size: 11px; }
    .tab.active span { background: var(--brand-light); color: var(--brand); }

    /* ===== ORDER LIST ===== */
    .container { padding: 20px; }
    .order-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid #EAEFEC; transition: transform 0.1s; }
    .order-card:active { transform: scale(0.98); }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .customer-name { font-size: 16px; font-weight: 800; color: var(--ink); margin: 0 0 2px 0; }
    .voucher-code { font-size: 12.5px; color: var(--sub); font-weight: 600; }
    .price { font-size: 17px; font-weight: 800; color: var(--brand); }
    
    .items-text { font-size: 13.5px; color: #3C4A44; line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .card-bottom { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { padding: 4px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .tag.status-new { background: #FEF3C7; color: #D97706; }
    .tag.status-cooking { background: #FFEDD5; color: #C2410C; }
    .tag.status-ready { background: var(--green-bg); color: var(--green); }
    .tag.status-completed { background: #F3F4F6; color: var(--sub); }
    .tag.status-cancelled { background: var(--red-bg); color: var(--red); }
    .tag.payment-pending { background: #F3F4F6; color: #4B5563; }
    .tag.payment-paid { background: var(--green-bg); color: var(--green); }
    .tag.time { background: #F3F4F6; color: var(--sub); }
    .tag.time i { font-size: 10px; }

    /* ===== BOTTOM SHEET (DETAIL) ===== */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(10, 20, 16, 0.6); z-index: 200; backdrop-filter: blur(4px); }
    .overlay.show { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 28px 28px 0 0; z-index: 210; max-height: 92vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .sheet.show { transform: translateY(0); }
    .sheet-header { padding: 20px; background: #fff; border-radius: 28px 28px 0 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #EAEFEC; }
    .sheet-header h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--brand); }
    .sheet-header small { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; font-weight: 500; }
    .sheet-actions { display: flex; gap: 8px; }
    .sheet-btn { width: 40px; height: 40px; border-radius: 12px; border: none; display: grid; place-items: center; font-size: 16px; cursor: pointer; }
    .sheet-btn.print { background: #FEF3C7; color: #D97706; }
    .sheet-btn.close { background: #F3F4F6; color: var(--sub); }
    
    .sheet-body { padding: 20px; overflow-y: auto; flex: 1; }
    .sheet-footer { padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #EAEFEC; display: flex; gap: 10px; }

    /* Detail Elements */
    .progress-track { display: flex; justify-content: space-between; background: #fff; padding: 20px 16px; border-radius: 20px; margin-bottom: 16px; box-shadow: var(--shadow); position: relative; }
    .progress-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 2; }
    .progress-step .circle { width: 32px; height: 32px; border-radius: 50%; background: #F3F4F6; color: #9CA3AF; display: grid; place-items: center; font-size: 14px; border: 3px solid #fff; transition: 0.3s; }
    .progress-step .label { font-size: 11px; font-weight: 700; color: #9CA3AF; text-align: center; }
    .progress-step.done .circle { background: var(--green); color: #fff; }
    .progress-step.done .label { color: var(--ink); }
    .progress-step.active .circle { background: var(--gold); color: #fff; box-shadow: 0 0 0 4px #FFF3DF; }
    .progress-step.active .label { color: var(--ink); font-weight: 800; }
    .progress-line { position: absolute; top: 35px; left: 40px; right: 40px; height: 3px; background: #F3F4F6; z-index: 1; }
    .progress-line-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--green); transition: width 0.3s; }

    .customer-card { background: #fff; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .avatar { width: 54px; height: 54px; border-radius: 16px; background: var(--brand-light); color: var(--brand); display: grid; place-items: center; font-size: 24px; font-weight: 800; }
    .customer-info b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 2px; }
    .customer-info span { font-size: 13px; color: var(--sub); font-weight: 600; }
    .call-btn { margin-left: auto; width: 44px; height: 44px; border-radius: 14px; background: var(--green-bg); color: var(--green); display: grid; place-items: center; font-size: 18px; text-decoration: none; }

    .note-card { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .note-title { font-size: 13px; font-weight: 800; color: #D97706; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .note-text { font-size: 14px; color: #92400E; font-weight: 600; line-height: 1.5; }

    .items-card { background: #fff; border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .items-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--sub); margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #EAEFEC; }
    .item-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F3F4F6; }
    .item-row:last-child { border-bottom: none; padding-bottom: 0; }
    .item-qty { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
    .item-info { flex: 1; }
    .item-info b { display: block; font-size: 14.5px; color: var(--ink); margin-bottom: 2px; }
    .item-info small { font-size: 12px; color: var(--sub); }
    .item-price { font-size: 15px; font-weight: 800; color: var(--ink); }

    .total-card { background: linear-gradient(135deg, #E4F3EC, #D1FAE5); border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid #A7F3D0; }
    .total-card .label { font-size: 14px; font-weight: 700; color: #065F46; display: flex; flex-direction: column; gap: 4px; }
    .total-card .amount { font-size: 24px; font-weight: 800; color: #047857; }
    .paid-badge { background: #fff; color: #10B981; font-size: 11px; padding: 2px 8px; border-radius: 6px; display: inline-block; width: fit-content; border: 1px solid #A7F3D0; }

    .btn-main { flex: 1; padding: 16px; border-radius: 16px; border: none; font-size: 15px; font-weight: 800; font-family: inherit; color: #fff; background: var(--brand); box-shadow: 0 8px 20px -6px rgba(11,90,69,0.4); cursor: pointer; }
    .btn-ghost { background: #fff; border: 1px solid #E5E7EB; color: var(--ink); box-shadow: none; }
    
    /* Empty State */
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { width: 80px; height: 80px; background: #fff; border-radius: 24px; display: grid; place-items: center; font-size: 32px; color: #9CA3AF; margin: 0 auto 16px; box-shadow: var(--shadow); }
    .empty-state b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 8px; }
    .empty-state p { font-size: 13px; color: var(--sub); line-height: 1.6; margin: 0; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="header-top">
        <div>
            <h1>Orders</h1>
            <small>အော်ဒါအသစ် မရှိပါ</small>
        </div>
        <div class="top-actions">
            <button class="icon-btn" onclick="loadOrders()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        </div>
    </div>
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="searchInput" placeholder="အော်ဒါနံပါတ် / အမည် / ဖုန်းဖြင့် ရှာရန်..." oninput="filterOrders()">
    </div>
    <div class="tabs" id="tabs">
        <button class="tab active" data-status="all">အားလုံး <span>0</span></button>
        <button class="tab" data-status="New">အသစ် <span>0</span></button>
        <button class="tab" data-status="Processing">ချက်နေသည် <span>0</span></button>
        <button class="tab" data-status="Ready">အဆင်သင့် <span>0</span></button>
        <button class="tab" data-status="Completed">ပြီးစီး <span>0</span></button>
    </div>
</header>

<!-- Order List Container -->
<div class="container" id="ordersContainer">
    <!-- Data will be injected here by JS -->
</div>

<!-- Order Detail Bottom Sheet -->
<div class="overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="orderSheet">
    <div class="sheet-header">
        <div>
            <h2 id="detail-id">#MS-0000</h2>
            <small id="detail-date">...</small>
        </div>
        <div class="sheet-actions">
            <button class="sheet-btn print" onclick="printReceipt()"><i class="fa-solid fa-print"></i></button>
            <button class="sheet-btn close" onclick="closeSheet()"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>
    
    <div class="sheet-body">
        <!-- Progress Bar -->
        <div class="progress-track" id="detail-progress">
            <div class="progress-line"><div class="progress-line-fill" id="progress-fill" style="width: 0%;"></div></div>
            <div class="progress-step" data-step="New"><div class="circle"><i class="fa-solid fa-receipt"></i></div><div class="label">အသစ်</div></div>
            <div class="progress-step" data-step="Processing"><div class="circle"><i class="fa-solid fa-fire"></i></div><div class="label">ချက်နေသည်</div></div>
            <div class="progress-step" data-step="Ready"><div class="circle"><i class="fa-solid fa-bell"></i></div><div class="label">အဆင်သင့်</div></div>
            <div class="progress-step" data-step="Completed"><div class="circle"><i class="fa-solid fa-check"></i></div><div class="label">ပြီးစီး</div></div>
        </div>

        <!-- Customer Info -->
        <div class="customer-card">
            <div class="avatar" id="detail-avatar">K</div>
            <div class="customer-info">
                <b id="detail-name">Customer Name</b>
                <span id="detail-phone">09xxxxxxxxx</span>
            </div>
            <a href="#" class="call-btn" id="detail-call"><i class="fa-solid fa-phone"></i></a>
        </div>

        <!-- Note (If any) -->
        <div class="note-card" id="detail-note-box" style="display:none;">
            <div class="note-title"><i class="fa-solid fa-pen"></i> ဝယ်သူ၏ မှတ်ချက်</div>
            <div class="note-text" id="detail-note">...</div>
        </div>

        <!-- Items List -->
        <div class="items-card">
            <div class="items-header">
                <span>မှာယူထားသော ပစ္စည်းများ</span>
                <span id="detail-item-count">0 မျိုး</span>
            </div>
            <div id="detail-items">
                <!-- JS injects items -->
            </div>
        </div>

        <!-- Total Card -->
        <div class="total-card">
            <div class="label">
                စုစုပေါင်း
                <span class="paid-badge" id="detail-payment-status">Paid</span>
            </div>
            <div class="amount" id="detail-total">0 Ks</div>
        </div>
    </div>

    <div class="sheet-footer" id="detail-footer">
        <!-- JS injects action buttons -->
    </div>
</div>

<script src="js/main.js"></script>
<script>
    let allOrders = [];
    let currentStatus = 'all';
    let currentSearch = '';
    let activeOrder = null;
    const STATUS_ORDER = ['New', 'Processing', 'Ready', 'Completed'];

    // 1. Load Orders from API
    async function loadOrders() {
        try {
            const res = await apiFetch('/api/admin/orders?pageSize=100'); // Max 100 recent orders
            allOrders = res.orders || [];
            renderTabs();
            renderList();
        } catch (e) {
            showToast('အော်ဒါများ ဆွဲယူ၍ မရပါ');
        }
    }

    // 2. Render Top Tabs Counts
    function renderTabs() {
        const counts = { all: allOrders.length, New: 0, Processing: 0, Ready: 0, Completed: 0 };
        allOrders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });
        
        document.querySelectorAll('.tab').forEach(tab => {
            const status = tab.dataset.status;
            const count = counts[status] || 0;
            tab.innerHTML = `${tab.textContent.split(' ')[0]} <span>${count}</span>`;
        });
    }

    // 3. Render Order List
    function renderList() {
        const container = document.getElementById('ordersContainer');
        let filtered = allOrders;

        if (currentStatus !== 'all') filtered = filtered.filter(o => o.status === currentStatus);
        if (currentSearch) {
            const q = currentSearch.toLowerCase();
            filtered = filtered.filter(o => o.voucher_code.toLowerCase().includes(q) || o.customer_name.toLowerCase().includes(q) || o.phone.includes(q));
        }

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon"><i class="fa-regular fa-folder-open"></i></div>
                    <b>ဤအမျိုးအစားတွင် အော်ဒါ မရှိသေးပါ</b>
                    <p>အော်ဒါအသစ်များ ဝင်လာပါက ဤနေရာတွင် အလိုအလျောက် ပေါ်လာပါမည်။</p>
                </div>`;
            return;
        }

        container.innerHTML = filtered.map(o => {
            const st = getStatusMeta(o.status);
            const pay = getPaymentMeta(o.payment_status);
            const itemStr = getItemsString(o.items_json);
            
            return `
            <div class="order-card" onclick="openSheet(${o.id})">
                <div class="card-top">
                    <div>
                        <h3 class="customer-name">${esc(o.customer_name)}</h3>
                        <div class="voucher-code">${esc(o.voucher_code)}</div>
                    </div>
                    <div class="price">${Number(o.total).toLocaleString()} Ks</div>
                </div>
                <div class="items-text">${itemStr}</div>
                <div class="card-bottom">
                    <span class="tag status-${o.status.toLowerCase()}"><i class="fa-solid ${st.icon}"></i> ${st.label}</span>
                    <span class="tag time"><i class="fa-regular fa-clock"></i> ${formatTime(o.created_at)}</span>
                    <span class="tag payment-${o.payment_status.toLowerCase()}">${pay.label}</span>
                </div>
            </div>`;
        }).join('');
    }

    // 4. Filter by Tab
    document.getElementById('tabs').addEventListener('click', e => {
        const tab = e.target.closest('.tab');
        if (!tab) return;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentStatus = tab.dataset.status;
        renderList();
    });

    // 5. Search
    document.getElementById('searchInput').addEventListener('input', e => {
        currentSearch = e.target.value;
        renderList();
    });

    // 6. Open Detail Sheet
    function openSheet(id) {
        activeOrder = allOrders.find(o => o.id === id);
        if (!activeOrder) return;

        // Header
        document.getElementById('detail-id').textContent = activeOrder.voucher_code;
        document.getElementById('detail-date').textContent = formatDate(activeOrder.created_at);
        
        // Customer
        document.getElementById('detail-avatar').textContent = (activeOrder.customer_name || '?').charAt(0).toUpperCase();
        document.getElementById('detail-name').textContent = activeOrder.customer_name;
        document.getElementById('detail-phone').textContent = activeOrder.phone;
        document.getElementById('detail-call').href = `tel:${activeOrder.phone}`;

        // Note
        const noteBox = document.getElementById('detail-note-box');
        if (activeOrder.customer_note) {
            noteBox.style.display = 'block';
            document.getElementById('detail-note').textContent = activeOrder.customer_note;
        } else {
            noteBox.style.display = 'none';
        }

          // Items
        let items = [];
        try { items = JSON.parse(activeOrder.items_json || '[]'); } catch (_) {}
        document.getElementById('detail-item-count').textContent = `${items.length} မျိုး`;
        document.getElementById('detail-items').innerHTML = items.map(it => `
            <div class="item-row">
                <div class="item-qty">×${it.qty}</div>
                <div class="item-info">
                    <b>${esc(it.name)}</b>
                    <small>${Number(it.price).toLocaleString()} Ks / ခု</small>
                </div>
                <div class="item-price">${Number(it.total).toLocaleString()} Ks</div>
            </div>
        `).join('');

        // Total & Payment
        document.getElementById('detail-total').textContent = Number(activeOrder.total).toLocaleString() + ' Ks';
        document.getElementById('detail-payment-status').textContent = activeOrder.payment_status;
        document.getElementById('detail-payment-status').className = 'paid-badge ' + (activeOrder.payment_status === 'Paid' ? 'paid' : 'pending');

        // Progress Tracker
        renderProgress(activeOrder.status);

        // Action Buttons
        renderActionButtons(activeOrder);

        // Show
        document.getElementById('sheetOverlay').classList.add('show');
        document.getElementById('orderSheet').classList.add('show');
    }

    function closeSheet() {
        document.getElementById('sheetOverlay').classList.remove('show');
        document.getElementById('orderSheet').classList.remove('show');
    }

    // 7. Render Progress Bar
    function renderProgress(status) {
        const steps = document.querySelectorAll('.progress-step');
        let activeIdx = STATUS_ORDER.indexOf(status);
        if (status === 'Cancelled') activeIdx = -1;

        steps.forEach((step, idx) => {
            step.classList.remove('active', 'done');
            if (idx < activeIdx) step.classList.add('done');
            else if (idx === activeIdx) step.classList.add('active');
        });

        const fillPercent = activeIdx <= 0 ? 0 : (activeIdx / (STATUS_ORDER.length - 1)) * 100;
        document.getElementById('progress-fill').style.width = fillPercent + '%';
    }

    // 8. Render Action Buttons
    function renderActionButtons(o) {
        const footer = document.getElementById('detail-footer');
        let btns = '';

        if (o.status === 'New') {
            btns = `
                <button class="btn-main" style="background:#FEF3C7; color:#D97706" onclick="updateStatus(${o.id}, 'Cancelled')"><i class="fa-solid fa-xmark"></i> ပယ်ဖျက်</button>
                <button class="btn-main" onclick="updateStatus(${o.id}, 'Processing')"><i class="fa-solid fa-fire"></i> လက်ခံမည်</button>
            `;
        } else if (o.status === 'Processing') {
            btns = `<button class="btn-main" onclick="updateStatus(${o.id}, 'Ready')"><i class="fa-solid fa-bell"></i> ချက်ပြီးပါပြီ (အဆင်သင့်)</button>`;
        } else if (o.status === 'Ready') {
            btns = `<button class="btn-main" onclick="updateStatus(${o.id}, 'Completed')"><i class="fa-solid fa-check"></i> ဝယ်သူလာယူပြီး (ပြီးစီး)</button>`;
        } else if (o.status === 'Completed') {
            if (o.payment_status === 'Pending') {
                btns = `<button class="btn-main btn-ghost" onclick="updateStatus(${o.id}, 'Completed', 'Paid')"><i class="fa-solid fa-money-bill"></i> ငွေရရှိပြီး (Paid)</button>`;
            } else {
                btns = `<div style="text-align:center; width:100%; color:var(--green); font-weight:800; padding:16px;"><i class="fa-solid fa-circle-check"></i> ဤအော်ဒါ ပြီးစီးပါပြီ</div>`;
            }
        } else if (o.status === 'Cancelled') {
            btns = `<div style="text-align:center; width:100%; color:var(--red); font-weight:800; padding:16px;"><i class="fa-solid fa-ban"></i> ဤအော်ဒါ ပယ်ဖျက်ထားပါသည်</div>`;
        }
        footer.innerHTML = btns;
    }

    // 9. Update Status API Call
    async function updateStatus(id, newStatus, newPayment = null) {
        if (!confirm(`အော်ဒါအခြေအနေကို ပြောင်းလဲရန် သေချာပါသလား?`)) return;
        const body = { status: newStatus };
        if (newPayment) body.payment_status = newPayment;
        
        try {
            await apiFetch(`/api/admin/orders/${id}`, { method: 'PATCH', body: JSON.stringify(body) });
            showToast('အခြေအနေ ပြောင်းလဲပြီးပါပြီ ✅');
            closeSheet();
            loadOrders(); // Reload list
        } catch (e) {
            showToast('မအောင်မြင်ပါ');
        }
    }

    // Helpers
    function getStatusMeta(status) {
        const map = {
            'New': { label: 'အသစ်', icon: 'fa-bell' },
            'Processing': { label: 'ချက်နေသည်', icon: 'fa-fire' },
            'Ready': { label: 'အဆင်သင့်', icon: 'fa-bag-shopping' },
            'Completed': { label: 'ပြီးစီး', icon: 'fa-check-double' },
            'Cancelled': { label: 'ပယ်ဖျက်', icon: 'fa-ban' }
        };
        return map[status] || { label: status, icon: 'fa-circle' };
    }
    
    function getPaymentMeta(status) {
        const map = { 'Paid': { label: 'Paid' }, 'Pending': { label: 'Pending' }, 'Failed': { label: 'Failed' } };
        return map[status] || { label: status };
    }

    function getItemsString(json) {
        try {
            const items = JSON.parse(json || '[]');
            if (!items.length) return '-';
            return items.map(i => `${esc(i.name)} ×${i.qty}`).join(' · ') + (items.length > 3 ? ' ...' : '');
        } catch (_) { return '-'; }
    }

    function formatTime(dt) {
        if (!dt) return '-';
        const d = new Date(dt.replace(' ', 'T') + 'Z');
        if (isNaN(d)) return dt;
        const now = new Date();
        const diffMins = Math.floor((now - d) / 60000);
        if (diffMins < 1) return 'ယခုလေးတင်';
        if (diffMins < 60) return `${diffMins} မိနစ်က`;
        if (diffMins < 1440) return `${Math.floor(diffMins / 60)} နာရီက`;
        return `${Math.floor(diffMins / 1440)} ရက်က`;
    }

    function formatDate(dt) {
        if (!dt) return '-';
        const d = new Date(dt.replace(' ', 'T') + 'Z');
        if (isNaN(d)) return dt;
        return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function showToast(msg) { if (window.showToast) window.showToast(msg); else alert(msg); }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof renderAdminLayout === 'function') renderAdminLayout('orders');
        loadOrders();
    });
</script>
</body>
</html>
