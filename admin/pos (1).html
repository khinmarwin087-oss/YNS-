<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D5C49">
<title>POS • YNS Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Noto+Sans+Myanmar:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--bg:#F3F5F2;--ink:#18231F;--muted:#62706A;--line:#E2E8E3;--brand:#0D5C49;--brand-d:#083D31;--brand-soft:#E3F1EB;--gold:#F0A033;--gold-soft:#FFF3DF;--gold-ink:#8A4B00;--red:#D64545;--num:'Bricolage Grotesque','Noto Sans Myanmar',sans-serif}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Myanmar',Pyidaungsu,sans-serif;line-height:1.5}
.pos-top{position:sticky;top:0;z-index:30;background:linear-gradient(160deg,#0F6B55,#083D31 75%);color:#fff;padding:12px 14px 14px;border-radius:0 0 26px 26px;box-shadow:0 14px 30px -18px rgba(8,61,49,.7)}
.pos-bar{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.pos-bar h1{margin:0;font-size:21px;font-weight:800;flex:1;line-height:1.3}.pos-bar h1 small{display:block;font-size:11.5px;font-weight:600;color:#BFE0D3}
.ib{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;font-size:15px;text-decoration:none}
.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:12px auto 0;max-width:980px;padding-bottom:2px}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 15px;border-radius:99px;background:rgba(255,255,255,.12);color:#D5EBE2;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.16)}
.cat.on{background:#fff;color:var(--brand-d);border-color:#fff}
.wrap{max-width:980px;margin:0 auto;padding:14px 12px 190px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:8px;display:flex;align-items:center;gap:9px;min-height:78px;box-shadow:0 1px 2px rgba(24,35,31,.04),0 10px 20px -16px rgba(8,61,49,.35);transition:transform .1s,border-color .15s,background .15s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.tile:active{transform:scale(.965)}
.tile.on{border-color:var(--brand);background:linear-gradient(135deg,#fff,#E9F5EF)}
.tile.off{opacity:.42;pointer-events:none}
.tile .im{width:50px;height:50px;border-radius:13px;background:#E8EFEA;object-fit:cover;display:grid;place-items:center;font-size:26px;flex:none}
.tile .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px;align-self:stretch;justify-content:center}
.tile b{font-size:14px;font-weight:800;line-height:1.35;word-break:normal;overflow-wrap:break-word}
.tile .pr{font:800 13.5px var(--num);color:var(--brand)}
.tile .st{font-size:10.5px;font-weight:800;color:var(--gold-ink)}.tile .st.out{color:#B3261E}
.qty{position:absolute;bottom:7px;right:8px;min-width:40px;height:34px;border-radius:99px;background:var(--brand);color:#fff;font:800 17px var(--num);display:none;place-items:center;padding:0 10px;box-shadow:0 6px 12px -4px rgba(13,92,73,.6);border:0}
.tile.on .qty{display:grid}
.hint{display:flex;align-items:center;gap:8px;background:var(--gold-soft);color:var(--gold-ink);font-size:12.5px;font-weight:700;border-radius:14px;padding:9px 12px;margin-bottom:12px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -14px 34px -16px rgba(8,61,49,.45);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.dock-in{max-width:980px;margin:0 auto}
.dock-opts{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.sw{display:inline-flex;gap:3px;background:#EDF2EE;border-radius:12px;padding:3px}
.sw button{padding:7px 12px;border-radius:10px;background:transparent;font-weight:800;font-size:12.5px;color:var(--muted);border:0}
.sw button.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 4px rgba(24,35,31,.18)}
.sw button.on.unpaid{color:#B3261E}
.dock-opts input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13.5px;background:#F6F8F6;outline:0}
.dock-row{display:flex;align-items:center;gap:10px}
.tot{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.tot small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.tot b{font:800 27px var(--num);color:var(--brand-d);letter-spacing:-.5px}.tot b span{font-size:13px;color:var(--muted);margin-left:3px}
.clr{width:50px;height:54px;border-radius:16px;background:#FDECEC;color:var(--red);border:0;font-size:17px}
.go{height:54px;padding:0 22px;border-radius:18px;border:0;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px;background:linear-gradient(135deg,#0D5C49,#083D31);box-shadow:0 12px 22px -10px rgba(8,61,49,.8)}
.go:disabled{opacity:.45;box-shadow:none}
.ov{position:fixed;inset:0;background:rgba(8,20,16,.72);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sh{width:100%;max-width:480px;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:26px}}
.sh h2{margin:0 0 10px;font-size:17px;font-weight:800;color:var(--brand-d);display:flex;align-items:center;gap:8px}.sh h2 button{margin-left:auto;width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.cl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl span{flex:1;font-weight:700;font-size:14px}.cl em{font:800 13px var(--num);font-style:normal;color:var(--muted)}
.cl .st2{display:flex;align-items:center;gap:6px}.cl .st2 button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}
.cl .st2 i{font:800 15px var(--num);font-style:normal;min-width:22px;text-align:center}
.done{text-align:center}
.done .q{font:800 76px/1 var(--num);color:var(--brand-d);margin:6px 0 0}
.done .ql{font-size:13px;font-weight:800;color:var(--gold-ink);background:var(--gold-soft);display:inline-block;padding:3px 14px;border-radius:99px}
.done .v{font:700 14px var(--num);color:var(--muted);margin-top:6px}
.done .t{font:800 24px var(--num);margin:8px 0 2px}
.msg{min-height:20px;font-size:12.5px;font-weight:700;text-align:center;margin:8px 0;color:var(--muted)}.msg.err{color:#B3261E}.msg.ok{color:#17804F}
.btn{width:100%;min-height:54px;border-radius:16px;border:0;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px;color:#fff;background:linear-gradient(135deg,#0D5C49,#083D31);margin-top:8px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);min-height:46px;font-size:13.5px}
.row2{display:flex;gap:8px}.row2 .btn{margin-top:8px}
.pw{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
canvas#tk{display:none}
.qs .nm{font-weight:800;font-size:15px;color:var(--brand-d);margin-bottom:2px}
.qs .disp{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 10px}
.qs .disp b{font:800 64px/1 var(--num);color:var(--ink)}.qs .disp span{font-weight:700;color:var(--muted);font-size:14px}
.qs .adds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.qs .adds button{height:50px;border-radius:15px;border:0;background:var(--brand-soft);color:var(--brand-d);font:800 17px var(--num)}
.qs .adds button:active,.qs .pad button:active{transform:scale(.94)}
.qs .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qs .pad button{height:54px;border-radius:15px;border:1px solid var(--line);background:#fff;font:800 22px var(--num);color:var(--ink)}
.qs .pad button.fn{background:#F0F3F1;color:var(--muted);font-size:16px}
.qs .acts{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
.qs .acts button{height:54px;border-radius:16px;border:0;font-weight:800;font-size:16px}
.qs .rm{background:#FDECEC;color:var(--red)}.qs .ok{background:linear-gradient(135deg,#0D5C49,#083D31);color:#fff;box-shadow:0 12px 22px -10px rgba(8,61,49,.8)}
</style>
</head>
<body>
<div class="pos-top">
  <div class="pos-bar">
    <a class="ib" href="index.html" aria-label="Dashboard"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>ဆိုင်ရောင်း (POS)<small id="sub">ပစ္စည်းကို နှိပ်ပါ — ဘောက်ချာ ချက်ချင်းထုတ်မည်</small></h1>
    <button class="ib" type="button" id="btBtn" onclick="btPair()" aria-label="ပရင်တာ"><i class="fa-solid fa-print"></i></button>
    <a class="ib" href="orders.html" aria-label="Orders"><i class="fa-solid fa-receipt"></i></a>
  </div>
  <div class="cats" id="cats"></div>
</div>

<div class="wrap"><div class="hint"><i class="fa-solid fa-hand-pointer"></i> တစ်ချက်နှိပ် = ၁ ခုတိုး &nbsp;·&nbsp; ဖိထားပါ / ဂဏန်းကို နှိပ်ပါ = အရေအတွက် အမြန်ရွေး</div><div class="grid" id="grid"></div></div>

<div class="dock"><div class="dock-in">
  <div class="dock-opts">
    <div class="sw" id="paySw"><button type="button" class="on" id="payY" onclick="setPaid(true)">ငွေရပြီ</button><button type="button" id="payN" onclick="setPaid(false)">မရသေး</button></div>
    <input id="cname" placeholder="နာမည် (မဖြည့်လည်းရ)" maxlength="40">
  </div>
  <div class="dock-row">
    <button class="tot" type="button" onclick="openCart()"><small id="cnt">ပစ္စည်း မရွေးရသေး</small><b><span id="totv" style="margin:0;font-size:inherit;color:inherit">0</span><span>Ks</span></b></button>
    <button class="clr" type="button" onclick="clearAll()" aria-label="ရှင်းမည်"><i class="fa-regular fa-trash-can"></i></button>
    <button class="go" id="goBtn" type="button" onclick="sell()" disabled><i class="fa-solid fa-print"></i> ဘောက်ချာထုတ်</button>
  </div>
</div></div>

<!-- cart sheet -->
<div class="ov" id="cartOv" onclick="if(event.target===this)closeOv('cartOv')"><div class="sh">
  <h2><i class="fa-solid fa-basket-shopping"></i> ရွေးထားသည့် ပစ္စည်းများ<button type="button" onclick="closeOv('cartOv')"><i class="fa-solid fa-xmark"></i></button></h2>
  <div id="cartLines"></div>
</div></div>

<!-- qty sheet -->
<div class="ov" id="qtyOv" onclick="if(event.target===this)closeQty()"><div class="sh qs">
  <h2><i class="fa-solid fa-calculator"></i><span class="nm" id="qn" style="margin:0"></span><button type="button" onclick="closeQty()"><i class="fa-solid fa-xmark"></i></button></h2>
  <div class="disp"><b id="qv">0</b><span>ခု</span></div>
  <div class="adds"><button type="button" onclick="qAdd(5)">+5</button><button type="button" onclick="qAdd(10)">+10</button><button type="button" onclick="qAdd(15)">+15</button><button type="button" onclick="qAdd(20)">+20</button></div>
  <div class="pad">
    <button type="button" onclick="qKey(1)">1</button><button type="button" onclick="qKey(2)">2</button><button type="button" onclick="qKey(3)">3</button>
    <button type="button" onclick="qKey(4)">4</button><button type="button" onclick="qKey(5)">5</button><button type="button" onclick="qKey(6)">6</button>
    <button type="button" onclick="qKey(7)">7</button><button type="button" onclick="qKey(8)">8</button><button type="button" onclick="qKey(9)">9</button>
    <button type="button" class="fn" onclick="qSet(0)">C</button><button type="button" onclick="qKey(0)">0</button><button type="button" class="fn" onclick="qBack()"><i class="fa-solid fa-delete-left"></i></button>
  </div>
  <div class="acts"><button type="button" class="rm" onclick="qRemove()">ဖယ်မည်</button><button type="button" class="ok" onclick="qOk()">အိုကေ</button></div>
</div></div>

<!-- done sheet -->
<div class="ov" id="doneOv"><div class="sh done">
  <span class="ql">ခေါ်ရန် နံပါတ်</span>
  <div class="q" id="dq">1</div>
  <div class="v" id="dv"></div>
  <div class="t" id="dt"></div>
  <div class="msg" id="dmsg"></div>
  <button class="btn" id="dPrint" type="button" onclick="printLast()"><i class="fa-brands fa-bluetooth-b"></i> ဘောက်ချာ ပြန်ထုတ်</button>
  <div class="row2"><a class="btn alt" id="dRaw" href="#" onclick="return rawLast(event)"><i class="fa-solid fa-mobile-screen"></i> RawBT</a><button class="btn alt" type="button" onclick="saveImg()"><i class="fa-solid fa-image"></i> ပုံသိမ်း</button></div>
  <button class="btn" type="button" style="background:var(--gold);color:#3b2200;box-shadow:0 10px 20px -10px rgba(240,160,51,.8)" onclick="closeOv('doneOv')"><i class="fa-solid fa-plus"></i> ဆက်ရောင်းမည်</button>
  <div class="pw">စက္ကူ <div class="sw"><button type="button" id="pw58" onclick="setPaper(58)">58mm</button><button type="button" id="pw80" onclick="setPaper(80)">80mm</button></div>
    <label style="display:flex;gap:5px;align-items:center;margin-left:8px"><input type="checkbox" id="autoP" onchange="saveAuto()"> အလိုအလျောက်ထုတ်</label></div>
</div></div>
<canvas id="tk"></canvas>

<script src="js/main.js"></script>
<script>
let products = [], cat = "all", cart = {}, paid = true, last = null, paperMM = 58, btDev = null, btChar = null, selling = false;
try { paperMM = Number(localStorage.getItem("yns_paper")) === 80 ? 80 : 58; } catch (_) {}
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");

async function load() {
  try {
    const r = await apiFetch("/api/admin/products");
    products = (r.products || r || []).map(p => ({ id: Number(p.id), name: p.name, price: Number(p.price) || 0, category: p.category || "", image: p.image || "", available: p.available !== 0 && p.available !== false, stock: Number(p.stock) || 0, daily: Number(p.daily_stock) || 0 }));
  } catch (e) { $("grid").innerHTML = '<div class="empty">ပစ္စည်းစာရင်း ယူ၍မရပါ<br><button class="btn alt" onclick="load()">ပြန်ကြိုးစားမည်</button></div>'; return; }
  renderCats(); renderGrid(); sync();
}
function renderCats() {
  const cs = ["all", ...new Set(products.map(p => p.category).filter(Boolean))];
  $("cats").innerHTML = cs.map(c => `<button type="button" class="cat ${c === cat ? "on" : ""}" onclick="setCat(${esc(JSON.stringify(JSON.stringify(c)))})">${c === "all" ? "အားလုံး" : esc(c)}</button>`).join("");
}
function setCat(c) { cat = JSON.parse(c); renderCats(); renderGrid(); }
function left(p) { return p.daily > 0 ? Math.max(0, p.stock) : Infinity; }
function renderGrid() {
  const list = products.filter(p => cat === "all" || p.category === cat);
  if (!list.length) { $("grid").innerHTML = '<div class="empty" style="grid-column:1/-1">ပစ္စည်း မရှိပါ</div>'; return; }
  $("grid").innerHTML = list.map(p => {
    const out = !p.available || left(p) <= 0, q = cart[p.id] || 0;
    return `<div class="tile ${q ? "on" : ""} ${out ? "off" : ""}" id="t${p.id}" data-id="${p.id}">
      ${p.image ? `<img class="im" src="${esc(p.image)}" loading="lazy" draggable="false" onerror="this.outerHTML='<div class=im>🍗</div>'">` : `<div class="im">🍗</div>`}
      <div class="tx"><b>${esc(p.name)}</b><span class="pr">${fmt(p.price)} Ks</span>${out ? `<span class="st out">ကုန်</span>` : left(p) <= 5 ? `<span class="st">ကျန် ${left(p)} ခု</span>` : ""}</div>
      <button class="qty" type="button" id="q${p.id}" data-q="1">${q}</button>
    </div>`;
  }).join("");
}
/* တစ်ချက်နှိပ် = +1 · ဖိထား (သို့) ဂဏန်းနှိပ် = အမြန်ရွေး */
(function () {
  let timer = null, fired = false, sx = 0, sy = 0;
  const g = () => $("grid");
  g().addEventListener("pointerdown", e => { const t = e.target.closest(".tile"); if (!t) return; fired = false; sx = e.clientX; sy = e.clientY; clearTimeout(timer); timer = setTimeout(() => { fired = true; try { navigator.vibrate && navigator.vibrate(25); } catch (_) {} openQty(Number(t.dataset.id)); }, 450); });
  g().addEventListener("pointermove", e => { if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) { clearTimeout(timer); timer = null; fired = true; } });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => g().addEventListener(ev, () => { clearTimeout(timer); timer = null; }));
  g().addEventListener("click", e => { const t = e.target.closest(".tile"); if (!t) return; if (fired) { fired = false; return; } const id = Number(t.dataset.id); if (e.target.closest("[data-q]")) openQty(id); else add(id); });
  g().addEventListener("contextmenu", e => { if (e.target.closest(".tile")) e.preventDefault(); });
})();
/* ---------- အရေအတွက် အမြန်ရွေး ---------- */
let qId = null, qBuf = 0;
function qMax(p) { return Math.min(99, left(p)); }
function qShow() { $("qv").textContent = qBuf; }
function openQty(id) { const p = products.find(x => x.id === id); if (!p) return; qId = id; qBuf = cart[id] || 0; $("qn").textContent = p.name; qShow(); $("qtyOv").classList.add("show"); }
function closeQty() { $("qtyOv").classList.remove("show"); qId = null; }
function qClamp(n) { const p = products.find(x => x.id === qId), m = qMax(p); if (n > m) { showToast(`${p.name} ${m} ခုသာ ရနိုင်သည်`); return m; } return Math.max(0, n); }
function qAdd(n) { qBuf = qClamp(qBuf + n); qShow(); }
function qKey(d) { qBuf = qClamp(qBuf * 10 + d); qShow(); }
function qBack() { qBuf = Math.floor(qBuf / 10); qShow(); }
function qSet(n) { qBuf = n; qShow(); }
function qRemove() { qBuf = 0; qOk(); }
function qOk() { if (qId == null) return; if (qBuf > 0) cart[qId] = qBuf; else delete cart[qId]; const id = qId; closeQty(); paint(id); }
function add(id) { const p = products.find(x => x.id === id); if (!p) return; if ((cart[id] || 0) + 1 > left(p)) { showToast(`${p.name} ကျန်သည်မှာ ${left(p)} ခုသာ`); return; } cart[id] = (cart[id] || 0) + 1; try { navigator.vibrate && navigator.vibrate(12); } catch (_) {} paint(id); }
function sub(id) { if (!cart[id]) return; cart[id]--; if (cart[id] <= 0) delete cart[id]; paint(id); }
function paint(id) { const t = $("t" + id); if (t) { t.classList.toggle("on", !!cart[id]); $("q" + id).textContent = cart[id] || 0; } sync(); if ($("cartOv").classList.contains("show")) openCart(); }
function totals() { let n = 0, t = 0; for (const id in cart) { const p = products.find(x => x.id == id); if (p) { n += cart[id]; t += p.price * cart[id]; } } return { n, t }; }
function sync() { const { n, t } = totals(); $("totv").textContent = fmt(t); $("cnt").textContent = n ? `${n} ခု ရွေးထားသည်  ▾` : "ပစ္စည်း မရွေးရသေး"; $("goBtn").disabled = !n || selling; }
function clearAll() { if (!Object.keys(cart).length) return; cart = {}; renderGrid(); sync(); }
function setPaid(v) { paid = v; $("payY").className = v ? "on" : ""; $("payN").className = v ? "" : "on unpaid"; }
function openCart() {
  const ids = Object.keys(cart);

  $("cartLines").innerHTML = ids.map(id => { const p = products.find(x => x.id == id); return `<div class="cl"><span>${esc(p.name)}</span><em>${fmt(p.price * cart[id])}</em><div class="st2"><button onclick="sub(${id})">−</button><i>${cart[id]}</i><button onclick="add(${id})">+</button></div></div>`; }).join("");

    if ($("autoP").checked && navigator.bluetooth && btChar) printLast();

/* ---------- print (ESC/POS raster) ---------- */

  push({ k: "t", text: "YNS Kitchen  ·  Halal", sz: FS - 5, c: 1 }, lh(FS - 5) + 4);
  H += 6;
  const QS = FS + 62;

    else if (e.k === "tot") { c.fillRect(M, e.y, W - M * 2, lh(e.sz) + 12); c.fillStyle = "#fff"; c.font = f(e.sz, 1); c.textAlign = "left"; c.fillText(e.l, PAD, base(e.y + 6, e.sz)); c.textAlign = "right"; c.fillText(e.r, W - PAD, base(e.y + 6, e.sz)); c.fillStyle = "#000"; }
    else if (e.k === "stamp") { const h = lh(e.sz) + 14; c.lineWidth = 3; if (e.paid) { rr(c, M + 30, e.y + 1, W - (M + 30) * 2, h, 10); c.stroke(); } else { c.setLineDash([8, 5]); rr(c, M + 18, e.y + 1, W - (M + 18) * 2, h, 10); c.stroke(); c.setLineDash([]); } c.font = f(e.sz, 1); c.textAlign = "center"; c.fillText(e.text, W / 2, base(e.y + 8, e.sz)); }
    else if (e.k === "foot") { c.font = f(e.sz); c.textAlign = "center"; e.lines.forEach((ln, i) => c.fillText(ln, W / 2, base(e.y + i * lh(e.sz), e.sz))); }
  }

}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

const dmsg = (t, c) => { $("dmsg").textContent = t || ""; $("dmsg").className = "msg " + (c || ""); };
async function btConnect() {

  if (!btDev) { btDev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: OPT }); btDev.addEventListener("gattserverdisconnected", () => { btChar = null; $("btBtn").style.background = ""; }); }

}
async function btPair() { if (!navigator.bluetooth) { showToast("Android Chrome တွင်သာ ရပါသည် (သို့) RawBT သုံးပါ", 4000); return; } try { await btConnect(); showToast("ပရင်တာ ချိတ်ပြီးပါပြီ ✅"); } catch (e) { if (!(e && e.name === "NotFoundError")) showToast("ချိတ်၍မရပါ — " + (e && e.message || e), 4000); } }
async function printLast() {
  if (!last) return; $("dPrint").disabled = true;
  try {
    if (!navigator.bluetooth) throw new Error("ဤ browser တွင် Bluetooth မရပါ — RawBT သုံးပါ");
    dmsg("ပရင်တာ ချိတ်နေသည်…"); const ch = await btConnect(), bytes = escpos(await drawTicket(last)), noResp = !!ch.properties.writeWithoutResponse; let size = 100, i = 0;

    dmsg("ပရင့်ပြီးပါပြီ ✅", "ok");

  finally { $("dPrint").disabled = false; }
}
async function rawLast(ev) { ev.preventDefault(); if (!last) return false; const b = escpos(await drawTicket(last)); let s = ""; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); location.href = "intent:base64," + btoa(s) + "#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;"; return false; }
