<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Products Management • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Mobile Responsive Layout Styles */
    .app { display: flex; width: 100%; min-height: 100vh; position: relative; }
    
    .dash-header-custom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 12px 4px;
      margin-bottom: 12px;
    }

    .header-center-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--navy,#0f172a);
      margin: 0;
    }

    .icon-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--line,#e2e8f0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--navy,#0f172a);
      box-shadow: 0 2px 4px rgba(0,0,0,.04);
      cursor: pointer;
      z-index: 10;
    }

    .btn-add-product {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .card-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 5px rgba(15,23,42,.03);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 10px;
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      white-space: nowrap;
    }

    .custom-table th {
      background: #f8fafc;
      color: #64748b;
      padding: 8px 10px;
      text-align: left;
      font-weight: 700;
      border-bottom: 1px solid #e2e8f0;
    }

    .custom-table td {
      padding: 10px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    .product-img {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid #e2e8f0;
    }

    .badge-status {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-avail { background: #f0fdf4; color: #16a34a; }
    .badge-unavail { background: #fef2f2; color: #dc2626; }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }

    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
      box-sizing: border-box;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group { flex: 1; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-sec, .btn-pri {
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      border: 0;
      cursor: pointer;
    }

    .btn-sec { background: #f1f5f9; color: #475569; }
    .btn-pri { background: #2563eb; color: #fff; }

    @media (max-width: 640px) {
      .hide-mobile { display: none; }
      .header-center-title { font-size: 16px; }
      .card-wrap { padding: 8px; }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div>
        <b>YNS Kitchen</b>
        <small>Admin Panel</small>
      </div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <!-- Overlay for Mobile Sidebar Toggle -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Main Content Area -->
  <main class="main" style="width: 100%; overflow-x: hidden;">

    <!-- Header Navigation Bar -->
    <header class="dash-header-custom">
      <button class="icon-circle-btn" onclick="toggleSidebar()" type="button" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <h1 class="header-center-title">Products</h1>

      <button class="btn-add-product" onclick="openProductModal()" type="button">
        <i class="fa-solid fa-plus"></i> <span class="hide-mobile">အသစ်ထည့်ရန်</span>
      </button>
    </header>

    <!-- Table Card Container -->
    <div class="card-wrap">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; padding: 0 4px;">
        <b style="color:#0f172a; font-size: 14px;">Products စာရင်း</b>
        <button class="icon-circle-btn" onclick="loadProducts()" type="button" style="width:32px; height:32px; font-size:12px;">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>ပုံ</th>
              <th>အမည်</th>
              <th>အမျိုးအစား</th>
              <th>စျေးနှုန်း</th>
              <th>Stock</th>
              <th>အခြေအနေ</th>
              <th style="text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr>
              <td colspan="8" style="text-align:center; padding: 25px; color:#94a3b8;">
                Data ရယူနေသည်...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- Product Add/Edit Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <h3 id="modalTitle" style="margin-top:0; margin-bottom:12px; font-size:16px;">Product အသစ်ထည့်ရန်</h3>
    
    <form id="productForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="productId">

      <div class="form-group">
        <label>အမည်</label>
        <input type="text" id="pName" required class="form-control" placeholder="ဥပမာ - ကြက်တောင်ပံကင်">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>စျေးနှုန်း (Ks)</label>
          <input type="number" id="pPrice" required class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>အမျိုးအစား</label>
          <input type="text" id="pCategory" class="form-control" placeholder="Chicken">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="pStock" value="0" class="form-control">
        </div>
        <div class="form-group">
          <label>Low Stock Warning</label>
          <input type="number" id="pLowStock" value="10" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="pImage" class="form-control" placeholder="https://...">
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="pAvailable" checked style="width:16px; height:16px;">
        <label for="pAvailable" style="margin:0; cursor:pointer;">ဝယ်ယူနိုင်သည် (Available)</label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-sec" onclick="closeProductModal()">မလုပ်တော့ပါ</button>
        <button type="submit" class="btn-pri">သိမ်းဆည်းမည်</button>
      </div>
    </form>
  </div>
</div>

<script src="js/main.js"></script>

<script>
  let ADMIN_KEY = localStorage.getItem("ADMIN_KEY");

  if (!ADMIN_KEY) {
    ADMIN_KEY = prompt("Admin Key ရိုက်ထည့်ပါ:");
    if (ADMIN_KEY) {
      localStorage.setItem("ADMIN_KEY", ADMIN_KEY);
    } else {
      alert("Admin Key မရှိဘဲ ဝင်ရောက်၍ မရပါ!");
    }
  }

  async function checkAdminAuth() {
    if (!ADMIN_KEY) return;
    try {
      const res = await apiFetch("/api/admin/ping");
      if (res && res.status === 401) {
        alert("Admin Key မှားယွင်းနေပါသည်။ ပြန်လည် ထည့်သွင်းပေးပါ။");
        localStorage.removeItem("ADMIN_KEY");
        location.reload();
      }
    } catch (e) {
      console.error("Auth check error:", e);
    }
  }

  let productsList = [];

  async function loadProducts() {
    const tbody = document.getElementById("productsTableBody");
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 25px; color:#94a3b8;">Data ရယူနေသည်...</td></tr>`;

    try {
      const res = await apiFetch("/api/admin/products");
      productsList = Array.isArray(res) ? res : ((res && res.products) || []);
      renderTable(productsList);
    } catch (err) {
      console.error("Load products error:", err);
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 25px; color:#ef4444;">Products Data ရယူ၍ မရပါ။</td></tr>`;
    }
  }

  function renderTable(products) {
    const tbody = document.getElementById("productsTableBody");
    if (!products || products.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 25px; color:#94a3b8;">Product မရှိသေးပါ။</td></tr>`;
      return;
    }

    tbody.innerHTML = products.map(p => `
      <tr>
        <td style="font-weight:bold; color:#64748b;">#${p.id}</td>
        <td>
          <img src="${p.image || 'https://via.placeholder.com/40'}" class="product-img" alt="${escapeHtml(p.name)}">
        </td>
        <td style="font-weight:700; color:#0f172a;">${escapeHtml(p.name)}</td>
        <td style="color:#64748b;">${escapeHtml(p.category || '-')}</td>
        <td style="font-weight:800; color:#dc2626;">${money(p.price || 0)}</td>
        <td>
          <span style="font-weight:700; color:${p.stock <= p.low_stock_threshold ? '#dc2626' : '#334155'};">
            ${p.stock || 0}
          </span>
        </td>
        <td>
          <span class="badge-status ${p.available ? 'badge-avail' : 'badge-unavail'}">
            ${p.available ? 'Available' : 'Out of Stock'}
          </span>
        </td>
        <td style="text-align:right;">
          <button onclick="editProduct(${p.id})" style="border:0; background:transparent; color:#2563eb; cursor:pointer; padding:4px 6px; font-size:14px;">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button onclick="deleteProduct(${p.id})" style="border:0; background:transparent; color:#dc2626; cursor:pointer; padding:4px 6px; font-size:14px;">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </td>
      </tr>
    `).join('');
  }

  function openProductModal(isEdit = false) {
    document.getElementById("modalTitle").innerText = isEdit ? "Product ပြင်ဆင်ရန်" : "Product အသစ်ထည့်ရန်";
    document.getElementById("productModal").classList.add("show");
  }

  function closeProductModal() {
    document.getElementById("productModal").classList.remove("show");
    document.getElementById("productForm").reset();
    document.getElementById("productId").value = "";
  }

  function editProduct(id) {
    const p = productsList.find(item => item.id === id);
    if (!p) return;

    document.getElementById("productId").value = p.id;
    document.getElementById("pName").value = p.name;
    document.getElementById("pPrice").value = p.price;
    document.getElementById("pCategory").value = p.category || '';
    document.getElementById("pStock").value = p.stock || 0;
    document.getElementById("pLowStock").value = p.low_stock_threshold || 10;
    document.getElementById("pImage").value = p.image || '';
    document.getElementById("pAvailable").checked = p.available === 1 || p.available === true;

    openProductModal(true);
  }

  async function saveProduct(e) {
    e.preventDefault();
    const id = document.getElementById("productId").value;
    const isEdit = !!id;

    const payload = {
      name: document.getElementById("pName").value,
      price: Number(document.getElementById("pPrice").value),
      category: document.getElementById("pCategory").value,
      stock: Number(document.getElementById("pStock").value),
      low_stock_threshold: Number(document.getElementById("pLowStock").value),
      image: document.getElementById("pImage").value,
      available: document.getElementById("pAvailable").checked
    };

    const url = isEdit ? `/api/admin/products/${id}` : `/api/admin/products`;
    const method = isEdit ? "PUT" : "POST";

    try {
      await apiFetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (typeof showToast === "function") {
        showToast(isEdit ? "Product ပြင်ဆင်ပြီးပါပြီ" : "Product အသစ်ထည့်ပြီးပါပြီ");
      }
      closeProductModal();
      loadProducts();
    } catch (err) {
      console.error("Save product error:", err);
      alert("Product သိမ်းဆည်းရာတွင် အမှားအယွင်းရှိနေပါသည်");
    }
  }

  async function deleteProduct(id) {
    if (!confirm("ဤ Product ကို ဖျက်ရန် သေချာပါသလား?")) return;

    try {
      await apiFetch(`/api/admin/products/${id}`, {
        method: "DELETE"
      });

      if (typeof showToast === "function") {
        showToast("Product ဖျက်လိုက်ပါပြီ");
      }
      loadProducts();
    } catch (err) {
      console.error("Delete product error:", err);
      alert("Product ဖျက်ရာတွင် အမှားအယွင်းရှိနေပါသည်");
    }
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  window.onload = function() {
    if (typeof renderAdminLayout === "function") {
      renderAdminLayout("products");
    }
    checkAdminAuth();
    loadProducts();
  };
</script>

</body>
</html>
