<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Products Management • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .app { display: flex; width: 100%; min-height: 100vh; position: relative; background-color: #f8fafc; }
    
    .dash-header-custom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4px;
      margin-bottom: 12px;
    }

    .header-center-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }

    .icon-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #0f172a;
      box-shadow: 0 2px 4px rgba(0,0,0,.04);
      cursor: pointer;
    }

    .btn-add-product {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Card Grid Responsive System */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    @media (min-width: 640px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Product Item Card Design */
    .product-card {
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 4px rgba(15,23,42,.02);
    }

    .product-card-img {
      width: 56px;
      height: 56px;
      min-width: 56px;
      border-radius: 10px;
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
    }

    .product-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-card-info {
      flex: 1;
      min-width: 0; /* Text Overflow မဖြစ်အောင် ထိန်းထားခြင်း */
    }

    .product-card-title {
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .product-card-meta {
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .product-card-price {
      font-weight: 800;
      font-size: 13px;
      color: #dc2626;
    }

    .badge-status {
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-avail { background: #f0fdf4; color: #16a34a; }
    .badge-unavail { background: #fef2f2; color: #dc2626; }

    .product-card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-edit { color: #2563eb; }
    .btn-delete { color: #dc2626; }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }

    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
      box-sizing: border-box;
    }

    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-sec, .btn-pri {
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      border: 0;
      cursor: pointer;
    }

    .btn-sec { background: #f1f5f9; color: #475569; }
    .btn-pri { background: #2563eb; color: #fff; }

    @media (max-width: 640px) {
      .hide-mobile { display: none; }
      .header-center-title { font-size: 16px; }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Sidebar Nav -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div>
        <b>YNS Kitchen</b>
        <small>Admin Panel</small>
      </div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Main Content -->
  <main class="main" style="width: 100%; overflow-x: hidden; padding: 12px;">

    <!-- Header Navigation Bar -->
    <header class="dash-header-custom">
      <button class="icon-circle-btn" onclick="toggleSidebar()" type="button" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <h1 class="header-center-title">Products</h1>

      <button class="btn-add-product" onclick="openProductModal()" type="button">
        <i class="fa-solid fa-plus"></i> <span class="hide-mobile">အသစ်ထည့်ရန်</span>
      </button>
    </header>

    <!-- Content Card -->
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; padding: 0 4px;">
        <b style="color:#0f172a; font-size: 14px;">Products စာရင်း</b>
        <button class="icon-circle-btn" onclick="loadProducts()" type="button" style="width:32px; height:32px; font-size:12px;">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <!-- Products Cards Grid Container -->
      <div id="productsGrid" class="products-grid">
        <div style="text-align:center; padding: 30px; color:#94a3b8; grid-column: 1 / -1;">
          Data ရယူနေသည်...
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <h3 id="modalTitle" style="margin-top:0; margin-bottom:12px; font-size:16px;">Product အသစ်ထည့်ရန်</h3>
    
    <form id="productForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="productId">

      <div class="form-group">
        <label>အမည်</label>
        <input type="text" id="pName" required class="form-control" placeholder="ဥပမာ - ကြက်တောင်ပံကင်">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>စျေးနှုန်း (Ks)</label>
          <input type="number" id="pPrice" required class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>အမျိုးအစား</label>
          <input type="text" id="pCategory" class="form-control" placeholder="Chicken">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="pStock" value="0" class="form-control">
        </div>
        <div class="form-group">
          <label>Low Stock Warning</label>
          <input type="number" id="pLowStock" value="10" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="pImage" class="form-control" placeholder="https://...">
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="pAvailable" checked style="width:16px; height:16px;">
        <label for="pAvailable" style="margin:0; cursor:pointer;">ဝယ်ယူနိုင်သည် (Available)</label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-sec" onclick="closeProductModal()">မလုပ်တော့ပါ</button>
        <button type="submit" class="btn-pri">သိမ်းဆည်းမည်</button>
      </div>
    </form>
  </div>
</div>

<script src="js/main.js"></script>

<script>
  let ADMIN_KEY = localStorage.getItem("ADMIN_KEY");

  if (!ADMIN_KEY) {
    ADMIN_KEY = prompt("Admin Key ရိုက်ထည့်ပါ:");
    if (ADMIN_KEY) {
      localStorage.setItem("ADMIN_KEY", ADMIN_KEY);
    } else {
      alert("Admin Key မရှိဘဲ ဝင်ရောက်၍ မရပါ!");
    }
  }

  async function checkAdminAuth() {
    if (!ADMIN_KEY) return;
    try {
      const res = await apiFetch("/api/admin/ping");
      if (res && res.status === 401) {
        alert("Admin Key မှားယွင်းနေပါသည်။ ပြန်လည် ထည့်သွင်းပေးပါ။");
        localStorage.removeItem("ADMIN_KEY");
        location.reload();
      }
    } catch (e) {
      console.error("Auth check error:", e);
    }
  }

  let productsList = [];

  async function loadProducts() {
    const grid = document.getElementById("productsGrid");
    grid.innerHTML = `<div style="text-align:center; padding: 30px; color:#94a3b8; grid-column: 1 / -1;">Data ရယူနေသည်...</div>`;

    try {
      const res = await apiFetch("/api/admin/products");
      productsList = Array.isArray(res) ? res : ((res && res.products) || []);
      renderGrid(productsList);
    } catch (err) {
      console.error("Load products error:", err);
      grid.innerHTML = `<div style="text-align:center; padding: 30px; color:#ef4444; grid-column: 1 / -1;">Products Data ရယူ၍ မရပါ။</div>`;
    }
  }

  function renderGrid(products) {
    const grid = document.getElementById("productsGrid");
    if (!products || products.length === 0) {
      grid.innerHTML = `<div style="text-align:center; padding: 30px; color:#94a3b8; grid-column: 1 / -1;">Product မရှိသေးပါ။</div>`;
      return;
    }

    grid.innerHTML = products.map(p => {
      const imgHtml = p.image 
        ? `<img src="${escapeHtml(p.image)}" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fa-solid fa-image\\'></i>';" alt="">` 
        : `<i class="fa-solid fa-image"></i>`;

      return `
        <div class="product-card">
          <div class="product-card-img">
            ${imgHtml}
          </div>
          <div class="product-card-info">
            <div class="product-card-title">#${p.id} ${escapeHtml(p.name)}</div>
            <div class="product-card-meta">
              <span>${escapeHtml(p.category || 'General')}</span> • 
              <span style="font-weight:700; color:${p.stock <= p.low_stock_threshold ? '#dc2626' : '#334155'};">Stock: ${p.stock || 0}</span>
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:2px;">
              <span class="product-card-price">${money(p.price || 0)}</span>
              <span class="badge-status ${p.available ? 'badge-avail' : 'badge-unavail'}">
                ${p.available ? 'Available' : 'Out'}
              </span>
            </div>
          </div>
          <div class="product-card-actions">
            <button class="action-btn btn-edit" onclick="editProduct(${p.id})" title="ပြင်ရန်">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button class="action-btn btn-delete" onclick="deleteProduct(${p.id})" title="ဖျက်ရန်">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function openProductModal(isEdit = false) {
    document.getElementById("modalTitle").innerText = isEdit ? "Product ပြင်ဆင်ရန်" : "Product အသစ်ထည့်ရန်";
    document.getElementById("productModal").classList.add("show");
  }

  function closeProductModal() {
    document.getElementById("productModal").classList.remove("show");
    document.getElementById("productForm").reset();
    document.getElementById("productId").value = "";
  }

  function editProduct(id) {
    const p = productsList.find(item => item.id === id);
    if (!p) return;

    document.getElementById("productId").value = p.id;
    document.getElementById("pName").value = p.name;
    document.getElementById("pPrice").value = p.price;
    document.getElementById("pCategory").value = p.category || '';
    document.getElementById("pStock").value = p.stock || 0;
    document.getElementById("pLowStock").value = p.low_stock_threshold || 10;
    document.getElementById("pImage").value = p.image || '';
    document.getElementById("pAvailable").checked = p.available === 1 || p.available === true;

    openProductModal(true);
  }

  async function saveProduct(e) {
    e.preventDefault();
    const id = document.getElementById("productId").value;
    const isEdit = !!id;

    const payload = {
      name: document.getElementById("pName").value,
      price: Number(document.getElementById("pPrice").value),
      category: document.getElementById("pCategory").value,
      stock: Number(document.getElementById("pStock").value),
      low_stock_threshold: Number(document.getElementById("pLowStock").value),
      image: document.getElementById("pImage").value,
      available: document.getElementById("pAvailable").checked
    };

    const url = isEdit ? `/api/admin/products/${id}` : `/api/admin/products`;
    const method = isEdit ? "PUT" : "POST";

    try {
      await apiFetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (typeof showToast === "function") {
        showToast(isEdit ? "Product ပြင်ဆင်ပြီးပါပြီ" : "Product အသစ်ထည့်ပြီးပါပြီ");
      }
      closeProductModal();
      loadProducts();
    } catch (err) {
      console.error("Save product error:", err);
      alert("Product သိမ်းဆည်းရာတွင် အမှားအယွင်းရှိနေပါသည်");
    }
  }

  async function deleteProduct(id) {
    if (!confirm("ဤ Product ကို ဖျက်ရန် သေချာပါသလား?")) return;

    try {
      await apiFetch(`/api/admin/products/${id}`, {
        method: "DELETE"
      });

      if (typeof showToast === "function") {
        showToast("Product ဖျက်လိုက်ပါပြီ");
      }
      loadProducts();
    } catch (err) {
      console.error("Delete product error:", err);
      alert("Product ဖျက်ရာတွင် အမှားအယွင်းရှိနေပါသည်");
    }
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  window.onload = function() {
    if (typeof renderAdminLayout === "function") {
      renderAdminLayout("products");
    }
    checkAdminAuth();
    loadProducts();
  };
</script>

</body>
</html>
