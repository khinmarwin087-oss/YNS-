<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Settings • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root { --good: #16a34a; --good-bg: #ecfdf3; --bad: #dc2626; --bad-bg: #fef2f2; --warn: #d97706; --warn-bg: #fffbeb; --blue: #2563eb;
      --card-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 24px -14px rgba(15,23,42,.18); }
    html, body { overflow-x: hidden; }
    body { line-height: 1.5; }
    .main { padding: 0 14px 70px; min-width: 0; }
    .s-wrap { max-width: 720px; margin: 0 auto; }
    @media (min-width: 769px) { .main { padding: 0 28px 60px; } .menu-btn-o { display: none !important; } }

    .s-top { position: sticky; top: 0; z-index: 40; margin: 0 -14px; padding: 10px 14px; background: rgba(244,246,251,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    @media (min-width: 769px) { .s-top { margin: 0 -28px; padding: 18px 28px 12px; } }
    .s-top-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .s-title { flex: 1; min-width: 0; } .s-title h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.3px; color: var(--ink); line-height: 1.3; } .s-title small { display: block; font-size: 11.5px; color: var(--muted); }
    .ibtn { width: 42px; height: 42px; flex-shrink: 0; border-radius: 13px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; font-size: 15px; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.05); }
    .ibtn:active { transform: scale(.93); }

    h2.sec { margin: 22px 4px 8px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .4px; display: flex; align-items: center; gap: 7px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--card-shadow); overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border-top: 1px solid #f1f5f9; width: 100%; text-align: left; background: none; }
    .row:first-child { border-top: 0; }
    .ic { flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 15px; background: #eff6ff; color: var(--blue); }
    .ic.g { background: var(--good-bg); color: var(--good); } .ic.r { background: var(--bad-bg); color: var(--bad); } .ic.o { background: var(--warn-bg); color: var(--warn); } .ic.n { background: #f1f5f9; color: #64748b; }
    .tx { flex: 1; min-width: 0; } .tx b { display: block; font-size: 14px; font-weight: 700; color: var(--ink); } .tx small { display: block; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .badge { flex-shrink: 0; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
    .badge.ok { background: var(--good-bg); color: var(--good); } .badge.no { background: var(--bad-bg); color: var(--bad); } .badge.wa { background: var(--warn-bg); color: var(--warn); } .badge.nu { background: #f1f5f9; color: #64748b; }
    .act { flex-shrink: 0; padding: 8px 13px; border-radius: 11px; background: var(--navy); color: #fff; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
    .act.sub { background: #fff; color: var(--ink); border: 1px solid var(--line); } .act:disabled { opacity: .5; }
    .sw { position: relative; width: 50px; height: 30px; border-radius: 99px; background: #cbd5e1; transition: background .2s; flex-shrink: 0; }
    .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
    .sw.on { background: var(--good); } .sw.on::after { transform: translateX(20px); }
    .sel { flex-shrink: 0; border: 1px solid var(--line); background: #fff; border-radius: 11px; padding: 8px 10px; font-size: 13px; font-weight: 700; color: var(--ink); outline: none; font-family: inherit; max-width: 46%; }

    /* ---------- readiness hero ---------- */
    .hero { border-radius: 24px; padding: 18px; color: #fff; background: linear-gradient(135deg, #0f172a, #1e3a8a); box-shadow: var(--card-shadow); margin-top: 12px; }
    .hero.good { background: linear-gradient(135deg, #064e3b, #15803d); } .hero.bad { background: linear-gradient(135deg, #7f1d1d, #b91c1c); }
    .hero .big { display: flex; align-items: center; gap: 14px; }
    .hero .ring { flex-shrink: 0; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: rgba(255,255,255,.16); }
    .hero h3 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.5; } .hero p { margin: 2px 0 0; font-size: 12.5px; color: rgba(255,255,255,.8); line-height: 1.65; }
    .hero .test { margin-top: 14px; width: 100%; padding: 13px; border-radius: 15px; background: #fff; color: #0f172a; font-weight: 800; font-size: 14px; }
    .hero .test:disabled { opacity: .6; }

    /* ---------- shop ---------- */
    .shopbox { padding: 15px; }
    .shopbox .top { display: flex; align-items: center; gap: 12px; }
    .shopbox textarea { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 12px 13px; border-radius: 13px; border: 1px solid var(--line); font-size: 14px; font-family: inherit; outline: none; resize: none; background: #fff; }
    .shopbox textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .shopbox .save { margin-top: 10px; width: 100%; padding: 12px; border-radius: 13px; background: var(--navy); color: #fff; font-weight: 800; font-size: 13.5px; }

    /* ---------- tones ---------- */
    .tone { display: flex; align-items: center; gap: 12px; padding: 11px 15px; border-top: 1px solid #f1f5f9; width: 100%; text-align: left; background: none; }
    .tone:first-child { border-top: 0; }
    .radio { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #cbd5e1; display: grid; place-items: center; transition: .15s; }
    .tone.on .radio { border-color: var(--blue); } .tone.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
    .play { flex-shrink: 0; width: 36px; height: 36px; border-radius: 11px; background: #f1f5f9; color: var(--ink); font-size: 12px; }
    .play:active { background: #e2e8f0; }
    .vol { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border-top: 1px solid #f1f5f9; }
    .vol input[type=range] { flex: 1; accent-color: var(--blue); height: 28px; }
    .vol b { min-width: 40px; text-align: right; font-size: 13px; font-family: "Plus Jakarta Sans", sans-serif; }

    /* ---------- tips ---------- */
    details.tip { border-top: 1px solid #f1f5f9; }
    details.tip:first-child { border-top: 0; }
    details.tip summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 15px; cursor: pointer; }
    details.tip summary::-webkit-details-marker { display: none; }
    details.tip summary .chev { margin-left: auto; color: #94a3b8; font-size: 12px; transition: transform .2s; }
    details.tip[open] summary .chev { transform: rotate(90deg); }
    details.tip .steps { padding: 0 15px 15px 65px; font-size: 13px; color: #334155; line-height: 1.85; }
    details.tip .steps ol { margin: 0; padding-left: 18px; } details.tip .steps li { margin-bottom: 4px; }
    .note { margin: 10px 4px 0; font-size: 12px; color: var(--muted); line-height: 1.75; }
    .callout { margin: 0 15px 15px; padding: 11px 13px; border-radius: 14px; background: var(--warn-bg); border: 1px solid #fde68a; color: #92400e; font-size: 12.5px; line-height: 1.7; }
    .callout.bad { background: var(--bad-bg); border-color: #fecaca; color: #991b1b; }

    .foot { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 26px; line-height: 1.8; }
    .sk { height: 120px; border-radius: 24px; margin-top: 12px; background: linear-gradient(90deg, #e8ecf4 25%, #f3f5fa 50%, #e8ecf4 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
  
    .verwarn { background:#fef2f2; border:2px solid #fca5a5; color:#991b1b; border-radius:16px; padding:13px 15px; margin-bottom:14px; font-size:13px; font-weight:700; line-height:1.8; }
    .verwarn b { display:block; font-size:14px; margin-bottom:2px; }
    .verok { font-size:11.5px; color:#15803d; font-weight:700; margin:0 2px 10px; }
    .ctbox { padding:15px; }
    .ctbox .lbl { display:block; font-size:12px; font-weight:800; color:#475569; margin:12px 0 5px; }
    .ctbox .lbl:first-child { margin-top:0; }
    .ctbox .lbl small { font-weight:600; color:#94a3b8; }
    .ctbox input { width:100%; box-sizing:border-box; padding:12px 13px; border-radius:13px; border:1px solid var(--line); font-size:14px; font-family:inherit; outline:none; background:#fff; }
    .ctbox input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .ctbox .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ctbox .hint { font-size:11.5px; color:#94a3b8; font-weight:600; margin-top:6px; line-height:1.7; }
    .ctbox .save { margin-top:14px; width:100%; padding:12px; border-radius:13px; background:var(--navy); color:#fff; font-weight:800; font-size:13.5px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div><b>YNS Kitchen</b><small>Admin Panel</small></div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <main class="main">
    <div class="s-top"><div class="s-top-inner">
      <button class="ibtn menu-btn-o" onclick="toggleSidebar()" aria-label="Menu" type="button"><i class="fa-solid fa-bars"></i></button>
      <div class="s-title"><h1>Settings</h1><small>အသိပေးချက်၊ အသံ၊ ဆိုင်ဖွင့်/ပိတ်၊ ဆက်သွယ်ရန်</small></div>
    </div></div>

    <div class="s-wrap" id="root"><div class="sk"></div><div class="sk"></div></div>
  </main>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let A = null;                 // server app-settings
  let ST = { perm: "default", sub: false, pwa: false, supported: true, ios: false, count: 0, busy: false, error: "" };
  let deferredInstall = null, shopDraft = null, ctDraft = null;

  // ================= ပတ်ဝန်းကျင် စစ်ဆေးမှု =================
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const IS_STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const SUPPORTED = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (A) render(); });
  window.addEventListener("appinstalled", () => { deferredInstall = null; ST.pwa = true; render(); showToast("App အဖြစ် ထည့်ပြီးပါပြီ ✅"); });

  const u8 = b64 => { const s = (b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const sameKey = (a, b) => { if (!a || !b || a.byteLength !== b.length) return false; const x = new Uint8Array(a); for (let i = 0; i < b.length; i++) if (x[i] !== b[i]) return false; return true; };

  async function getReg() {
    if (!("serviceWorker" in navigator)) return null;
    try { return (await navigator.serviceWorker.getRegistration()) || null; } catch (_) { return null; }
  }
  async function refreshState() {
    ST.supported = SUPPORTED; ST.ios = IS_IOS; ST.pwa = IS_STANDALONE;
    ST.perm = "Notification" in window ? Notification.permission : "unsupported";
    ST.sub = false;
    try { const r = await getReg(); if (r && r.pushManager) ST.sub = !!(await r.pushManager.getSubscription()); } catch (_) {}
  }

  // ================= Push ဖွင့်/ပိတ် =================
  async function enablePush() {
    if (ST.busy) return; ST.busy = true; ST.error = ""; render();
    try {
      if (!SUPPORTED) throw new Error(IS_IOS && !IS_STANDALONE ? "iPhone တွင် Home Screen သို့ ထည့်ပြီးမှ ရပါမည်" : "ဤ browser က Push မပံ့ပိုးပါ (Chrome ကို သုံးပါ)");
      const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
      if (perm !== "granted") throw new Error(perm === "denied" ? "ခွင့်ပြုချက် ပိတ်ထားသည် — အောက်က ပြန်ဖွင့်နည်းကို ကြည့်ပါ" : "ခွင့်ပြုချက် မရလိုက်ပါ");
      const reg = await navigator.serviceWorker.register("sw.js");
      await navigator.serviceWorker.ready;
      const k = await apiFetch("/api/admin/push/key");
      const keyBytes = u8(k.publicKey);
      let sub = await reg.pushManager.getSubscription();
      if (sub && !sameKey(sub.options && sub.options.applicationServerKey, keyBytes)) { await sub.unsubscribe(); sub = null; }   // Server key ပြောင်းထားလျှင် ပြန်လုပ်
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes });
      await apiFetch("/api/admin/push/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON(), label: deviceLabel() }) });
      syncSwConfig();
      showToast("ဤဖုန်းသို့ အသိပေးချက် ချိတ်ပြီးပါပြီ ✅");
    } catch (e) {
      ST.error = e && e.message ? e.message : String(e);
    } finally { ST.busy = false; await refreshState(); await loadServer(); render(); }
  }
  async function disablePush() {
    if (ST.busy) return; ST.busy = true; render();
    try {
      const r = await getReg(); const sub = r && r.pushManager ? await r.pushManager.getSubscription() : null;
      if (sub) { try { await apiFetch("/api/admin/push/unsubscribe", { method: "POST", body: JSON.stringify({ endpoint: sub.endpoint }) }); } catch (_) {} await sub.unsubscribe(); }
      showToast("ဤဖုန်းမှ အသိပေးချက် ဖြုတ်ပြီး");
    } catch (_) {} finally { ST.busy = false; await refreshState(); await loadServer(); render(); }
  }
  function deviceLabel() {
    const ua = navigator.userAgent;
    const m = /Android[^;)]*;\s*([^;)]+)/.exec(ua);
    return (m ? m[1].trim() : IS_IOS ? "iPhone/iPad" : /Windows/.test(ua) ? "Windows" : /Mac/.test(ua) ? "Mac" : "Device") + (/Chrome/.test(ua) ? " · Chrome" : /Safari/.test(ua) ? " · Safari" : "");
  }

  async function testAll() {
    const b = $("testBtn"); if (b) { b.disabled = true; b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ပို့နေသည်...'; }
    playBeep();                                   // ဤစာမျက်နှာပေါ်မှာ ကြားရမည့် အသံ
    try {
      const r = await apiFetch("/api/admin/push/test", { method: "POST" });
      showToast(r.ok ? `စက် ${r.sent} လုံးသို့ ပို့ပြီး ✅ ဖုန်းကို ကြည့်ပါ (screen ပိတ်ပြီး စမ်းကြည့်ပါ)` : (r.error || "ပို့မရပါ"), 5500);
    } catch (_) {}
    if (b) { b.disabled = false; b.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ဖုန်းသို့ စမ်းသပ်ပို့မည်'; }
  }
  async function installApp() {
    if (!deferredInstall) return;
    deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (_) {} deferredInstall = null; render();
  }

  // ================= Server settings =================
  async function loadServer() { try { const r = await apiFetch("/api/admin/app-settings"); if (r && r.ok) A = r; } catch (_) {} }
  async function saveServer(patch, msg) {
    try { const r = await apiFetch("/api/admin/app-settings", { method: "POST", body: JSON.stringify(patch) }); if (r && r.ok) { A = r; if (msg) showToast(msg); } }
    catch (_) { await loadServer(); }
    render();
  }

  // ================= Render =================
  function cronState() {
    const last = A && A.cron && A.cron.last ? Date.parse(A.cron.last) : 0;
    if (!last) return { cls: "no", txt: "မပြေးသေးပါ", sub: "Cloudflare → Worker → Settings → Triggers → Cron Triggers တွင် * * * * * ထည့်ပါ" };
    const m = Math.floor((Date.now() - last) / 60000);
    if (m <= 3) return { cls: "ok", txt: "အလုပ်လုပ်နေသည်", sub: m < 1 ? "ယခုလေးတင် ပြေးသွားသည်" : m + " မိနစ်က နောက်ဆုံးပြေး" };
    return { cls: "wa", txt: "ရပ်နေနိုင်သည်", sub: m + " မိနစ်က နောက်ဆုံးပြေး — Cron Trigger ကို * * * * * ဖြစ်ကြောင်း စစ်ပါ" };
  }

  function render() {
    if (!A) return;
    const cron = cronState();
    const permOk = ST.perm === "granted";
    const must = [permOk, ST.sub && permOk, !!(A.telegram && A.telegram.configured), cron.cls === "ok"];
    const score = must.filter(Boolean).length;
    const hcls = score === 4 ? "good" : (ST.perm === "denied" ? "bad" : "");
    const hTitle = score === 4 ? "အားလုံး အဆင်သင့်ပါပြီ 🎉" : `အသိပေးချက် ${score}/4 အဆင်သင့်`;
    const hSub = score === 4 ? "ဖုန်း screen ပိတ်ထားသော်လည်း၊ Admin page ပိတ်ထားသော်လည်း အော်ဒါဝင်လျှင် အသိပေးပါမည်" : "အောက်က အနီ/လိမ္မော်ရောင် အချက်တွေကို ပြင်လိုက်ပါ — အော်ဒါ လွတ်မသွားစေရန်";

    const sub = ST.sub && permOk;
    const canPush = ST.supported && !(ST.ios && !ST.pwa);

    const verOk = Number(A.version) >= 9;
    const verHtml = verOk
      ? `<div class="verok">✅ Worker အသစ် (v${esc(A.version)}) တင်ထားပြီး</div>`
      : `<div class="verwarn"><b>⚠️ Worker (worker.js) အဟောင်း ဖြစ်နေပါသည်</b>မှတ်ချက်၊ ထုပ်ပိုး၊ Promo စသည် Admin ဆီ မရောက်သေးပါ။ Cloudflare → Worker → Edit code တွင် worker.js အသစ်ကို အစားထိုးပြီး <b style="display:inline">Deploy</b> လုပ်ပါ။</div>`;
    $("root").innerHTML = verHtml + `
      <div class="hero ${hcls}">
        <div class="big"><div class="ring"><i class="fa-solid ${score === 4 ? "fa-shield-heart" : "fa-bell-concierge"}"></i></div><div><h3>${hTitle}</h3><p>${hSub}</p></div></div>
        <button class="test" id="testBtn" type="button" onclick="testAll()"><i class="fa-solid fa-paper-plane"></i> ဖုန်းသို့ စမ်းသပ်ပို့မည်</button>
      </div>

      <h2 class="sec"><i class="fa-solid fa-mobile-screen-button"></i> ဖုန်းအသိပေးချက် (ဖုန်းပိတ်ထားလည်း ရောက်ရန်)</h2>
      <div class="card">
        <div class="row"><div class="ic ${permOk ? "g" : ST.perm === "denied" ? "r" : "o"}"><i class="fa-solid fa-bell"></i></div>
          <div class="tx"><b>Notification ခွင့်ပြုချက်</b><small>${permOk ? "ခွင့်ပြုထားသည်" : ST.perm === "denied" ? "ပိတ်ထားသည် (browser က ပိတ်ထားသည်)" : ST.perm === "unsupported" ? "ဤ browser က မပံ့ပိုးပါ" : "မပေးရသေးပါ"}</small></div>

          <div class="steps"><ol>
            <li>Safari ဖြင့် ဤ Admin စာမျက်နှာကို ဖွင့်ပါ။</li>
            <li><b>Share ⬆ → Add to Home Screen</b> နှိပ်ပါ။</li>
            <li>Home screen ပေါ်ကနေ App ကို ဖွင့်ပါ၊ ဤ Settings သို့ ပြန်လာပါ။ <b>"ခွင့်ပြုမည်"</b> ကို နှိပ်ပါ။</li>
            <li>iPhone Settings → Notifications → App ကို ခွင့်ပြုပြီး <b>Focus mode</b> ကို စစ်ပါ။</li>
          </ol></div></details>
        <details class="tip"><summary><div class="ic r"><i class="fa-solid fa-power-off"></i></div><div class="tx"><b>မရောက်နိုင်သော အခြေအနေများ</b><small>ရိုးရိုးသားသား ပြောရလျှင်</small></div><i class="fa-solid fa-chevron-right chev"></i></summary>
          <div class="steps"><ol>
            <li>ဖုန်း <b>လုံးဝ ပါဝါပိတ်ထား</b> (သို့) အင်တာနက် မရှိလျှင် ဘာ notification မှ မရောက်နိုင်ပါ။</li>
            <li>ဖုန်းက ပြန်ဖွင့်/အင်တာနက်ပြန်ရလျှင် ကျန်နေသော အော်ဒါကို <b>Telegram ပြန်သတိပေးချက်</b> က ဆက်ပို့ပါမည်။</li>
            <li>ဒါကြောင့် <b>Telegram + ဖုန်း push နှစ်ခုလုံး</b> ဖွင့်ထားခြင်းက အလုံခြုံဆုံးပါ။</li>
          </ol></div></details>
      </div>

      <h2 class="sec"><i class="fa-solid fa-shield-halved"></i> လုံခြုံရေး နှင့် စက်</h2>
      <div class="card">
        <button class="row" type="button" onclick="changeAdminKey()"><div class="ic"><i class="fa-solid fa-key"></i></div><div class="tx"><b>ဤစက်တွင် Admin Key ပြောင်းထည့်မည်</b><small>Cloudflare တွင် ADMIN_KEY ပြောင်းပြီးလျှင် ဤနေရာမှာလည်း ပြောင်းထည့်ပါ</small></div><i class="fa-solid fa-chevron-right" style="color:#cbd5e1"></i></button>
        <button class="row" type="button" onclick="pingTest()"><div class="ic g"><i class="fa-solid fa-wifi"></i></div><div class="tx"><b>Server ချိတ်ဆက်မှု စစ်မည်</b><small id="pingTxt">နှိပ်၍ စစ်ပါ</small></div><i class="fa-solid fa-chevron-right" style="color:#cbd5e1"></i></button>
        <button class="row" type="button" onclick="resetLocal()"><div class="ic o"><i class="fa-solid fa-broom"></i></div><div class="tx"><b>ဤစက်၏ ရွေးချယ်မှုများ ပြန်သတ်မှတ်မည်</b><small>အသံ၊ တုန်ခါမှု စသည် မူလအတိုင်းပြန်ထားမည် (Server data မထိပါ)</small></div><i class="fa-solid fa-chevron-right" style="color:#cbd5e1"></i></button>
        <button class="row" type="button" onclick="logout()"><div class="ic r"><i class="fa-solid fa-right-from-bracket"></i></div><div class="tx"><b>Logout</b><small>ဤစက်မှ ထွက်မည် (အခြားစက်တွေ မထိ)</small></div></button>
      </div>

      <div class="foot">YNS Kitchen Admin<br>Server: ${esc(API_BASE.replace(/^https?:\/\//, ""))}</div>`;
  }

  const toneRow = (k, name, desc) => `<div class="tone${soundTone() === k ? " on" : ""}"><button type="button" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;background:none" onclick="pickTone('${k}')"><span class="radio"></span><span class="tx"><b>${name}</b><small>${desc}</small></span></button><button class="play" type="button" onclick="${k === "custom" && !PREF.get("custom_sound", "") ? "pickFile()" : `previewTone('${k}')`}" aria-label="နားထောင်ကြည့်မည်"><i class="fa-solid ${k === "custom" && !PREF.get("custom_sound", "") ? "fa-folder-open" : "fa-play"}"></i></button></div>`;
  const sel = (key, vals, cur, unit) => `<select class="sel" onchange="saveServer({${key}:Number(this.value)},'သိမ်းပြီး ✅')">${vals.map(v => `<option value="${v}"${Number(cur) === v ? " selected" : ""}>${v} ${unit}</option>`).join("")}</select>`;

  // ================= Actions =================
  function togSound() { setSound(!soundOn()); if (soundOn()) { unlockAudio(); playBeep(); } render(); }
  function togPref(k, after) { PREF.set(k, PREF.get(k, "1") === "0" ? "1" : "0"); if (PREF.get(k, "1") !== "0" && after) after(); render(); }
  async function togWake() { PREF.set("wake", PREF.get("wake", "0") === "1" ? "0" : "1"); await applyWakeLock(); render(); showToast(PREF.get("wake", "0") === "1" ? "ဖန်သားပြင် မပိတ်တော့ပါ (Admin page ဖွင့်ထားချိန်)" : "ပိတ်လိုက်ပြီ"); }
  function setVol(v) { PREF.set("vol", (Number(v) / 100).toFixed(2)); $("volTxt").textContent = v + "%"; }
  function pickTone(k) {
    if (k === "custom" && !PREF.get("custom_sound", "")) return pickFile();
    PREF.set("tone", k); unlockAudio(); render(); previewTone(k);
  }
  function pickFile() {
    const i = document.createElement("input"); i.type = "file"; i.accept = "audio/*";
    i.onchange = () => {
      const f = i.files && i.files[0]; if (!f) return;
      if (f.size > 1.2 * 1024 * 1024) return showToast("ဖိုင်ကြီးလွန်းသည် (၁ MB အောက်ရွေးပါ)", 4000);
      const fr = new FileReader();
      fr.onload = () => {
        PREF.del("custom_sound");
        if (!PREF.set("custom_sound", fr.result)) return showToast("ဤစက်တွင် သိမ်း၍ မရပါ (နေရာမလောက်)", 4000);
        PREF.set("custom_name", f.name.slice(0, 40)); PREF.set("tone", "custom"); unlockAudio(); render(); previewTone("custom"); showToast("ကိုယ်ပိုင်အသံ ထည့်ပြီး ✅");
      };
      fr.onerror = () => showToast("ဖိုင်ဖတ်၍ မရပါ");
      fr.readAsDataURL(f);
    };
    i.click();
  }
  function toggleShop() {
    const open = !A.shop.open;
    if (!open && !confirm("ဆိုင်ပိတ်လိုက်ပါမည်။ ဝယ်သူများ အော်ဒါမှာ၍ မရတော့ပါ။ သေချာပါသလား?")) return;
    saveServer({ shop_open: open }, open ? "ဆိုင်ဖွင့်လိုက်ပြီ ✅" : "ဆိုင်ပိတ်လိုက်ပြီ");
  }
  function ctInput() {
    ctDraft = { phone: $("ctPhone").value, viber: $("ctViber").value, messenger: $("ctMsgr").value, hours: $("ctHours").value, open_time: $("ctOpen").value, close_time: $("ctClose").value };
  }
  function saveContact() {
    ctInput(); const c = ctDraft; ctDraft = null;
    saveServer({ shop_phone: c.phone, shop_viber: c.viber, shop_messenger: c.messenger, shop_hours: c.hours, shop_open_time: c.open_time, shop_close_time: c.close_time }, "ဆိုင်အချက်အလက် သိမ်းပြီး ✅");
  }
  function saveShopMsg() { const v = $("shopMsg").value; shopDraft = null; saveServer({ shop_message: v }, "စာ သိမ်းပြီး ✅"); }
  async function pingTest() {
    const t = $("pingTxt"); t.textContent = "စစ်နေသည်...";
    const s = performance.now();
    try { await apiFetch("/api/admin/ping"); t.textContent = "ချိတ်ဆက်မှု ကောင်းသည် ✅ " + Math.round(performance.now() - s) + " ms"; }
    catch (_) { t.textContent = "ချိတ်ဆက်၍ မရပါ ❌"; }
  }
  function resetLocal() {
    if (!confirm("ဤစက်၏ အသံ/တုန်ခါမှု ရွေးချယ်မှုအားလုံး မူလအတိုင်း ပြန်ထားမည်။ သေချာပါသလား?")) return;
    ["sound", "tone", "vol", "vib", "nag", "nag_sec", "wake", "custom_sound", "custom_name"].forEach(k => PREF.del(k));
    applyWakeLock(); render(); showToast("ပြန်သတ်မှတ်ပြီးပါပြီ");
  }

  async function init() {
    if (typeof renderAdminLayout === "function") renderAdminLayout("settings");
    await refreshState();
    // ကျန်ရှိပြီးသား subscription ရှိလျှင် Service Worker သို့ key ပြန်ပို့ (key ပြောင်းထားနိုင်သဖြင့်)
    syncSwConfig();
    await loadServer();
    if (!A) $("root").innerHTML = '<div style="text-align:center;padding:50px 20px;color:var(--muted)"><b style="display:block;color:var(--ink);font-size:15px;margin-bottom:6px">Settings ရယူ၍ မရပါ</b>Worker ကို နောက်ဆုံး worker.js ဖြင့် ပြန်တင်ထားခြင်း ရှိမရှိ စစ်ပါ<br><button type="button" style="margin-top:12px;background:var(--navy);color:#fff;padding:9px 16px;border-radius:12px;font-weight:700" onclick="location.reload()">ပြန်ကြိုးစားမည်</button></div>';
    else render();
  }
  window.onload = init;
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && A) { await refreshState(); await loadServer(); render(); } });
</script>
</body>
</html>
