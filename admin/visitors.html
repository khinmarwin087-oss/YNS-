<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#083D31">
<title>Visitors • YNS Kitchen</title>
<script src="js/gate.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--g:#0D5C49;--g2:#12834A;--gs:#E3F1EB;--am:#F0A033;--dg:#D64545;--ok:#1E8E5A;--bl:#3B7DDD;--ink:#18231F;--sub:#62706A;--ln:#E2E8E3;--sh:0 1px 2px rgba(24,35,31,.05),0 8px 24px -12px rgba(24,35,31,.18)}
body{font-family:"Noto Sans Myanmar",system-ui,sans-serif;color:var(--ink);background:#F3F6F3}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.hero{background:linear-gradient(120deg,#0E6B3A,#0B5A33 60%,#12834A);color:#fff;border-radius:0 0 28px 28px;padding:calc(14px + env(safe-area-inset-top)) 18px 20px;margin:0 -16px 16px}
.hr{display:flex;align-items:center;gap:12px}.ht{flex:1}.ht h1{margin:0;font:800 20px "Bricolage Grotesque","Noto Sans Myanmar",sans-serif}
.circ{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:16px;display:grid;place-items:center}
.big{margin-top:16px;display:flex;align-items:center;gap:10px}.big span{font-size:13px;font-weight:700;opacity:.9}.big b{display:block;font:800 46px/1.05 "Bricolage Grotesque",sans-serif}
.pill{margin-left:auto;background:rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}
.dv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.dv div{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 6px;text-align:center}.dv i{display:block;font-size:16px;margin-bottom:3px}.dv b{display:block;font:800 18px "Bricolage Grotesque",sans-serif}.dv small{font-size:11px;opacity:.85}
.sh{display:flex;align-items:center;gap:8px;margin:20px 0 10px}.sh h2{margin:0;font-size:16px;font-weight:800;flex:1}
select.sel,.sh select{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:7px 12px;font:700 12.5px inherit;font-family:inherit;color:var(--ink)}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:13px 14px;overflow:hidden}
.fc .t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--sub)}.fc .t i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.fc b{display:block;font:800 26px "Bricolage Grotesque",sans-serif;margin-top:6px}.fc em{font-style:normal;font-size:12px;font-weight:800}
.fc svg{display:block;width:100%;height:34px;margin-top:6px}
.up{color:var(--ok)}.dn{color:var(--dg)}.fl{color:var(--sub)}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kc{border-radius:20px;padding:14px;color:#fff;box-shadow:var(--sh)}.kc span{display:block;font-size:12px;font-weight:700;opacity:.92}.kc b{display:block;font:800 24px "Bricolage Grotesque",sans-serif;margin-top:3px}
.rc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}.rc:last-child{border:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.rc b{display:block;font-size:13.5px}.rc small{color:var(--sub);font-size:11.5px;display:block}
.rt{margin-left:auto;text-align:right;flex:none}.rt small{white-space:nowrap}
.chip{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px}
.c-o{background:#E3F1EB;color:var(--g)}.c-b{background:#FFF1DA;color:#B36A00}.c-r{background:#E5EEFB;color:#2A5DB0}
.dn2{display:flex;align-items:center;gap:18px}.dn2 svg{width:130px;height:130px;flex:none}.lg{flex:1}.lg div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:7px 0}.lg i{width:10px;height:10px;border-radius:50%}.lg em{margin-left:auto;font-style:normal;color:var(--sub)}
.row{margin-bottom:13px}.row:last-child{margin-bottom:0}.rh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}.rh em{font-style:normal;color:var(--sub)}
.bar{height:9px;border-radius:9px;background:#EEF2EF;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g),var(--g2))}
.empty{text-align:center;color:var(--sub);padding:18px;font-size:13px}
.tb{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.tb button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:6px 13px;font:700 12px inherit;font-family:inherit;white-space:nowrap;color:var(--sub)}.tb button.on{background:var(--g);border-color:var(--g);color:#fff}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:99}.md.on{display:flex}.md>div{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:720px;max-height:80vh;overflow:auto;padding:18px}
.ev{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--ln)}.ev small{color:var(--sub);min-width:46px}
.ex{border:0;background:var(--gs);color:var(--g);font:800 12px inherit;font-family:inherit;border-radius:99px;padding:7px 12px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">🍗</div><div><b>YNS Kitchen</b><small>Admin Panel</small></div></div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>
  <main class="main"><div class="wrap">
    <header class="hero">
      <div class="hr">
        <button class="circ mbtn" onclick="toggleSidebar()" aria-label="Menu" type="button"><i class="fa-solid fa-bars"></i></button>
        <div class="ht"><h1>ဝင်ရောက်သူများ</h1></div>
        <button class="circ" onclick="load()" aria-label="Refresh" type="button"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
      <div class="big"><div><span>စုစုပေါင်း ဝင်ရောက်သူ</span><b id="vT">—</b></div><div class="pill" id="vP">—</div></div>
      <div class="dv" id="dv"></div>
    </header>

    <div class="sh"><h2>Funnel အခြေအနေ</h2><select id="dsel"><option value="1">ယနေ့</option><option value="7" selected>၇ ရက်</option><option value="30">၃၀ ရက်</option></select></div>
    <div class="fg" id="fg"></div>
    <div class="kg"><div class="kc" style="background:linear-gradient(120deg,#0E6B3A,#12834A)"><span><i class="fa-solid fa-coins"></i> စုစုပေါင်းဝင်ငွေ (Ks)</span><b id="kR">—</b></div><div class="kc" style="background:linear-gradient(120deg,#E8892B,#F0A033)"><span><i class="fa-solid fa-user-check"></i> စုစုပေါင်းဝယ်သူ</span><b id="kB">—</b></div></div>

    <div class="sh" id="today"><h2>ယနေ့ ဝင်ရောက်သူများ</h2><span id="todayN" style="font-size:12.5px;font-weight:800;color:var(--sub)"></span></div>
    <div class="card"><div id="vis"></div></div>

    <div class="sh"><h2>ဝင်ရောက်သူ စာရင်း</h2><button class="ex" type="button" onclick="exp()"><i class="fa-solid fa-download"></i> CSV</button></div>
    <div class="tb" id="tb"><button class="on" data-f="all" type="button">အားလုံး</button><button data-f="user" type="button">Member</button><button data-f="guest" type="button">Guest</button><button data-f="abandoned" type="button">ခြင်းတောင်းထားခဲ့</button></div>
    <div class="card"><div id="rec"></div></div>

    <div class="sh"><h2>စက်ပစ္စည်း အချက်အလက်</h2></div>
    <div class="card"><div class="dn2" id="dn"></div></div>

    <div class="sh"><h2>Top Pages</h2></div>
    <div class="card" id="tp"></div>

    <div class="sh"><h2>လာရောက်ရာ နေရာ</h2></div>
    <div class="card" id="src"></div>
    <div class="sh"><h2>Browser</h2></div>
    <div class="card" id="brw"></div>
  </div></main>
</div>
<div class="md" id="md" onclick="if(event.target===this)this.classList.remove('on')"><div id="mdb"></div></div>
<script src="js/main.js"></script>
<script>
const $=id=>document.getElementById(id),fmt=n=>(+n||0).toLocaleString("en-US"),esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAGE={home:"ပင်မစာမျက်နှာ",item:"ပစ္စည်းအသေးစိတ်",cart:"ခြင်းတောင်း",menu:"မီနူး",checkout:"Checkout",order:"မှာယူပြီး",profile:"ပရိုဖိုင်",promos:"ပရိုမိုး",live:"Live"};
const COL=["#0D5C49","#F0A033","#3B7DDD","#8A5CD6","#D64545","#2BA7A0"];
let FILTER="all";
async function j(u){const r=await apiFetch(u);return r&&r.json?await r.json():r}
function pct(a,b){if(!b)return a?100:0;return Math.round((a-b)/b*100)}
function tr(p){return `<em class="${p>0?"up":p<0?"dn":"fl"}">${p>0?"▲":p<0?"▼":"–"} ${Math.abs(p)}%</em>`}
function spark(vals,c){const m=Math.max(...vals,1),n=vals.length,pts=vals.map((v,i)=>`${n>1?i/(n-1)*100:50},${32-v/m*28}`).join(" ");return `<svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
function ago(s){const m=Math.floor((Date.now()/1000-s)/60);if(m<1)return"ယခုလေးတင်";if(m<60)return m+" မိနစ်က";if(m<1440)return Math.floor(m/60)+" နာရီက";return Math.floor(m/1440)+" ရက်က"}
function donut(list){const t=list.reduce((a,x)=>a+x.c,0)||1;let o=0;const R=48,C=2*Math.PI*R;const arcs=list.map((x,i)=>{const l=x.c/t*C,a=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${COL[i%6]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return a}).join("");return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#EEF2EF" stroke-width="16"/>${arcs}<text x="60" y="58" text-anchor="middle" font-size="18" font-weight="800" fill="#18231F">${fmt(t)}</text><text x="60" y="74" text-anchor="middle" font-size="9" fill="#62706A">စုစုပေါင်း</text></svg>`}
function bars(el,list,fmtk){const m=Math.max(...list.map(x=>x.c),1);el.innerHTML=list.length?list.map(x=>`<div class="row"><div class="rh"><span>${esc(fmtk?fmtk(x.k):x.k||"—")}</span><em>${fmt(x.c)}</em></div><div class="bar"><i style="width:${Math.max(4,x.c/m*100)}%"></i></div></div>`).join(""):'<div class="empty">ဒေတာ မရှိသေးပါ</div>'}
const DI={Mobile:"fa-mobile-screen",Desktop:"fa-desktop",Tablet:"fa-tablet-screen-button"};
function visList(v){
  const day=new Date(Date.now()+6.5*3600e3).toISOString().slice(0,10);
  const all=(v&&v.recent)||[];
  const L=all.filter(x=>new Date((x.last_at+6.5*3600)*1000).toISOString().slice(0,10)===day);
  const rows=L.length?L:all.slice(0,15);
  $("todayN").textContent=(L.length?"ယနေ့ ":"နောက်ဆုံး ")+rows.length+" ယောက်";
  $("vis").innerHTML=rows.length?rows.map((x,i)=>{
    const dt=x.dtype||(x.device==="PC/Other"?"Desktop":(x.device==="Android"||x.device==="iOS")?"Mobile":"Other");
    const dev=[x.os||x.device,x.browser].filter(Boolean).join(" · ")||"မသိရ";
    return `<div class="rc" style="cursor:default"><div class="av" style="background:${COL[i%6]}"><i class="fa-solid ${DI[dt]||"fa-globe"}"></i></div><div><b>${esc(dt)} · ${esc(dev)}</b><small><i class="fa-solid fa-location-dot"></i> ${esc(x.city||"မသိရ")} · ${esc(x.source||"Direct")}</small><small>${esc(PAGE[x.page]||x.page||"ပင်မစာမျက်နှာ")} · ${fmt(x.hits||1)} ကြိမ်</small></div><div class="rt"><small>${ago(x.last_at)}</small></div></div>`;
  }).join(""):'<div class="empty">ယနေ့ ဝင်ရောက်သူ မရှိသေးပါ</div>';
}
async function load(){
  const days=+$("dsel").value||7;
  const [v,f,s,a]=await Promise.all([j("/api/admin/visitors?days="+days),j("/api/admin/analytics/funnel?days="+days),j("/api/admin/analytics/sessions?filter="+FILTER),j("/api/admin/analytics?days="+(days<7?7:days)).catch(()=>null)]);
  // hero
  if(v&&v.ok!==false){
    $("vT").textContent=fmt(v.total);
    const tp=pct(v.today.unique,v.yesterday.unique);$("vP").textContent=(tp>=0?"+":"")+tp+"%";
    const dm={};(v.devices||[]).forEach(x=>dm[x.k]=(dm[x.k]||0)+x.c);const dt=Object.values(dm).reduce((x,y)=>x+y,0)||1;
    $("dv").innerHTML=[["Mobile","fa-mobile-screen"],["Desktop","fa-desktop"],["Tablet","fa-tablet-screen-button"]].map(([k,i])=>`<div><i class="fa-solid ${i}"></i><b>${Math.round((dm[k]||0)/dt*100)}%</b><small>${k}</small></div>`).join("");
    bars($("src"),v.sources||[]);visList(v);bars($("brw"),v.browsers||[]);
  }
  // funnel
  if(f&&f.ok){
    const d=f.daily||{},keys=Object.keys(d).sort(),ser=k=>keys.map(x=>(d[x]||{})[k]||0);
    const cards=[["visits","ဝင်ရောက်သူ","fa-users","#0D5C49","#E3F1EB"],["item","ပစ္စည်းကြည့်သူ","fa-eye","#3B7DDD","#E5EEFB"],["cart","ခြင်းတောင်းထည့်သူ","fa-cart-shopping","#E8892B","#FFF1DA"],["order","မှာယူသူ","fa-bag-shopping","#1E8E5A","#E3F1EB"]];
    $("fg").innerHTML=cards.map(([k,l,i,c,bg])=>`<div class="fc"><div class="t"><i class="fa-solid ${i}" style="background:${bg};color:${c}"></i>${l}</div><b>${fmt(f.funnel[k])}</b>${tr(pct(f.funnel[k],f.prev[k]))}${spark(ser(k).length>1?ser(k):[0,f.funnel[k]],c)}</div>`).join("");
    const dm={};(f.devices||[]).forEach(x=>dm[x.k]=(dm[x.k]||0)+x.c);const dl=Object.entries(dm).map(([k,c])=>({k,c}));
    $("dn").innerHTML=dl.length?donut(dl)+`<div class="lg">${dl.map((x,i)=>`<div><i style="background:${COL[i%6]}"></i>${esc(x.k)}<em>${fmt(x.c)}</em></div>`).join("")}</div>`:'<div class="empty" style="width:100%">ဒေတာ မရှိသေးပါ</div>';
    const tp=f.topPages||[];bars($("tp"),tp,k=>PAGE[k]||k);
  }
  if(a&&a.current){$("kR").textContent=fmt(a.current.revenue);const cu=a.customers||{};$("kB").textContent=fmt((cu.new||0)+(cu.returning||0)||a.current.orders)}
  // list
  const rec=(s&&s.sessions)||[];
  $("rec").innerHTML=rec.length?rec.slice(0,30).map(x=>{const nm=x.user?(x.user.name||x.user.email||"Member"):"Guest "+x.sid.slice(0,4).toUpperCase();const st=x.ordered?["အော်ဒါသစ်","c-o"]:x.cart>0?["ဝယ်ယူနေသည်","c-b"]:["အဆင်သင့်","c-r"];return `<div class="rc" onclick="tl('${esc(x.sid)}')"><div class="av" style="background:${COL[(nm.charCodeAt(0)||0)%6]}">${esc(nm.charAt(0).toUpperCase())}</div><div><b>${esc(nm)}</b><small>${esc([x.os,x.browser].filter(Boolean).join(" · "))}</small><small><i class="fa-solid fa-location-dot"></i> ${esc(x.city||"—")}</small></div><div class="rt"><small>${ago(x.at)}</small><span class="chip ${st[1]}">${st[0]}</span></div></div>`}).join(""):'<div class="empty">ဝင်ရောက်သူ မရှိသေးပါ</div>';
}
async function tl(sid){const d=await j("/api/admin/analytics/session?sid="+encodeURIComponent(sid));if(!d||!d.events)return;$("mdb").innerHTML=`<h2 style="margin:0 0 8px;font-size:16px">လှုပ်ရှားမှု အစဉ်</h2>`+d.events.map(e=>`<div class="ev"><small>${new Date(e.ts*1000).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</small><span>${esc(e.type)} · ${esc(PAGE[e.page]||e.page)} ${esc(e.label||"")}</span></div>`).join("");$("md").classList.add("on")}
async function exp(){const r=await fetch(API_BASE+"/api/admin/analytics/export?kind=sessions&days="+($("dsel").value||7),{headers:{"X-Admin-Key":getAdminKey()}});const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="visitors.csv";a.click()}
$("dsel").onchange=load;
$("tb").onclick=e=>{const b=e.target.closest("button");if(!b)return;FILTER=b.dataset.f;[...$("tb").children].forEach(x=>x.classList.toggle("on",x===b));load()};
window.addEventListener("load",()=>{if(typeof renderAdminLayout==="function")renderAdminLayout("visitors");load().then(()=>{if(location.hash==="#today"){const t=$("today");t&&t.scrollIntoView({behavior:"smooth"})}});setInterval(load,60000)});
</script>
</body></html>
