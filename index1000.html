    <style>
:root {
  --bg: #F3F5F2;
  --card: #ffffff;

  --sub: #62706A;
  --line: #E2E8E3;
  --brand: #0D5C49;
  --brand-d: #094838;
  --brand-soft: #E3F1EB;
  --amber: #F0A033;
  --amber-soft: #FFF3DF;
  --amber-ink: #8A4B00;
  --danger: #D64545;
  --ok: #1E8E5A;
  --r: 18px;
  --shadow: 0 1px 2px rgba(24,35,31,.05), 0 8px 24px -12px rgba(24,35,31,.18);
  --num: 'Bricolage Grotesque', 'Noto Sans Myanmar', sans-serif;
  /* aliases used by older markup */
  --pearl: var(--card); --accent: var(--brand); --text: var(--ink);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: 130px; }
body { font-family: 'Noto Sans Myanmar', 'Pyidaungsu', sans-serif; background: var(--bg); margin: 0; padding-bottom: 120px; color: var(--ink); font-size: 14px; line-height: 1.6; }
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid rgba(13,92,73,.45); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- hero ---------- */
.hero { position: relative; color: #fff; background:
  radial-gradient(120% 90% at 100% 0%, rgba(240,160,51,.22), transparent 55%),
  repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 14px),
  linear-gradient(160deg, #0B4F3F 0%, #083D31 100%); padding: calc(10px + env(safe-area-inset-top)) 0 52px; overflow: hidden; }
.hero-in { max-width: 1120px; margin: 0 auto; padding: 0 18px; }

.mark { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid #E9BE72; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.16), rgba(255,255,255,.03)); color: #F7D58F; display: grid; place-items: center; font-size: 24px; font-weight: 700; line-height: 1; flex-shrink: 0; box-shadow: inset 0 0 0 4px rgba(233,190,114,.12); padding-bottom: 3px; }

.halal { display: inline-flex; align-items: center; gap: 6px; margin-top: 3px; padding: 1px 11px 2px; border: 1px solid rgba(247,200,121,.55); border-radius: 99px; font-family: 'Reem Kufi', sans-serif; font-size: 12.5px; font-weight: 700; color: #F7C879; }

.top-actions { display: flex; gap: 8px; flex-shrink: 0; }
.circ { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; font-size: 15px; backdrop-filter: blur(6px); text-decoration: none; }

.circ em.show { display: block; }
.hero-h { margin: 22px 0 12px; font-size: 27px; line-height: 1.5; font-weight: 700; letter-spacing: .1px; }
.hero-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#hero-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
.hs { display: inline-flex; align-items: center; gap: 8px; padding: 5px 13px 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); }
.hs i { width: 8px; height: 8px; border-radius: 50%; background: #55D68F; box-shadow: 0 0 0 4px rgba(85,214,143,.22); }

.searchwrap { position: relative; z-index: 5; max-width: 1120px; margin: -27px auto 0; padding: 0 16px; }
.search-container { position: relative; }
.search-box { display: flex; align-items: center; gap: 11px; background: var(--card); border: 1px solid rgba(24,35,31,.06); border-radius: 18px; padding: 0 16px; height: 54px; box-shadow: 0 14px 30px -14px rgba(8,61,49,.55); transition: box-shadow .15s; }
.search-box:focus-within { box-shadow: 0 0 0 4px rgba(13,92,73,.16), 0 14px 30px -14px rgba(8,61,49,.55); }
.search-box i { color: var(--brand); font-size: 15px; }
.search-box input { border: 0; background: transparent; outline: 0; width: 100%; padding: 0 28px 0 0; height: 100%; font-size: 16px; color: var(--ink); margin: 0; box-shadow: none; }
.btn-clear-search { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--sub); font-size: 17px; padding: 8px; display: none; }

.tools { position: sticky; top: 0; z-index: 60; background: rgba(243,245,242,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-top: 6px; }
.tools-in { max-width: 1120px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }
.tools .cat-row { flex: 1; min-width: 0; }
.cat-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 16px 4px 2px; margin: 0 -16px 0 0; }
.cat-row::-webkit-scrollbar { display: none; }
.cat-btn { flex-shrink: 0; border: 0; background: var(--card); color: var(--ink); border-radius: 99px; padding: 9px 16px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 2px rgba(24,35,31,.08); transition: background .15s, color .15s; }
.cat-btn small { font: 700 11px var(--num); opacity: .55; margin-left: 5px; }
.cat-btn.active { background: var(--ink); color: #fff; box-shadow: 0 8px 16px -8px rgba(24,35,31,.6); }
.tools-search { display: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 1px 2px rgba(24,35,31,.1); color: var(--brand); flex-shrink: 0; place-items: center; }
.tools.stuck .tools-search { display: grid; }
.tools.stuck { border-bottom: 1px solid var(--line); }

.container { max-width: 1120px; margin: 0 auto; padding: 6px 16px 0; }
.shop-closed { display: none; margin: 0 0 12px; padding: 14px 16px; border-radius: var(--r); background: #FDECEC; border: 1px solid #F5C2C2; color: #8E2323; font-weight: 700; line-height: 1.7; }
.shop-closed.show { display: block; }
.shop-closed small { display: block; font-weight: 500; color: #A33; }

.shop-info { display: none; }
.si-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.si-badge { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 700; }
.si-open { background: #DDF3E6; color: #17653F; } .si-shut { background: var(--amber-soft); color: var(--amber-ink); }
.si-hours { font-size: 13px; color: var(--sub); font-weight: 500; }
.si-note { margin-top: 8px; font-size: 12.5px; color: var(--amber-ink); font-weight: 500; line-height: 1.7; }
.si-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.si-btn { flex: 1 1 120px; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 8px; border-radius: 12px; font-size: 13px; font-weight: 700; text-decoration: none; color: #fff; white-space: nowrap; }
.si-call { background: var(--brand); } .si-viber { background: #6F5CE8; } .si-msgr { background: #0B7CF0; }
.loyal-strip { display: none; align-items: center; gap: 10px; margin: 0 0 16px; padding: 11px 14px; border-radius: 16px; background: linear-gradient(100deg, #FFF1D6, #FFF8EA); border: 1px solid #F2D9A6; color: var(--amber-ink); font-size: 13px; font-weight: 500; line-height: 1.7; }
.loyal-strip i { font-size: 18px; }
.loyal-strip b { font-weight: 700; }
.si-loyal { margin-top: 12px; background: var(--amber-soft); border: 1px dashed #E6B467; color: var(--amber-ink); border-radius: 12px; padding: 9px 12px; font-size: 12.5px; font-weight: 500; line-height: 1.7; }

.active-banner { display: none; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--brand); color: #fff; border: 0; border-radius: var(--r); padding: 13px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.active-banner.show { display: flex; }
.ab-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); flex-shrink: 0; animation: abpulse 1.8s infinite; }
@keyframes abpulse { 0% { box-shadow: 0 0 0 0 rgba(240,160,51,.7); } 70% { box-shadow: 0 0 0 10px rgba(240,160,51,0); } 100% { box-shadow: 0 0 0 0 rgba(240,160,51,0); } }
.ab-txt { flex: 1; min-width: 0; }
.ab-txt b { display: block; font-size: 14px; font-weight: 700; line-height: 1.5; }
.ab-txt small { font-size: 12px; opacity: .8; }
.ab-go { font-size: 12.5px; font-weight: 700; white-space: nowrap; }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 10px; }
.sec-h h2 { margin: 0; font-size: 17px; font-weight: 700; }
.sec-h span { font: 600 12.5px var(--num); color: var(--sub); }

/* ---------- product grid ---------- */
.cat-h { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; font-size: 17px; font-weight: 700; }
.cat-h span { font: 600 12.5px var(--num); color: var(--sub); }
.cat-sec:first-child .cat-h { margin-top: 6px; }
.freq { margin: 6px 0 4px; } .freq-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px 0; scrollbar-width: none; } .freq-row::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 auto; width: 224px; display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 16px; padding: 8px 10px 8px 8px; box-shadow: 0 1px 2px rgba(24,35,31,.06); }
.mini img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #E6ECE7; flex-shrink: 0; }
.mini .m-t { flex: 1; min-width: 0; line-height: 1.45; } .mini .m-t b { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mini .m-t span { font: 800 14px var(--num); color: var(--brand); }
.mini .btn-add { width: 36px; height: 36px; border-radius: 50%; } .mini .stepper { height: 36px; border-radius: 99px; } .mini .stepper button { width: 30px; height: 36px; } .mini .stepper b { min-width: 16px; }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 620px) { .menu-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 900px) { .menu-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { background: var(--card); border-radius: 20px; border: 1px solid transparent; box-shadow: 0 1px 2px rgba(24,35,31,.06), 0 10px 24px -16px rgba(24,35,31,.28); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .18s, transform .18s; }
.card:hover { box-shadow: var(--shadow); }
.card.in { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.card-media { position: relative; aspect-ratio: 4 / 3; background: #E6ECE7; overflow: hidden; }
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.card.sold .card-img { filter: grayscale(1); opacity: .5; }
.tag { position: absolute; left: 8px; top: 8px; padding: 3px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--amber); color: #3b2200; }
.tag.sold { background: rgba(24,35,31,.82); color: #fff; }
.card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.item-name { font-weight: 700; font-size: 13.5px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.2em; }
.card-foot { display: flex; flex-direction: column; gap: 9px; margin-top: auto; }
.price { font-family: var(--num); font-weight: 800; font-size: 18px; color: var(--brand); letter-spacing: -.2px; line-height: 1.2; }
.price small { font: 600 11px var(--num); color: var(--sub); margin-left: 3px; letter-spacing: 0; }
.ctl { width: 100%; }
.btn-add { width: 100%; height: 40px; border-radius: 12px; border: 0; background: var(--brand); color: #fff; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; transition: transform .12s, background .15s; }
.btn-add:hover { background: var(--brand-d); }
.btn-add:active { transform: scale(.92); }
.btn-add:disabled { background: #D5DBD6; color: #8B9690; cursor: not-allowed; }
.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--brand-soft); border-radius: 12px; height: 40px; }
.stepper button { width: 44px; height: 40px; border: 0; background: transparent; color: var(--brand); font-size: 17px; font-weight: 800; border-radius: 12px; display: grid; place-items: center; }
.stepper b { min-width: 22px; text-align: center; font: 800 15px var(--num); color: var(--brand-d); }
.sk { background: linear-gradient(100deg, #E8EDE9 30%, #F4F7F4 50%, #E8EDE9 70%); background-size: 200% 100%; animation: sk 1.3s linear infinite; border-radius: 8px; }
@keyframes sk { to { background-position: -200% 0; } }
.card.skel .card-media { aspect-ratio: 4/3; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--sub); padding: 44px 10px; font-weight: 500; line-height: 1.8; }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
.empty button { margin-top: 12px; }

/* ---------- floating cart bar ---------- */
.cart-bar { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; z-index: 80; background: var(--brand-d); color: #fff; border: 0; border-radius: 20px; padding: 10px 12px 10px 14px; display: none; align-items: center; gap: 12px; box-shadow: 0 14px 32px -10px rgba(9,72,56,.65); text-align: left; animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.cb-ic { position: relative; width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.cb-ic em { position: absolute; top: -6px; right: -6px; min-width: 21px; height: 21px; border-radius: 99px; background: var(--amber); color: #3b2200; font: 800 12px/21px var(--num); text-align: center; font-style: normal; }
.cb-t { flex: 1; min-width: 0; line-height: 1.35; }
.cb-t small { display: block; font-size: 11.5px; opacity: .75; }
.cb-t b { font: 800 18px var(--num); }
.cb-t b span { font: 600 12px var(--num); opacity: .8; margin-left: 3px; }
.cb-go { background: #fff; color: var(--brand-d); border-radius: 14px; padding: 10px 16px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }

/* ---------- cart / checkout drawer ---------- */
.overlay { display: none; position: fixed; inset: 0; background: rgba(24,35,31,.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 200; overflow: hidden; }
.modal-sheet { background: var(--bg); position: absolute; left: 0; right: 0; bottom: 0; top: 28px; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; overflow: hidden; animation: sheetUp .26s cubic-bezier(.2,.8,.2,1); }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 900px) {
  .modal-sheet { left: auto; right: 0; top: 0; width: 480px; max-width: 480px; margin: 0; border-radius: 24px 0 0 24px; animation-name: sheetIn; }
  @keyframes sheetIn { from { transform: translateX(40px); opacity: 0; } }
}
.modal-header { padding: 14px 16px 12px; background: var(--card); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal-header h3 { margin: 0 0 0 10px; font-size: 16.5px; font-weight: 700; }
.back-btn { background: var(--bg); border: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; color: var(--ink); flex-shrink: 0; }
#item-count-badge { background: var(--brand-soft); color: var(--brand-d); padding: 5px 12px; border-radius: 99px; font-weight: 700; font-size: 12.5px; }
.stepbar { display: flex; gap: 6px; padding: 0 16px 12px; background: var(--card); border-bottom: 1px solid var(--line); }
.stepbar i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .2s; }
.stepbar i.on { background: var(--brand); }
.modal-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

.cart-section-card, .form-card, .pack-card { background: var(--card); border-radius: var(--r); padding: 14px; border: 1px solid var(--line); margin-bottom: 14px; }
.cart-line { border-bottom: 1px solid var(--line); } .cart-line:last-child { border-bottom: 0; }
.cart-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.cart-item-img { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; background: #E6ECE7; flex-shrink: 0; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-info b { font-size: 13.5px; line-height: 1.45; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cart-item-info span { font: 700 13px var(--num); color: var(--brand); display: block; }
.cart-total-row { text-align: right; padding-top: 12px; font-weight: 700; font-size: 13.5px; border-top: 1px dashed var(--line); color: var(--sub); }
.cart-total-row span { font: 800 20px var(--num); color: var(--ink); }
.qty-group { display: flex; align-items: center; background: var(--brand-soft); border-radius: 99px; height: 34px; overflow: hidden; }
.btn-q { width: 32px; height: 34px; border: 0; background: transparent; color: var(--brand); font-weight: 800; font-size: 16px; display: grid; place-items: center; }
.val-q { width: 34px; height: 34px; border: 0; background: transparent; text-align: center; font: 800 14px var(--num); outline: 0; padding: 0; margin: 0; color: var(--brand-d); -moz-appearance: textfield; }
.val-q::-webkit-outer-spin-button, .val-q::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.btn-del { color: var(--danger); background: #FDECEC; border: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }

#form-box { margin-top: 0; }
.step-notice { background: var(--amber-soft); border: 1px solid #F0D39C; color: var(--amber-ink); padding: 10px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 500; margin-bottom: 14px; line-height: 1.7; }
label { font-size: 12.5px; font-weight: 700; color: var(--ink); margin: 0 0 6px; display: block; }
label span { color: var(--sub); font-weight: 400; }
input, textarea { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 14px; font-size: 16px; background: #FAFBFA; color: var(--ink); }
input:focus, textarea:focus { border-color: var(--brand); background: #fff; outline: 0; box-shadow: 0 0 0 4px rgba(13,92,73,.1); }
textarea.order-note { line-height: 1.7; resize: vertical; min-height: 84px; margin-bottom: 8px; }
.onote-chips, .note-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.date-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.date-chip { background: #FAFBFA; border: 1.5px solid var(--line); padding: 11px; border-radius: 12px; text-align: center; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.date-chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
.quick-t { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 14px; }
.chip { border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 99px; padding: 6px 12px; font-size: 12.5px; font-weight: 500; }
.chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.promo-row { display: flex; gap: 8px; margin-bottom: 6px; }
.promo-row input { flex: 1; margin: 0; text-transform: uppercase; }

/* ---------- receipt / history ---------- */
.receipt-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-top: 12px; box-shadow: var(--shadow); position: relative; }

/* ---------- order tracking ---------- */
.trk { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px 14px 12px; margin: 12px 0; box-shadow: var(--shadow); }
.trk-head { text-align: center; }
.trk-ico { font-size: 34px; line-height: 1.3; }

.trk-steps { display: grid; grid-template-columns: repeat(4, 1fr); margin: 18px 0 4px; }
.trk-step { text-align: center; position: relative; font-size: 11px; color: #94A19B; font-weight: 500; line-height: 1.5; }
.trk-step .c { width: 28px; height: 28px; border-radius: 50%; background: var(--line); color: #94A19B; display: grid; place-items: center; margin: 0 auto 6px; font: 700 12px var(--num); position: relative; z-index: 1; }
.trk-step::before { content: ""; position: absolute; top: 13px; right: 50%; width: 100%; height: 3px; background: var(--line); }
.trk-step:first-child::before { display: none; }
.trk-step.done::before, .trk-step.cur::before { background: var(--brand); }
.trk-step.done .c { background: var(--brand); color: #fff; }
.trk-step.cur .c { background: var(--amber); color: #3b2200; box-shadow: 0 0 0 5px rgba(240,160,51,.25); }
.trk-step.done, .trk-step.cur { color: var(--ink); font-weight: 700; }
.trk-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--sub); }
.trk-foot button { background: var(--bg); border: 0; border-radius: 10px; padding: 7px 12px; font-size: 12px; font-weight: 700; color: var(--ink); }
.trk-late { margin-top: 10px; background: var(--amber-soft); border: 1px solid #F0D39C; color: var(--amber-ink); border-radius: 12px; padding: 9px 11px; font-size: 12.5px; font-weight: 500; line-height: 1.7; }
.trk-paid { display: inline-block; margin-top: 8px; background: #DDF3E6; color: #17653F; font-size: 11.5px; font-weight: 700; padding: 3px 11px; border-radius: 99px; }
.trk-cancel .trk-title { color: var(--danger); }
.st-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 10px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
.st-New { background: #E8F0FE; color: #2755C6; } .st-Processing { background: var(--amber-soft); color: var(--amber-ink); } .st-Ready { background: #DDF3E6; color: #17653F; }
.st-Completed { background: #EDF1EE; color: var(--sub); } .st-Cancelled { background: #FDECEC; color: var(--danger); }

let menuData = [];

const API = 'https://yns.khinmarwin087.workers.dev';
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='150' height='100'><rect width='100%' height='100%' fill='#e2e8f0'/><text x='50%' y='58%' font-size='34' text-anchor='middle'>🍗</text></svg>"
);

// HTML ထဲ ထည့်မည့် စာသားများကို လုံခြုံအောင် escape လုပ်ခြင်း
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ဖျက်ထားသော / မရနိုင်တော့သော ပစ္စည်းများကို ခြင်းတောင်းထဲမှ ဖယ်ထုတ်ခြင်း
function cleanCart() {
  for (const id of Object.keys(cart)) {
    const m = menuData.find(x => x.id == id);
    if (!m || m.available === false) delete cart[id];
  }
}

function mapProducts(list) {
  return list.map(p => {
    const tracked = Number(p.daily_stock) > 0;
    return {
      id: p.id, name: p.name, price: Number(p.price) || 0, category: p.category || 'အခြား', image: p.image || '',
      available: p.available == 1 || p.available === true || p.available === undefined,
      stock: tracked ? Math.max(0, Number(p.stock) || 0) : null
    };
  });
}
let menuState = 'loading';   // loading | ready | error
async function loadProductsFromDB() {
  try {
    const cached = JSON.parse(localStorage.getItem('menu_cache') || 'null');
    if (cached && cached.length && !menuData.length) { menuData = mapProducts(cached); menuState = 'ready'; renderCategories(); renderMenu(); }
  } catch (_) {}
  try {
    const response = await fetch(API + '/api/products');
    const data = await response.json();
    if (data.ok && Array.isArray(data.products)) {
      menuData = mapProducts(data.products);
      menuState = 'ready';
      try { localStorage.setItem('menu_cache', JSON.stringify(data.products)); } catch (_) {}
      renderCategories(); renderMenu(); updateFloatingBar();
    } else if (!menuData.length) { menuState = 'error'; renderMenu(); }
  } catch (error) {
    console.error("Products load မရပါ:", error);
    if (!menuData.length) { menuState = 'error'; renderMenu(); }
  }
}
document.addEventListener('DOMContentLoaded', () => { loadProductsFromDB(); });

let cart = {};
let activeCat = 'All', chosenDay = 'today';

function renderCategories() {
    const row = document.getElementById('cat-row'); if (!row) return;
    const cats = []; menuData.forEach(m => { if (m.category && !cats.includes(m.category)) cats.push(m.category); });
    if (activeCat !== 'All' && !cats.includes(activeCat)) activeCat = 'All';
    const count = c => c === 'All' ? menuData.length : menuData.filter(m => m.category === c).length;
    row.innerHTML = ['All', ...cats].map(c => `<button class="cat-btn ${c === activeCat ? 'active' : ''}" type="button" data-cat="${esc(c)}" onclick="filterCat(this.dataset.cat, this)">${c === 'All' ? 'အားလုံး' : esc(c)}<small>${count(c)}</small></button>`).join('');
}
function stockLeft(m) { return m.stock === null || m.stock === undefined ? Infinity : m.stock; }
function ctlHtml(id, mini) {
    const m = menuData.find(x => x.id == id); if (!m) return '';
    const n = cart[id] || 0;
    if (mini) {
        if (m.available === false || stockLeft(m) <= 0) return '';
        if (!n) return `<button class="btn-add" type="button" onclick="addToCart(${m.id})" aria-label="ထည့်မည်"><i class="fa-solid fa-plus" style="font-size:12px"></i></button>`;
        return `<div class="stepper"><button type="button" onclick="stepCard(${m.id},-1)" aria-label="လျှော့မည်"><i class="fa-solid fa-minus" style="font-size:11px"></i></button><b>${n}</b><button type="button" onclick="stepCard(${m.id},1)" aria-label="တိုးမည်"><i class="fa-solid fa-plus" style="font-size:11px"></i></button></div>`;
    }
    if (m.available === false || stockLeft(m) <= 0) return `<button class="btn-add" type="button" disabled aria-label="မရနိုင်ပါ"><i class="fa-solid fa-ban" style="font-size:13px"></i> မရနိုင်ပါ</button>`;
    if (!n) return `<button class="btn-add" type="button" onclick="addToCart(${m.id})" aria-label="${esc(m.name)} ထည့်မည်"><i class="fa-solid fa-plus" style="font-size:12px"></i> ထည့်မည်</button>`;
    return `<div class="stepper"><button type="button" onclick="stepCard(${m.id},-1)" aria-label="လျှော့မည်"><i class="fa-solid fa-minus" style="font-size:12px"></i></button><b>${n}</b><button type="button" onclick="stepCard(${m.id},1)" aria-label="တိုးမည်"><i class="fa-solid fa-plus" style="font-size:12px"></i></button></div>`;
}
function syncCards() {
    document.querySelectorAll('[data-ctl]').forEach(el => {
        const id = el.getAttribute('data-ctl'), html = ctlHtml(id, el.hasAttribute('data-mini'));
        if (el.innerHTML !== html) el.innerHTML = html;
        const card = el.closest('.card'); if (card) card.classList.toggle('in', !!cart[id]);
    });
}
function cardHtml(i) {
    const sold = i.available === false || stockLeft(i) <= 0;
    const low = !sold && stockLeft(i) <= 5 && stockLeft(i) !== Infinity;
    return `
        <article class="card ${sold ? 'sold' : ''} ${cart[i.id] ? 'in' : ''}">
            <div class="card-media">
                <img src="${esc(i.image || PLACEHOLDER)}" class="card-img" loading="lazy" alt="${esc(i.name)}" onerror="this.onerror=null;this.src=PLACEHOLDER" onclick="openImageViewerById(${i.id})">
                ${sold ? '<span class="tag sold">ယနေ့ ကုန်ပါပြီ</span>' : low ? `<span class="tag">ကျန် ${stockLeft(i)} ခုသာ</span>` : ''}
            </div>
            <div class="card-body">
                <span class="item-name">${esc(i.name)}</span>
                <div class="card-foot">
                    <span class="price">${i.price.toLocaleString()}<small>Ks</small></span>
                    <div class="ctl" data-ctl="${i.id}">${ctlHtml(i.id)}</div>
                </div>
            </div>
        </article>`;
}
function renderFreq() {
    const box = document.getElementById('freq'); if (!box) return;
    const q = document.getElementById('searchInput').value.trim();
    const cnt = {};
    loadHistory().forEach(h => (h.cartItems || []).forEach(it => { cnt[it.id] = (cnt[it.id] || 0) + (Number(it.qty) || 1); }));
    const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).map(id => menuData.find(m => m.id == id)).filter(m => m && m.available !== false && stockLeft(m) > 0).slice(0, 6);
    if (!top.length || q || activeCat !== 'All') { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.style.display = 'block';
    box.innerHTML = '<div class="cat-h" style="margin-top:4px">ပြန်မှာမည်<span>သင်မကြာခဏမှာသော</span></div><div class="freq-row">' + top.map(m => `<div class="mini"><img src="${esc(m.image || PLACEHOLDER)}" alt="" onerror="this.onerror=null;this.src=PLACEHOLDER"><div class="m-t"><b>${esc(m.name)}</b><span>${m.price.toLocaleString()} Ks</span></div><div data-ctl="${m.id}" data-mini>${ctlHtml(m.id, true)}</div></div>`).join('') + '</div>';
}
function renderMenu() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const grid = document.getElementById('grid-box');
    const items = menuData.filter(i => (activeCat === 'All' || i.category === activeCat) && i.name.toLowerCase().includes(q));

    if (!menuData.length) {
        document.getElementById('freq').style.display = 'none';
        if (menuState === 'error') { grid.innerHTML = '<div class="empty"><b>စာရင်း ရယူ၍ မရပါ</b>အင်တာနက် စစ်ပြီး ပြန်ကြိုးစားပါ<br><button class="btn-main" style="width:auto;padding:11px 22px;margin:12px auto 0;" onclick="menuState=\'loading\';renderMenu();loadProductsFromDB()">ပြန်ကြိုးစားမည်</button></div>'; return; }
        grid.innerHTML = '<div class="menu-grid">' + Array.from({ length: 6 }, () => '<div class="card skel"><div class="card-media sk" style="border-radius:0"></div><div class="card-body"><div class="sk" style="height:14px;width:80%"></div><div class="sk" style="height:14px;width:50%"></div><div class="sk" style="height:34px;width:100%;margin-top:6px"></div></div></div>').join('') + '</div>';
        return;
    }

        grid.innerHTML = '<div class="empty"><b>ရှာမတွေ့ပါ</b>အခြားစကားလုံးဖြင့် ရှာကြည့်ပါ သို့မဟုတ် "အားလုံး" ကို ရွေးပါ</div>';

    }

        const cats = []; items.forEach(i => { if (!cats.includes(i.category)) cats.push(i.category); });
        grid.innerHTML = cats.map(c => { const list = items.filter(i => i.category === c); return `<section class="cat-sec" id="sec-${encodeURIComponent(c)}"><div class="cat-h">${esc(c)}<span>${list.length} မျိုး</span></div><div class="menu-grid">${list.map(cardHtml).join('')}</div></section>`; }).join('');
    } else {
        grid.innerHTML = `<div class="cat-h" style="margin-top:6px">${activeCat === 'All' ? 'ရှာဖွေမှု ရလဒ်' : esc(activeCat)}<span>${items.length} မျိုး</span></div><div class="menu-grid">${items.map(cardHtml).join('')}</div>`;
    }
}
function focusSearch() { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => document.getElementById('searchInput').focus({ preventScroll: true }), 350); }
(function () { const t = document.getElementById('tools'); if (!t || !('IntersectionObserver' in window)) return;
  const sentinel = document.createElement('div'); sentinel.style.cssText = 'height:1px;margin-top:-1px'; t.parentNode.insertBefore(sentinel, t);
  new IntersectionObserver(e => t.classList.toggle('stuck', !e[0].isIntersecting), { threshold: 0 }).observe(sentinel); })();

}

function clearMenuSearch() {

}

function filterCat(c, el) {

    renderMenu();

}

let _toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function addToCart(id) {
    const m = menuData.find(x => x.id == id); if (!m) return;
    if (m.available === false || stockLeft(m) <= 0) return toast('ယခု မရနိုင်ပါ');
    if ((cart[id] || 0) + 1 > stockLeft(m)) return toast(`ကျန်သည်မှာ ${stockLeft(m)} ခုသာ ဖြစ်ပါသည်`);
    cart[id] = (cart[id] || 0) + 1; updateFloatingBar();
}
function stepCard(id, d) {
    if (d > 0) return addToCart(id);
    cart[id] = (cart[id] || 0) - 1; if (cart[id] <= 0) delete cart[id];
    updateFloatingBar();
}

function updateFloatingBar() {
    cleanCart();
    let t = 0, n = 0;
    for (let id in cart) { t += cart[id] * menuData.find(m => m.id == id).price; n += cart[id]; }
    const bar = document.getElementById('cart-bar');
    bar.style.display = t > 0 ? 'flex' : 'none';
    document.getElementById('bar-total').innerText = t.toLocaleString();
    document.getElementById('bar-count').innerText = n;
    const tc = document.getElementById('top-count'); tc.innerText = n; tc.classList.toggle('show', n > 0);
    syncCards();
}
function clearCart() { if (!confirm('ခြင်းတောင်းထဲက ပစ္စည်းအားလုံး ရှင်းမလား?')) return; cart = {}; packs = []; packMode = false; document.getElementById('cart-sheet').style.display = 'none'; updateFloatingBar(); }
function setStep(n) { const s = document.querySelectorAll('#stepbar i'); s.forEach((x, i) => x.classList.toggle('on', i < n)); document.getElementById('stepbar').style.display = n ? 'flex' : 'none'; }
function setTimeIn(mins) {
    const d = new Date(Date.now() + mins * 60000); d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5, 0, 0);
    document.getElementById('in-time').value = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function loadCust() { try { return JSON.parse(localStorage.getItem('yns_cust') || '{}'); } catch (_) { return {}; } }

/* ===== ဝယ်သူ၏ မှတ်ချက် (အော်ဒါတစ်ခုလုံးအတွက် — ထုပ်ပိုးပုံ၊ အချဉ်ရည်၊ စပ်/ဆားနည်း ...) ===== */
const ONOTE_CHIPS = ['အချဉ်ရည် တစ်ခါတည်း စမ်းပေးပါ', 'အချဉ်ရည် သက်သက်ထုပ်ပါ'];
function nameOf(id) { const m = menuData.find(x => x.id == id); return m ? m.name : '?'; }
function noteVal() { const el = document.getElementById('in-note'); return el ? el.value.trim() : ''; }
function renderNoteChips() {
    const box = document.getElementById('note-chips'); if (!box) return;
    const v = noteVal();
    box.innerHTML = ONOTE_CHIPS.map((c, i) => `<button type="button" class="chip ${v.includes(c) ? 'on' : ''}" onclick="toggleNoteChip(${i})">${c}</button>`).join('');
}
function toggleNoteChip(i) {
    const el = document.getElementById('in-note'), c = ONOTE_CHIPS[i];
    let v = el.value.trim();
    if (v.includes(c)) v = v.replace(c, '').replace(/\s*။\s*။/g, '။').replace(/^\s*။\s*/, '').replace(/\s*။\s*$/, '').replace(/\s{2,}/g, ' ').trim();
    else v = v ? (/[။\n]$/.test(v) ? v + ' ' : v + '။ ') + c : c;
    el.value = v.slice(0, 300);
    renderNoteChips();
}

function renderCartList() {
    const list = document.getElementById('cart-list');
    let html = '', total = 0, count = 0;
    for (let id in cart) {
        const item = menuData.find(m => m.id == id);
        if (!item) continue;

        count++;
        html += `
        <div class="cart-line"><div class="cart-item">
            <img src="${esc(item.image || PLACEHOLDER)}" class="cart-item-img" onerror="this.onerror=null;this.src=PLACEHOLDER">
            <div class="cart-item-info">
                <b>${esc(item.name)}</b>
                <span>${item.price.toLocaleString()} Ks</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="qty-group">
                    <button class="btn-q" onclick="changeQty(${id}, -1)">-</button>
                    <input type="number" class="val-q" value="${cart[id]}" onchange="manualQty(${id}, this.value)">
                    <button class="btn-q" onclick="changeQty(${id}, 1)">+</button>
                </div>
                <button class="btn-del" onclick="removeItem(${id})"><i class="fa-regular fa-trash-can"></i></button>
            </div>
        </div></div>`;
    }
    document.getElementById('item-count-badge').innerText = count + " မျိုး";
    list.innerHTML = html + '<div class="cart-total-row"><button type="button" class="clear-cart" style="float:left" onclick="clearCart()">အားလုံးရှင်းမည်</button>ပစ္စည်း စုစုပေါင်း &nbsp;<span>' + total.toLocaleString() + '</span> Ks</div>';
}

/* ===== ထုပ်ခွဲပေးရန် (ထုပ် ၁၊ ထုပ် ၂ ...) =====
   packs = [{ items: {id: qty}, sauce: 'none'|'with'|'separate', note: '' }] */
const PACK_BUILDER = true;   // ဝယ်ထားသည့်အထဲမှ ထုပ်ခွဲရွေးနိုင်သော စနစ် (false ပြောင်းလျှင် ပျောက်မည်)
let packMode = false, packs = [];
const newPack = () => ({ items: {}, sauce: 'none', note: '' });
const SAUCE_TXT = { with: '🥣 အချဉ်ရည်ပါ (တစ်ခါတည်းစမ်း)', separate: '🥣 အချဉ်ရည် သက်သက်ထုပ်', none: '' };
function packAssigned(id) { return packs.reduce((s, p) => s + (p.items[id] || 0), 0); }
function packRemaining() { const r = {}; for (const id in cart) { const left = cart[id] - packAssigned(id); if (left > 0) r[id] = left; } return r; }
function reconcilePacks() {
    for (const p of packs) for (const id of Object.keys(p.items)) if (!cart[id]) delete p.items[id];
    for (const id in cart) {
        let over = packAssigned(id) - cart[id];
        for (let i = packs.length - 1; i >= 0 && over > 0; i--) {
            const q = packs[i].items[id] || 0, cut = Math.min(q, over);
            if (cut) { if (q - cut > 0) packs[i].items[id] = q - cut; else delete packs[i].items[id]; over -= cut; }
        }
    }
}
function setPackMode(on) { packMode = on; if (on && !packs.length) packs.push(newPack()); renderPacks(); }
function addPack() { packs.push(newPack()); renderPacks(); }
function delPack(i) { packs.splice(i, 1); if (!packs.length) packs.push(newPack()); renderPacks(); }
function packAdd(i, id) { if (cart[id] - packAssigned(id) <= 0) return; packs[i].items[id] = (packs[i].items[id] || 0) + 1; renderPacks(); }
function packQty(i, id, d) { packSet(i, id, (packs[i].items[id] || 0) + d); }
function packSet(i, id, v) {
    let n = parseInt(v, 10);
    const max = cart[id] - (packAssigned(id) - (packs[i].items[id] || 0));
    if (isNaN(n) || n <= 0) delete packs[i].items[id]; else packs[i].items[id] = Math.min(n, max);
    renderPacks();
}
function packSauce(i, v) { packs[i].sauce = v; renderPacks(); }
function packAllSauce(v) { packs.forEach(p => p.sauce = v); renderPacks(); }
function packNote(i, v) { packs[i].note = String(v).slice(0, 80); }
function packSplitEach() { packs = Object.keys(cart).map(id => ({ items: { [id]: cart[id] }, sauce: 'none', note: '' })); renderPacks(); }
function packRestToOne() {
    const rem = packRemaining(); if (!Object.keys(rem).length) return;
    const empty = packs.find(p => !Object.keys(p.items).length);
    if (empty) empty.items = rem; else packs.push({ items: rem, sauce: 'none', note: '' });
    renderPacks();
}
function packLines(list) {
    return (list || []).map(p => `ထုပ် ${p.no}: ` + p.items.map(x => `${x.name} ×${x.qty}`).join(', ') + (SAUCE_TXT[p.sauce] ? ' · ' + SAUCE_TXT[p.sauce] : '') + (p.note ? ' · 📝 ' + p.note : ''));
}
function validatePacks() {
    if (!packMode) return '';
    const rem = packRemaining(), ids = Object.keys(rem);
    if (ids.length) return 'မခွဲရသေးသော ပစ္စည်း ရှိနေပါသည်:\n' + ids.map(id => `${nameOf(id)} ×${rem[id]}`).join('၊ ') + '\n\n"ကျန်တာ တစ်ထုပ်တည်း ထုပ်ပေး" ကို နှိပ်နိုင်ပါသည်';
    if (!packs.some(p => Object.keys(p.items).length)) return 'ထုပ်ခွဲမည်ဟု ရွေးထားပါသည်၊ ထုပ်ထဲ ပစ္စည်းထည့်ပါ (သို့မဟုတ် "တစ်ထုပ်တည်း" ကို ပြန်ရွေးပါ)';
    return '';
}
function renderPacks() {
    const box = document.getElementById('pack-box'); if (!box) return;
    if (!PACK_BUILDER) { packMode = false; packs = []; box.innerHTML = ''; return; }
    const ids = Object.keys(cart);
    const totalQty = ids.reduce((s, id) => s + cart[id], 0);
    if (totalQty < 2) { packMode = false; packs = []; box.innerHTML = ''; return; }

    let h = `<div class="pack-card">
        <div class="pack-h">📦 ထုပ်ပိုးပုံ ရွေးချယ်ရန်</div>
        <div class="pack-switch">
          <div class="pack-sw ${!packMode ? 'on' : ''}" onclick="setPackMode(false)">တစ်ထုပ်တည်း ထုပ်ပေးပါ</div>
          <div class="pack-sw ${packMode ? 'on' : ''}" onclick="setPackMode(true)">ပစ္စည်းတွေကို ထုပ်ခွဲမည်</div>
        </div>`;

    if (!packMode) {
        h += `<p class="pack-help">အော်ဒါအားလုံးကို တစ်ထုပ်တည်း ထုပ်ပေးပါမည်။ သီးခြားခွဲချင်မှသာ အပေါ်က <b>“ပစ္စည်းတွေကို ထုပ်ခွဲမည်”</b> ကို ရွေးပါ။</p>`;
    } else {
        const rem = packRemaining(), remIds = Object.keys(rem);
        const assignedQty = totalQty - remIds.reduce((sum, id) => sum + rem[id], 0);
        const pct = totalQty ? Math.round((assignedQty / totalQty) * 100) : 0;
        const progressText = assignedQty === totalQty ? 'အော်ဒါအားလုံး ခွဲပြီးပါပြီ' : `${totalQty} ခုထဲမှ ${assignedQty} ခု ထုပ်ပြီးပါပြီ`;

        h += `<div class="pack-notice"><i class="fa-solid fa-circle-info"></i><span><b>သတိပြုရန်</b><br>အစပ်နှင့် ဆား မရနိုင်ပါ။ လိုအပ်သော အချက်များကို ထုပ်တစ်ထုပ်ချင်းစီ၏ မှတ်ချက်ထဲ ရေးထားနိုင်ပါသည်။</span></div>`;
        h += `<div class="pack-progress"><span>${progressText}</span><div class="pack-progress-track"><div class="pack-progress-fill" style="width:${pct}%"></div></div></div>`;
        h += remIds.length
            ? `<div class="pack-rem warn">မခွဲရသေးသည် — ${remIds.map(id => esc(nameOf(id)) + ' ×' + rem[id]).join('၊ ')}</div>`
            : `<div class="pack-rem ok">အော်ဒါအားလုံး ခွဲပြီးပါပြီ</div>`;

        packs.forEach((p, i) => {
            const its = Object.keys(p.items);
            h += `<div class="pk"><div class="pk-h"><span>ထုပ် ${i + 1}</span>${packs.length > 1 ? `<button type="button" class="pk-x" onclick="delPack(${i})">ဖျက်မည်</button>` : ''}</div>`;
            h += its.length ? its.map(id => `<div class="pk-it"><span>${esc(nameOf(id))}</span><div class="qty-group"><button class="btn-q" onclick="packQty(${i},${id},-1)">-</button><input type="number" class="val-q" value="${p.items[id]}" onchange="packSet(${i},${id},this.value)"><button class="btn-q" onclick="packQty(${i},${id},1)">+</button></div></div>`).join('')
                : `<p class="pack-help">အောက်က ပစ္စည်းကို နှိပ်ပြီး ဒီထုပ်ထဲ ထည့်ပါ</p>`;
            if (remIds.length) h += `<div class="pk-add">${remIds.map(id => `<button type="button" class="chip" onclick="packAdd(${i},${id})">＋ ${esc(nameOf(id))} <small>(ကျန် ${rem[id]})</small></button>`).join('')}</div>`;
            h += `<div class="pk-lbl">ဤထုပ်အတွက် မှတ်ချက် <small>(မရေးလည်းရပါသည်)</small></div><input type="text" class="note-in" style="margin-top:4px;" maxlength="80" placeholder="ဥပမာ - အချဉ်ရည် သီးခြားထည့်ပေးပါ" value="${esc(p.note)}" oninput="packNote(${i}, this.value)">`;
            h += `<div class="pk-sauce" style="margin-top:10px">Thank You</div></div>`;
        });

        h += `<div class="pk-actions"><button type="button" class="pk-btn" onclick="addPack()">＋ ထုပ်အသစ်</button>` +
            (remIds.length ? `<button type="button" class="pk-btn" onclick="packRestToOne()">ကျန်တာ တစ်ထုပ်တည်း ထည့်မည်</button>` : `<span></span>`) +
            `<button type="button" class="pk-btn full" onclick="packSplitEach()">တစ်မျိုးစီ သီးခြားထုပ်ပေးရန်</button></div>`;
        h += `<div class="pack-summary"><span class="summary-mark"><i class="fa-solid fa-box-open"></i></span><span class="pack-summary-text"><b>${packs.length} ထုပ် စီစဉ်ထားပါသည်</b>${assignedQty === totalQty ? 'ဆက်လက်၍ အချက်အလက်ဖြည့်နိုင်ပါပြီ' : 'ကျန်တာကို အောက်က shortcut ဖြင့် အလွယ်တကူ ထည့်နိုင်ပါသည်'}</span></div>`;
    }
    box.innerHTML = h + '</div>';
}

function openCart() {
    cleanCart();
    if (Object.keys(cart).length === 0) { document.getElementById('cart-sheet').style.display = 'none'; updateFloatingBar(); return; }
    document.getElementById('receipt-view').style.display = 'none';
    document.getElementById('cart-content-wrapper').style.display = 'block';

    reconcilePacks();
    renderCartList();
    renderPacks();

    document.getElementById('cart-sheet').style.display = 'block';
    document.getElementById('form-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'flex';
    document.getElementById('modal-title').innerText = "ခြင်းတောင်းစာရင်း";
    document.getElementById('modal-back').style.display = '';
    document.getElementById('modal-back').onclick = () => { document.getElementById('cart-sheet').style.display = 'none'; };
    setStep(1);
}

function removeItem(id) { delete cart[id]; if (Object.keys(cart).length === 0) document.getElementById('cart-sheet').style.display = 'none'; else openCart(); updateFloatingBar(); }
function changeQty(id, d) { cart[id] = Math.min((cart[id] || 0) + d, 99); if (cart[id] <= 0) delete cart[id]; if (Object.keys(cart).length === 0) document.getElementById('cart-sheet').style.display = 'none'; else openCart(); updateFloatingBar(); }
function manualQty(id, v) { let n = parseInt(v); if (n <= 0 || isNaN(n)) delete cart[id]; else cart[id] = Math.min(n, 99); if (Object.keys(cart).length === 0) document.getElementById('cart-sheet').style.display = 'none'; else openCart(); updateFloatingBar(); }

function selectDate(day) { chosenDay = day; document.getElementById('chip-today').classList.toggle('active', day === 'today'); document.getElementById('change-date-btn').classList.toggle('active', day === 'other'); document.getElementById('custom-date-row').style.display = day === 'other' ? 'block' : 'none'; }
function myPop(m) { document.getElementById('alert-msg').innerText = m; document.getElementById('alert-bg').style.display = 'block'; document.getElementById('alert-pop').style.display = 'block'; }
function closeAlert() { document.getElementById('alert-bg').style.display = 'none'; document.getElementById('alert-pop').style.display = 'none'; }

function step2() {
    const pe = validatePacks(); if (pe) return myPop(pe);
    document.getElementById('form-box').style.display = 'block'; 
    document.getElementById('next-btn').style.display = 'none'; 
    document.getElementById('modal-title').innerText = "အချက်အလက်ဖြည့်ပါ"; 
    document.getElementById('form-contact').innerHTML = contactBtns(SHOP.contact || {});
    renderPromo(); applyPromo(true); renderNoteChips(); setStep(2);
    { const c = loadCust(); const n = document.getElementById('in-name'), p = document.getElementById('in-phone'); if (c.name && !n.value) n.value = c.name; if (c.phone && !p.value) { p.value = c.phone; applyPromo(true); } }
    
    document.getElementById('modal-back').onclick = () => {
        document.getElementById('form-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'flex';
        document.getElementById('modal-title').innerText = "ခြင်းတောင်းစာရင်း";
        setStep(1);
        document.getElementById('modal-back').onclick = () => { document.getElementById('cart-sheet').style.display = 'none'; };
    };
    setTimeout(() => { document.getElementById('modal-scroll-area').scrollTo({ top: 0, behavior: 'smooth' }); }, 100);
}

/* ===== Promo ကုဒ် / ဖောက်သည်လက်ဆောင် လျှော့ဈေး (server က တွက်ပေး) ===== */
let PROMO = { discount: 0, code: '', label: '', auto: false, err: '', loyal: null };
let _promoSeq = 0;
function cartSubtotal() { let t = 0; for (const id in cart) { const m = menuData.find(x => x.id == id); if (m) t += m.price * cart[id]; } return t; }
async function applyPromo(silent) {
    const phone = document.getElementById('in-phone').value.trim();
    const code = document.getElementById('in-promo').value.trim();
    cleanCart();
    const items = Object.keys(cart).map(id => ({ id: Number(id), qty: cart[id] }));
    if (!items.length) return;
    if (!silent && !code) { PROMO.err = 'Promo ကုဒ် ရိုက်ထည့်ပါ'; return renderPromo(); }
    if (!silent && !phone) { PROMO.err = 'ဖုန်းနံပါတ် အရင်ဖြည့်ပါ'; return renderPromo(); }
    const seq = ++_promoSeq;
    try {
        const r = await fetch(API + '/api/promo/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, code, items }) });
        const d = await r.json();
        if (seq !== _promoSeq) return;
        PROMO = { discount: 0, code: '', label: '', auto: false, err: '', loyal: d.loyal || null };
        if (d.ok) { PROMO.discount = d.discount || 0; PROMO.code = d.code || ''; PROMO.label = d.label || ''; PROMO.auto = !!d.auto; }
        else PROMO.err = d.error || 'ကုဒ် မမှန်ပါ';
    } catch (_) {
        if (seq !== _promoSeq) return;
        PROMO.err = silent ? '' : 'အင်တာနက် ချိတ်ဆက်မှု စစ်ပြီး ပြန်ကြိုးစားပါ';
    }
    renderPromo();
}
function renderPromo() {
    const msg = document.getElementById('promo-msg'), box = document.getElementById('sum-box');
    if (!msg || !box) return;
    let m = '', cls = '';
    if (PROMO.err) { m = '❌ ' + PROMO.err; cls = 'err'; }
    else if (PROMO.discount > 0) { m = `✅ ${PROMO.auto ? '🎁 ' : ''}${PROMO.label} — ${PROMO.discount.toLocaleString()} Ks လျှော့ပေးပါသည်`; cls = 'ok'; }
    else if (PROMO.loyal) { m = `🎁 ဖောက်သည်လက်ဆောင် — ယခုအော်ဒါအပါအဝင် ${PROMO.loyal.toGo + 1} ကြိမ်မြောက်မှာ ${PROMO.loyal.text || (PROMO.loyal.percent + '%')} လျှော့ပေးပါမည်`; cls = 'info'; }
    msg.className = 'promo-msg ' + cls; msg.textContent = m;
    const sub = cartSubtotal(), d = PROMO.err ? 0 : PROMO.discount;
    box.innerHTML = `<div><span>ပစ္စည်း စုစုပေါင်း</span><span>${sub.toLocaleString()} Ks</span></div>` +
        (d > 0 ? `<div class="disc"><span>🎟 လျှော့ဈေး</span><span>-${d.toLocaleString()} Ks</span></div>` : '') +
        `<div class="tot"><span>ကျသင့်ငွေ</span><span>${(sub - d).toLocaleString()} Ks</span></div>`;
}

/* ===== ဆိုင်အချက်အလက် / ဆက်သွယ်ရန် / ဖွင့်ချိန် ===== */
let SHOP = { open: true, message: "", contact: {}, loyal: {} };
const okUrl = (u, p) => typeof u === 'string' && u.startsWith(p) ? u : '';
function contactBtns(c) {
    c = c || {}; let h = '';
    const tel = okUrl(c.tel, 'tel:'), vb = okUrl(c.viber_url, 'viber://'), ms = okUrl(c.messenger_url, 'https://');
    if (tel) h += `<a class="si-btn si-call" href="${esc(tel)}"><i class="fa-solid fa-phone"></i> ဖုန်းခေါ်မည်</a>`;
    if (vb) h += `<a class="si-btn si-viber" href="${esc(vb)}"><i class="fa-brands fa-viber"></i> Viber</a>`;
    if (ms) h += `<a class="si-btn si-msgr" href="${esc(ms)}" target="_blank" rel="noopener"><i class="fa-brands fa-facebook-messenger"></i> Messenger</a>`;
    return h ? `<div class="si-btns">${h}</div>` : '';
}
function fmtT(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    const p = h < 12 ? 'မနက်' : h < 15 ? 'နေ့လယ်' : h < 19 ? 'ညနေ' : 'ည';
    return `${p} ${h % 12 || 12}:${String(m).padStart(2, '0')}`;
}
function hoursState(c) {
    if (!/^\d\d:\d\d$/.test(c.open_time || '') || !/^\d\d:\d\d$/.test(c.close_time || '')) return null;
    const n = new Date(), mins = n.getHours() * 60 + n.getMinutes();
    const [oh, om] = c.open_time.split(':').map(Number), [ch, cm] = c.close_time.split(':').map(Number);
    const o = oh * 60 + om, cl = ch * 60 + cm;
    if (o === cl) return null;
    return { inside: o < cl ? (mins >= o && mins < cl) : (mins >= o || mins < cl) };
}
function renderShopInfo() {
    const c = SHOP.contact || {}, L = SHOP.loyal || {};
    const hs = hoursState(c);
    const hoursTxt = c.hours || (hs ? `${fmtT(c.open_time)} မှ ${fmtT(c.close_time)} အထိ` : '');
    const st = document.getElementById('hero-status'), ct = document.getElementById('hero-contact'), ly = document.getElementById('loyal-strip');
    let h = '';
    if (!SHOP.open) h += '<span class="hs shut"><i></i>ယခု ဆိုင်ပိတ်ထားသည်</span>';
    else if (hs) h += hs.inside ? '<span class="hs"><i></i>ဖွင့်ထားသည်</span>' : '<span class="hs shut"><i></i>ယခု ဆိုင်ပိတ်ချိန်</span>';
    if (hoursTxt) h += `<span class="hh"><i class="fa-regular fa-clock"></i> ${esc(hoursTxt)}</span>`;
    if (SHOP.open && hs && !hs.inside) h += `<span class="hnote">ကြိုမှာထားနိုင်ပါသည် — ${esc(fmtT(c.open_time))} မှစ၍ ပြင်ဆင်ပေးပါမည်</span>`;
    st.innerHTML = h;
    const tel = okUrl(c.tel, 'tel:'), vb = okUrl(c.viber_url, 'viber://'), ms = okUrl(c.messenger_url, 'https://');
    ct.innerHTML = (tel ? `<a class="circ" href="${esc(tel)}" aria-label="ဖုန်းခေါ်မည်"><i class="fa-solid fa-phone"></i></a>` : '') +
        (vb ? `<a class="circ" href="${esc(vb)}" aria-label="Viber"><i class="fa-brands fa-viber"></i></a>` : '') +
        (ms ? `<a class="circ" href="${esc(ms)}" target="_blank" rel="noopener" aria-label="Messenger"><i class="fa-brands fa-facebook-messenger"></i></a>` : '');
    if (L.on) { ly.innerHTML = `<i>🎁</i><span><b>ဖောက်သည်လက်ဆောင်</b> — အော်ဒါ ${L.every} ကြိမ်မြောက်တိုင်း ${esc(L.text || (L.percent + '%'))} လျှော့ပေးပါသည်</span>`; ly.style.display = 'flex'; }
    else { ly.style.display = 'none'; ly.innerHTML = ''; }
}
async function checkShop() {
    try {
        const r = await fetch(API + '/api/shop-status');
        const d = await r.json();
        if (!d || d.ok === false) return;
        SHOP = { open: d.open !== false, message: d.message || "", contact: d.contact || {}, loyal: d.loyal || {} };
        const el = document.getElementById('shop-closed');
        if (el) {
            if (SHOP.open) { el.classList.remove('show'); el.innerHTML = ''; }
            else { el.innerHTML = '🔒 ယခု ဆိုင်ပိတ်ထားပါသည်' + (SHOP.message ? '<small>' + esc(SHOP.message) + '</small>' : '<small>ခေတ္တစောင့်ပေးပါ 🙏</small>'); el.classList.add('show'); }
        }
        renderShopInfo();
    } catch (_) { /* အင်တာနက်မကောင်းလျှင် ပုံမှန်အတိုင်း ဆက်သုံးနိုင် (server က နောက်ဆုံး ပိတ်ပေးမည်) */ }
}

async function sendOrder() {
    if (!SHOP.open) return myPop(SHOP.message || "ယခု ဆိုင်ပိတ်ထားပါသည်၊ ခေတ္တစောင့်ပေးပါ 🙏");

    if (chosenDay === 'other' && !otherDate) return myPop("တခြားရက် ရွေးထားပါက ရက်စွဲ ရွေးပေးပါ ✨");

    const submitBtn = document.getElementById('submit-order-btn');

    submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> အော်ဒါပို့နေပါသည်...";

    const dayStr = chosenDay === 'today' ? "ဒီနေ့" : otherDate;
    const orderNoteText = noteVal();
    const sentPacks = packMode ? packs.filter(p => Object.keys(p.items).length).length : 0;

    try {
        const response = await fetch(API + '/api/send-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name, phone, date: dayStr, time,
                items: ids.map(id => ({ id: Number(id), qty: cart[id] })),

                })) : [],
                promo: document.getElementById('in-promo').value.trim()
            })
        });

        let resData = {};
        try { resData = await response.json(); } catch (_) {}
        if (!response.ok || !resData.ok) {
            throw Object.assign(new Error(resData.error || 'Order submission failed'), { fromServer: !!resData.error });
        }

        // စျေးနှုန်း၊ ဘောက်ချာနံပါတ်၊ စုစုပေါင်း အားလုံးကို server က ပြန်ပေးတာကို သုံးမယ်

            return { name: i.name, price: i.price.toLocaleString(), qty: i.qty, total: i.total.toLocaleString() };
        });
        const disc = Number(resData.discount) || 0;
        const pLines = packLines(resData.packs);
        if (disc > 0) tableRowsHtml += `<tr><td colspan="3" style="color:#15803d;">🎟 ${esc(resData.promo_code)} · ${esc(resData.promo_label)}</td><td class="text-right" style="color:#15803d;">-${disc.toLocaleString()} Ks</td></tr>`;

        const extra = { discount: disc, promo: resData.promo_code || '', packLines: pLines, note: savedNote };

            localStorage.setItem('yns_cust', JSON.stringify({ name, phone }));
            if (orderHistory.length > 10) orderHistory.length = 10;

        cart = {}; packs = []; packMode = false;

        submitBtn.disabled = false;
        submitBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> အော်ဒါအတည်ပြုမည်";
    }

    const canDownload = Array.isArray(data.canvasItems) && data.canvasItems.length > 0;
    window._histV = data.vCode;
    document.getElementById('receipt-view').innerHTML = `<div id="hist-tracker">${trackerHtml(data)}</div><div class="receipt-card" style="margin-top: 15px;"><div class="receipt-header"><b>မြင်သာကြက်ကင်</b><span>Voucher No: ${esc(data.vCode)}</span></div><div class="receipt-row"><span>ဝယ်သူအမည်:</span> <span>${esc(data.name)}</span></div><div class="receipt-row"><span>ဖုန်း/ID:</span> <span>${esc(data.phone)}</span></div><div class="receipt-row"><span>နေ့ရက်/အချိန်:</span> <span>${esc(data.date)} (${esc(data.time)})</span></div><div class="receipt-divider"></div><table class="v-table"><thead><tr><th>အမည်</th><th>ဈေးနှုန်း</th><th class="text-center">ခုရေ</th><th class="text-right">စုစုပေါင်း</th></tr></thead><tbody>${data.tableRowsHtml}</tbody></table><div class="receipt-divider"></div><div class="receipt-row receipt-total-text"><span>စုစုပေါင်းကျသင့်ငွေ:</span> <span>${esc(data.total)} Ks</span></div></div>${Array.isArray(data.cartItems) && data.cartItems.length ? `<button class="btn-main" style="margin-top:16px;" onclick="reorder(${index})"><i class="fa-solid fa-rotate-right"></i> ဒီအတိုင်း ပြန်မှာမည်</button>` : ''}<div style="display:grid; grid-template-columns:${canDownload ? '1fr 1fr' : '1fr'}; gap:10px; margin-top:10px;"><button class="btn-ghost" onclick="viewOrderHistory()"><i class="fa-solid fa-arrow-left"></i> ပြန်သွားမည်</button>${canDownload ? `<button class="btn-ghost" onclick="downloadHistoryVoucher(${index})"><i class="fa-solid fa-download"></i> Voucher ဒေါင်းလုဒ်</button>` : ''}</div>`;
}

function reorder(index) {
    const data = JSON.parse(localStorage.getItem('order_history') || '[]')[index];
    if (!data || !Array.isArray(data.cartItems)) return;
    let added = 0, skipped = 0;
    data.cartItems.forEach(it => {
        const m = menuData.find(x => x.id == it.id);
        if (!m || m.available === false || stockLeft(m) <= 0) { skipped++; return; }
        const q = Math.min(it.qty, 99, stockLeft(m)); if (q > 0) { cart[it.id] = Math.min(99, (cart[it.id] || 0) + q); added++; } else skipped++;
    });
    updateFloatingBar();
    if (!added) return myPop('ယခင်မှာထားသော ပစ္စည်းများ ယခု မရနိုင်ပါ');
    openCart();
    if (skipped) toast('တချို့ပစ္စည်း ယခု မရနိုင်သဖြင့် ချန်ထားပါသည်');
}

function downloadHistoryVoucher(index) {
    const data = JSON.parse(localStorage.getItem('order_history') || '[]')[index];
    if (!data || !data.canvasItems) return myPop("ဤမှတ်တမ်းအတွက် ဒေါင်းလုဒ် မရနိုင်ပါ");
    generateHDVoucher(data.vCode, data.name, data.phone, data.date, data.time, data.total, data.canvasItems, data.extra);
}

async function generateHDVoucher(vCode, name, phone, date, time, total, items, extra) {
    extra = extra || {};
    try { await document.fonts.load('bold 13px "Noto Sans Myanmar"', 'မြင်သာကြက်ကင်'); } catch (_) {}
    const baseWidth = 480;
    const mctx = document.createElement('canvas').getContext('2d'); mctx.font = '12px "Noto Sans Myanmar", sans-serif';
    const maxW = baseWidth - 64;
    const graphemes = (t) => { try { return Array.from(new Intl.Segmenter('my', { granularity: 'grapheme' }).segment(t), x => x.segment); } catch (_) { return Array.from(t); } };
    const wrap = (txt) => {
        const out = [];
        for (const para of String(txt).split(/\n/)) {
            let line = '';
            for (const w of para.split(' ')) {
                let t = line ? line + ' ' + w : w;
                if (mctx.measureText(t).width <= maxW) { line = t; continue; }
                if (line) { out.push(line); line = ''; }
                if (mctx.measureText(w).width <= maxW) { line = w; continue; }
                for (const g of graphemes(w)) { if (mctx.measureText(line + g).width > maxW && line) { out.push(line); line = g; } else line += g; }
            }
            out.push(line);
        }
        return out;
    };
    const packRows = []; (extra.packLines || []).forEach(l => wrap(l).forEach(x => packRows.push(x)));
    const noteRows = extra.note ? wrap(extra.note) : [];
    const hasDisc = Number(extra.discount) > 0;
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
    let baseHeight = 350 + (items.length * 30) + (hasDisc ? 30 : 0) + (packRows.length ? 36 + packRows.length * 22 : 0) + (noteRows.length ? 40 + noteRows.length * 22 : 0);
    const scale = 2; canvas.width = baseWidth * scale; canvas.height = baseHeight * scale; ctx.scale(scale, scale);

    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, baseWidth, baseHeight);
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3; ctx.strokeRect(10, 10, baseWidth - 20, baseHeight - 20);
    ctx.fillStyle = '#0f172a'; ctx.textAlign = 'center'; ctx.font = 'bold 24px "Noto Sans Myanmar", sans-serif'; ctx.fillText('🍗 မြင်သာကြက်ကင်', baseWidth / 2, 45);
    ctx.font = 'bold 13px "Noto Sans Myanmar", sans-serif'; ctx.fillStyle = '#ef4444'; ctx.fillText(`Voucher No: ${vCode}`, baseWidth / 2, 70);
    ctx.font = 'bold 11px "Noto Sans Myanmar", sans-serif'; ctx.fillStyle = '#64748b'; ctx.fillText('ဝယ်ယူအားပေးမှုကို ကျေးဇူးတင်ပါသည်', baseWidth / 2, 90);
    
    ctx.textAlign = 'left'; ctx.fillStyle = '#0f172a'; ctx.font = '13px "Noto Sans Myanmar", sans-serif';
    ctx.fillText(`ဝယ်သူအမည်:   ${name}`, 30, 125); ctx.fillText(`ဖုန်း / ID:        ${phone}`, 30, 150); ctx.fillText(`နေ့ရက်/အချိန်:  ${date} (${time})`, 30, 175);
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(25, 195); ctx.lineTo(baseWidth - 25, 195); ctx.stroke(); ctx.setLineDash([]);

    ctx.fillStyle = '#64748b'; ctx.font = 'bold 11px "Noto Sans Myanmar", sans-serif'; ctx.fillText('အမည်', 30, 220); ctx.fillText('ဈေးနှုန်း', 180, 220); ctx.textAlign = 'center'; ctx.fillText('ခုရေ', 310, 220); ctx.textAlign = 'right'; ctx.fillText('စုစုပေါင်း', baseWidth - 30, 220);
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(25, 230); ctx.lineTo(baseWidth - 25, 230); ctx.stroke();
    
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px "Noto Sans Myanmar", sans-serif'; let currentY = 255;
    items.forEach(item => {
        ctx.textAlign = 'left'; ctx.fillText(item.name, 30, currentY); ctx.fillText(`${item.price} Ks`, 180, currentY);
        ctx.textAlign = 'center'; ctx.fillText(item.qty, 310, currentY); ctx.textAlign = 'right'; ctx.fillText(`${item.total} Ks`, baseWidth - 30, currentY);
        currentY += 30;
    });
    if (hasDisc) {
        ctx.fillStyle = '#15803d'; ctx.textAlign = 'left'; ctx.fillText(`လျှော့ဈေး (${extra.promo || 'PROMO'})`, 30, currentY);
        ctx.textAlign = 'right'; ctx.fillText(`-${Number(extra.discount).toLocaleString()} Ks`, baseWidth - 30, currentY);
        ctx.fillStyle = '#0f172a'; currentY += 30;
    }

    ctx.setLineDash([6, 4]); ctx.strokeStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(25, currentY - 10); ctx.lineTo(baseWidth - 25, currentY - 10); ctx.stroke(); ctx.setLineDash([]);
    currentY += 20; ctx.font = 'bold 16px "Noto Sans Myanmar", sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#0f172a'; ctx.fillText('စုစုပေါင်းကျသင့်ငွေ:', 30, currentY);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ef4444'; ctx.font = 'bold 18px "Noto Sans Myanmar", sans-serif'; ctx.fillText(`${total} Ks`, baseWidth - 30, currentY);

    if (packRows.length) {
        currentY += 28; ctx.setLineDash([6, 4]); ctx.strokeStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(25, currentY - 10); ctx.lineTo(baseWidth - 25, currentY - 10); ctx.stroke(); ctx.setLineDash([]);
        currentY += 14; ctx.textAlign = 'left'; ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px "Noto Sans Myanmar", sans-serif'; ctx.fillText('📦 ထုပ်ခွဲပေးရန်', 30, currentY);
        ctx.font = '12px "Noto Sans Myanmar", sans-serif'; ctx.fillStyle = '#334155';
        packRows.forEach(r => { currentY += 22; ctx.fillText(r, 30, currentY); });
    }

    if (noteRows.length) {
        currentY += 28; ctx.setLineDash([6, 4]); ctx.strokeStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(25, currentY - 10); ctx.lineTo(baseWidth - 25, currentY - 10); ctx.stroke(); ctx.setLineDash([]);
        currentY += 14; ctx.textAlign = 'left'; ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px "Noto Sans Myanmar", sans-serif'; ctx.fillText('📝 မှတ်ချက်', 30, currentY);
        ctx.font = '12px "Noto Sans Myanmar", sans-serif'; ctx.fillStyle = '#334155';
        noteRows.forEach(r => { currentY += 22; ctx.fillText(r, 30, currentY); });
    }

    try { const link = document.createElement('a'); link.download = `Voucher-${vCode}.png`; link.href = canvas.toDataURL('image/png'); link.click(); } catch (e) {}
}

    // ပုံကို အကြီးချဲ့ပြပေးမည့် စနစ်ဖွင့်ခြင်း
function openImageViewer(imgUrl, itemName, id) {
    document.getElementById('viewerImageTarget').src = imgUrl;
    document.getElementById('viewerImageTitle').innerText = itemName;
    const bar = document.getElementById('iv-bar'), m = id ? menuData.find(x => x.id == id) : null;
    if (m && m.available !== false && stockLeft(m) > 0) {
        document.getElementById('iv-price').textContent = m.price.toLocaleString() + ' Ks';
        document.getElementById('iv-add').onclick = () => { addToCart(m.id); toast(m.name + ' ထည့်ပြီး'); };
        bar.style.display = 'flex';
    } else bar.style.display = 'none';
    document.getElementById('imageViewerModal').style.display = 'flex';
}

// ပုံကြီးကြည့်ရှုရာမှ ပိတ်ပြီး ပင်မစာမျက်နှာသို့ ပြန်သွားခြင်း
function closeImageViewer() {
    document.getElementById('imageViewerModal').style.display = 'none';
    document.getElementById('viewerImageTarget').src = ''; // Memory သက်သာစေရန် ပုံလမ်းကြောင်းကို ခေတ္တဖျက်ထားခြင်း
}
    
function openImageViewerById(id) {
    const i = menuData.find(m => m.id == id);
    if (i) openImageViewer(i.image || PLACEHOLDER, i.name, i.id);
}


/* =====================================================================
   Order tracking — ကိုယ့်အော်ဒါ ဘယ်အဆင့်ရောက်လဲ ကြည့်ရန်
   (voucher + ဖုန်း/ID နှစ်ခုလုံးကို server က စစ်ပြီးမှ status ပြန်ပေးသည်)
===================================================================== */
const TRK = {
  New:        { ico: '🕒', title: 'ဆိုင်က လက်ခံရန် စောင့်နေသည်', short: 'လက်ခံရန် စောင့်နေသည်', msg: 'အော်ဒါကို ဆိုင်သို့ ပို့ပြီးပါပြီ။ ဆိုင်က လက်ခံပြီးပါက ဤနေရာတွင် အလိုအလျောက် ပြောင်းပါမည်။' },
  Processing: { ico: '🔥', title: 'လက်ခံပြီး ချက်နေပါပြီ', short: 'ချက်နေသည်', msg: 'ဆိုင်မှ လက်ခံပြီး ပြင်ဆင်နေပါသည်။' },
  Ready:      { ico: '✅', title: 'အဆင်သင့် ဖြစ်ပါပြီ!', short: 'အဆင်သင့်', msg: 'လာယူနိုင်ပါပြီ။' },
  Completed:  { ico: '🎉', title: 'ပြီးစီးပါပြီ', short: 'ပြီးစီး', msg: 'ဝယ်ယူအားပေးမှုကို ကျေးဇူးတင်ပါသည်။' },
  Cancelled:  { ico: '❌', title: 'ဆိုင်မှ ပယ်ဖျက်လိုက်ပါသည်', short: 'ပယ်ဖျက်', msg: 'အသေးစိတ် သိလိုပါက ဆိုင်သို့ ဆက်သွယ်ပါ။' }
};
const TRK_FINAL = ['Completed', 'Cancelled'];
let lastCheckedAt = null, _refreshing = false, _fastPoll = null;

function loadHistory() { try { return JSON.parse(localStorage.getItem('order_history') || '[]'); } catch (_) { return []; } }
function saveHistory(list) { try { localStorage.setItem('order_history', JSON.stringify(list)); } catch (_) {} }

function statusPill(s) { return s && TRK[s] ? `<span class="st-pill st-${s}">${TRK[s].short}</span>` : ''; }

function trkFoot() {
    return `<div class="trk-foot"><span>${lastCheckedAt ? 'နောက်ဆုံးစစ်ချိန် ' + lastCheckedAt : 'စစ်ဆေးနေသည်...'}</span><button type="button" onclick="refreshStatuses(true)">🔄 ပြန်စစ်မည်</button></div>`;
}

function trackerHtml(h) {
    const st = TRK[h.status] ? h.status : 'New';
    const t = TRK[st];
    if (st === 'Cancelled') {
        return `<div class="trk trk-cancel"><div class="trk-head"><div class="trk-ico">${t.ico}</div><div class="trk-title">${t.title}</div><p class="trk-msg">${t.msg}</p></div>${trkFoot()}</div>`;
    }
    const keys = ['New', 'Processing', 'Ready', 'Completed'], labels = ['ပို့ပြီး', 'ချက်နေ', 'အဆင်သင့်', 'ပြီးစီး'];
    const idx = keys.indexOf(st);
    const steps = keys.map((k, i) => `<div class="trk-step ${i < idx ? 'done' : i === idx ? 'cur' : ''}"><div class="c">${i < idx ? '✓' : i + 1}</div>${labels[i]}</div>`).join('');
    const late = (st === 'New' && h.ts && Date.now() - h.ts > 10 * 60000)
        ? `<div class="trk-late">⏳ ၁၀ မိနစ်ကျော်ပြီ ဆိုင်က မလက်ခံသေးပါ။ ဖုန်းဆက်၍ အတည်ပြုပေးပါရန် မေတ္တာရပ်ခံအပ်ပါသည်။</div>` : '';
    const paid = h.payment_status === 'Paid' ? '<div style="text-align:center;"><span class="trk-paid">💰 ငွေရရှိပြီး</span></div>' : '';
    return `<div class="trk"><div class="trk-head"><div class="trk-ico">${t.ico}</div><div class="trk-title">${t.title}</div><p class="trk-msg">${t.msg}</p>${paid}</div><div class="trk-steps">${steps}</div>${late}${trkFoot()}</div>`;
}

function renderActiveBanner(hist) {
    const active = hist.filter(h => h.status && !TRK_FINAL.includes(h.status));
    const el = document.getElementById('active-banner');
    if (!el) return;
    if (!active.length) { el.classList.remove('show'); return; }
    const h = active[0];
    document.getElementById('ab-title').textContent = `${h.vCode} · ${TRK[h.status].ico} ${TRK[h.status].short}` + (active.length > 1 ? `  (+${active.length - 1})` : '');
    el.classList.add('show');
}

// ပေါ်နေသော tracker / banner / history list များကို အသစ်ပြန်ဆွဲ
function renderTrackers() {
    const hist = loadHistory();
    const live = document.getElementById('live-tracker');
    if (live && window._trackV) { const e = hist.find(x => x.vCode === window._trackV); if (e) live.innerHTML = trackerHtml(e); }
    const one = document.getElementById('hist-tracker');
    if (one && window._histV) { const e = hist.find(x => x.vCode === window._histV); if (e) one.innerHTML = trackerHtml(e); }
    renderActiveBanner(hist);
    if (typeof renderFreq === 'function' && menuData.length) renderFreq();
    if (document.getElementById('historyItemsContainer') && document.getElementById('historySearchInput')) filterOrderHistory();
}

async function refreshStatuses(manual) {
    if (_refreshing) return;
    const pending = loadHistory().filter(h => h.vCode && h.phone && !TRK_FINAL.includes(h.status)).slice(0, 10);
    if (!pending.length) { renderTrackers(); return; }
    _refreshing = true;
    try {
        const r = await fetch(API + '/api/order-status', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orders: pending.map(h => ({ vCode: h.vCode, phone: h.phone })) })
        });
        const d = await r.json();
        if (!d.ok) throw new Error('bad response');

        const fresh = loadHistory();               // စစ်နေစဉ် အော်ဒါအသစ် တင်ခဲ့လျှင် မပျောက်စေရန်
        const changes = [];
        fresh.forEach(h => {
            const s = d.orders && d.orders[h.vCode];
            if (!s) return;
            if (h.status && h.status !== s.status) changes.push({ vCode: h.vCode, to: s.status });
            h.status = s.status; h.payment_status = s.payment_status;
        });
        saveHistory(fresh);
        lastCheckedAt = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        renderTrackers();
        if (changes.length) {
            const c = changes[changes.length - 1];
            try { navigator.vibrate && navigator.vibrate(150); } catch (_) {}
            myPop(`${c.vCode}\n${TRK[c.to].ico} ${TRK[c.to].title}`);
        }
    } catch (e) {
        if (manual) myPop('အင်တာနက် ချိတ်ဆက်မှု စစ်ပြီး ပြန်ကြိုးစားပါ');
    } finally { _refreshing = false; }
}

function startFastPoll() {
    if (_fastPoll) return;
    _fastPoll = setInterval(() => { if (!document.hidden) refreshStatuses(); }, 8000);
}

function openTracking(vCode) {
    const idx = loadHistory().findIndex(x => x.vCode === vCode);
    if (idx < 0) return;
    viewOrderHistory();
    renderSingleHistory(idx);
}
function openActiveTracking() {
    const a = loadHistory().find(h => h.status && !TRK_FINAL.includes(h.status));
    if (a) openTracking(a.vCode);
}

setInterval(() => { if (!document.hidden) refreshStatuses(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatuses(); });

window.onload = () => { renderMenu(); renderTrackers(); refreshStatuses(); checkShop(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkShop(); });
setInterval(checkShop, 60000);

  </script>
