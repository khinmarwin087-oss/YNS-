<!DOCTYPE html> 
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#083D31">
<title>အင်တာနက် မရှိပါ</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;text-align:center;line-height:1.85;
    font-family:'Noto Sans Myanmar','Pyidaungsu',system-ui,sans-serif;
    background:radial-gradient(70% 60% at 100% 0%,rgba(242,163,58,.4),transparent 62%),linear-gradient(168deg,#0F6B54,#08463A 55%,#052E26)}
  main{max-width:340px}
  img{width:96px;height:96px;border-radius:26px;box-shadow:0 18px 30px -14px rgba(0,0,0,.6)}
  h1{margin:18px 0 6px;font-size:21px}
  p{margin:0 0 22px;color:rgba(255,255,255,.82);font-size:14px}
  button{min-height:52px;padding:0 30px;border:0;border-radius:18px;background:#F2A33A;color:#2B1A00;font:800 15px/1 inherit;font-family:inherit;box-shadow:0 14px 22px -12px rgba(242,163,58,.9)}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>အင်တာနက် မရှိပါ</h1>
  <p>ချိတ်ဆက်မှု ပြန်ရလျှင် မီနူးနဲ့ အော်ဒါတင်တာ ပြန်သုံးလို့ရပါမယ်။</p>
  <button type="button" onclick="location.reload()">ပြန်စမ်းမည်</button>
</main>
<script>addEventListener('online',()=>location.reload())</script>
</body>
</html>
