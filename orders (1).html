<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Orders Management • YNS Kitchen</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .app { display: flex; width: 100%; min-height: 100vh; background-color: #f8fafc; }

    /* ---------- Header ---------- */
    .dash-header-custom { display: flex; align-items: center; justify-content: space-between; position: relative; padding: 8px 2px; margin-bottom: 10px; }
    .header-center-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800; color: #0f172a; margin: 0; white-space: nowrap; pointer-events: none; }
    .top-actions-right { display: flex; gap: 8px; align-items: center; margin-left: auto; position: relative; z-index: 20; }
    .icon-circle-btn { width: 42px; height: 42px; border-radius: 12px; background: #fff; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #0f172a; box-shadow: 0 2px 4px rgba(0,0,0,.04); cursor: pointer; transition: .2s; }
    .icon-circle-btn:active { transform: scale(.95); }
    .icon-circle-btn.active { background: #0f172a; color: #fff; }

    .search-popover { display: none; margin-bottom: 12px; background: #fff; padding: 8px 14px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px rgba(0,0,0,.05); align-items: center; gap: 10px; }
    .search-popover.show { display: flex; }
    .search-popover input { width: 100%; border: 0; outline: none; font-size: 14px; background: transparent; padding: 6px 0; }

    .date-popover { display: none; position: absolute; top: 50px; right: 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.12); z-index: 100; width: 230px; flex-direction: column; gap: 8px; }
    .date-popover.show { display: flex; }
    .date-popover label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .date-popover input { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; font-size: 13px; outline: none; }
    .date-reset-btn { background: #f1f5f9; border: 0; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #334155; cursor: pointer; }

    /* ---------- Tabs (sticky) ---------- */
    .o-tabs { display: flex; gap: 8px; margin: 0 -12px 14px; padding: 8px 12px; overflow-x: auto; position: sticky; top: 0; z-index: 30; background: rgba(248,250,252,.94); backdrop-filter: blur(8px); scrollbar-width: none; }
    .o-tabs::-webkit-scrollbar { display: none; }
    .o-tab { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff; font-size: 13px; font-weight: 700; color: #64748b; cursor: pointer; white-space: nowrap; transition: .2s; }
    .o-tab.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .o-count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .o-tab.active .o-count { background: rgba(255,255,255,.2); color: #fff; }
    .o-tab.has-new .o-count { background: #ef4444; color: #fff; }

    /* ---------- Order cards ---------- */
    .o-list { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 760px; margin: 0 auto; }
    @media (min-width: 1100px) { .o-list { grid-template-columns: repeat(2, 1fr); max-width: none; } }

    .oc { background: #fff; border-radius: 18px; border: 1px solid #e2e8f0; border-left: 5px solid #94a3b8; box-shadow: 0 2px 8px rgba(15,23,42,.04); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .oc-new { border-left-color: #2563eb; }
    .oc-cooking { border-left-color: #ea580c; }
    .oc-ready { border-left-color: #16a34a; }
    .oc-completed { border-left-color: #64748b; }
    .oc-cancelled { border-left-color: #dc2626; opacity: .8; }

    .oc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .oc-voucher { display: inline-block; font-size: 11px; background: #f1f5f9; padding: 3px 9px; border-radius: 6px; color: #475569; font-weight: 800; letter-spacing: .3px; }
    .oc-name { margin: 7px 0 3px; font-size: 17px; font-weight: 800; color: #0f172a; word-break: break-word; }
    .oc-phone { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #475569; text-decoration: none; font-weight: 600; }
    a.oc-phone { color: #0284c7; }
    .oc-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .oc-badge { padding: 5px 11px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .b-new { background: #eff6ff; color: #2563eb; }
    .b-cooking { background: #fff7ed; color: #ea580c; }
    .b-ready { background: #f0fdf4; color: #16a34a; }
    .b-completed { background: #f1f5f9; color: #475569; }
    .b-cancelled { background: #fef2f2; color: #dc2626; }
    .oc-time { font-size: 11px; color: #94a3b8; white-space: nowrap; }

    .oc-pickup { display: flex; flex-wrap: wrap; gap: 8px; }
    .oc-chip { display: inline-flex; align-items: center; gap: 7px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 700; }

    /* ---------- Ordered items ---------- */
    .oc-items-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; }
    .oc-items-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 12px; font-weight: 800; color: #475569; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
    .oc-items { list-style: none; margin: 0; padding: 0; }
    .oc-items li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid #eef2f7; }
    .oc-items li:last-child { border-bottom: 0; }
    .oc-qty { flex-shrink: 0; min-width: 44px; text-align: center; background: #0f172a; color: #fff; border-radius: 10px; padding: 6px 8px; font-size: 15px; font-weight: 800; }
    .oc-iname { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: #0f172a; word-break: break-word; }
    .oc-iname small { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; color: #94a3b8; }
    .oc-iprice { flex-shrink: 0; font-size: 13px; font-weight: 800; color: #334155; white-space: nowrap; }
    .oc-noitems { padding: 16px 14px; font-size: 13px; line-height: 1.6; color: #64748b; text-align: center; }

    /* ---------- Total + actions ---------- */
    .oc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 14px; }
    .oc-foot-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #991b1b; }
    .oc-total { font-size: 20px; font-weight: 800; color: #dc2626; white-space: nowrap; }
    .oc-pay { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 800; }
    .pay-paid { background: #dcfce7; color: #15803d; }
    .pay-pending { background: #fef9c3; color: #a16207; }
    .pay-failed { background: #fee2e2; color: #b91c1c; }

    .oc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .oa-btn { flex: 1 1 120px; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 0; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: #fff; transition: .15s; }
    .oa-btn:active { transform: scale(.97); }
    .oa-btn:disabled { opacity: .6; cursor: wait; }
    .oa-accept { background: #2563eb; }
    .oa-ready { background: #16a34a; }
    .oa-complete { background: #0f172a; }
    .oa-paid { background: #059669; }
    .oa-cancel { background: #fee2e2; color: #dc2626; flex: 0 1 110px; }

    .o-empty, .o-error { text-align: center; padding: 48px 20px; color: #64748b; }
    .o-empty i, .o-error i { font-size: 34px; color: #cbd5e1; display: block; margin-bottom: 12px; }
    .o-error { color: #b91c1c; }
    .o-error a { color: #0284c7; font-weight: 700; }
  </style>
</head>

<body>

<div class="app">

  <!-- Sidebar Nav -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div><b>YNS Kitchen</b><small>Admin Panel</small></div>
    </div>
    <div class="nav-title">MAIN MENU</div>
    <nav class="nav" id="sidebarNav"></nav>
  </aside>

  <!-- Main Content -->
  <main class="main" style="overflow-x: hidden; padding: 12px;">

    <header class="dash-header-custom">
      <button class="icon-circle-btn" onclick="toggleSidebar()" aria-label="Menu" type="button">
        <i class="fa-solid fa-bars"></i>
      </button>

      <h1 class="header-center-title">Orders</h1>

      <div class="top-actions-right">
        <button class="icon-circle-btn" id="searchBtn" onclick="toggleSearch()" aria-label="Search" type="button">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="icon-circle-btn" id="dateBtn" onclick="toggleDate()" aria-label="Date" type="button">
          <i class="fa-solid fa-calendar-days"></i>
        </button>
        <button class="icon-circle-btn" onclick="loadOrders()" aria-label="Refresh" type="button">
          <i class="fa-solid fa-rotate-right"></i>
        </button>

        <div class="date-popover" id="datePopover">
          <label>Filter By Date</label>
          <input type="date" id="filterDate" onchange="applyFilters()">
          <button class="date-reset-btn" onclick="clearDateFilter()" type="button">
            <i class="fa-solid fa-rotate-right"></i> Reset
          </button>
        </div>
      </div>
    </header>

    <div class="search-popover" id="searchPopover">
      <i class="fa-solid fa-magnifying-glass" style="color:#94a3b8;"></i>
      <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Voucher, အမည်, ဖုန်း ရှာရန်...">
      <i class="fa-solid fa-xmark" onclick="toggleSearch()" style="cursor:pointer; color:#94a3b8;"></i>
    </div>

    <!-- Status Tabs -->
    <div class="o-tabs" id="statusTabs">
      <button class="o-tab active" data-status="new" onclick="filterStatus('new', this)" type="button">အသစ် <span class="o-count" id="cnt-new">0</span></button>
      <button class="o-tab" data-status="cooking" onclick="filterStatus('cooking', this)" type="button">ချက်နေသည် <span class="o-count" id="cnt-cooking">0</span></button>
      <button class="o-tab" data-status="ready" onclick="filterStatus('ready', this)" type="button">အဆင်သင့် <span class="o-count" id="cnt-ready">0</span></button>
      <button class="o-tab" data-status="done" onclick="filterStatus('done', this)" type="button">ပြီးစီး <span class="o-count" id="cnt-done">0</span></button>
      <button class="o-tab" data-status="all" onclick="filterStatus('all', this)" type="button">အားလုံး <span class="o-count" id="cnt-all">0</span></button>
    </div>

    <div id="ordersListContainer">
      <div class="o-empty"><i class="fa-solid fa-spinner fa-spin"></i>အော်ဒါများကို ရယူနေသည်...</div>
    </div>

  </main>
</div>

<script src="js/main.js"></script>

<script>
  let rawOrders = [];
  let currentStatus = "new";
  let busy = false;
  let lastNewCount = -1;

  const STATUS_LABEL = {
    new: "အသစ်",
    cooking: "ချက်နေသည်",
    ready: "အဆင်သင့်",
    completed: "ပြီးစီး",
    cancelled: "ပယ်ဖျက်"
  };

  /* ---------- Helpers ---------- */
  function escapeHtml(val) {
    return String(val ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function toNum(v) {
    const n = Number(String(v ?? 0).replace(/[^\d.\-]/g, ""));
    return Number.isFinite(n) ? n : 0;
  }

  function formatMoney(amount) {
    return typeof money === "function" ? money(amount) : Number(amount).toLocaleString() + " Ks";
  }

  function safeJsonParse(value) {
    if (typeof value !== "string") return value;
    try { return JSON.parse(value); } catch (e) { return []; }
  }

  function parseOrderItems(order) {
    let raw = order.items_json ?? order.items ?? order.order_items ?? order.cart ?? [];
    raw = safeJsonParse(raw);
    if (raw && !Array.isArray(raw)) {
      if (Array.isArray(raw.items)) raw = raw.items;
      else if (typeof raw === "object") raw = Object.values(raw);
    }
    return Array.isArray(raw) ? raw : [];
  }

  function getItemName(item) {
    return item.name ?? item.title ?? item.product_name ?? item.item_name ?? "Unknown Item";
  }

  function getItemPrice(item) {
    return toNum(item.price ?? item.unit_price ?? item.unitPrice ?? item.item_price ?? item.amount ?? item.cost ?? item.pricePerItem ?? 0);
  }

  function getItemQty(item) {
    return toNum(item.qty ?? item.quantity ?? item.count ?? 1) || 1;
  }

  function getItemLineTotal(item) {
    const t = toNum(item.total);
    return t > 0 ? t : getItemPrice(item) * getItemQty(item);
  }

  function getCustomerName(order) {
    return order.customer_name ?? order.customerName ?? order.name ?? "Guest";
  }

  function getPhone(order) {
    return order.phone ?? order.customer_phone ?? "-";
  }

  function getOrderTotal(order, items) {
    let total = toNum(order.total ?? order.grand_total ?? order.total_amount ?? 0);
    if (!total && items.length) total = items.reduce((sum, it) => sum + getItemLineTotal(it), 0);
    return total;
  }

  function normalizeStatus(status) {
    const v = String(status || "new").trim().toLowerCase();
    if (v === "pending" || v === "new") return "new";
    if (v === "processing" || v === "cooking") return "cooking";
    if (v === "cancelled" || v === "canceled") return "cancelled";
    return v;
  }

  // ဘောက်ချာနံပါတ်ရှေ့က # ကို ထပ်မထည့်မိစေရန် (အရင်က ##MS-1234 ပြနေသည်)
  function cleanVoucher(order) {
    const v = String(order.voucher_code || "").trim();
    return v ? v.replace(/^#+/, "") : (order.id ? String(order.id) : "N/A");
  }

  function phoneHref(p) {
    const digits = String(p || "").replace(/[\s\-()]/g, "");
    return /^(\+?95|0)\d{6,}$/.test(digits) ? "tel:" + digits : "";
  }

  // DB က UTC သိမ်းသည် — မြန်မာစံတော်ချိန် (UTC+6:30) ရက်စွဲသို့ ပြောင်း
  function getOrderDate(order) {
    const value = order.created_at ?? order.createdAt ?? order.order_date ?? "";
    if (!value) return "";
    const s = String(value);
    const d = new Date(/[zZ]$|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ", "T") + "Z");
    if (isNaN(d)) return s.split("T")[0].split(" ")[0];
    return new Date(d.getTime() + 390 * 60000).toISOString().split("T")[0];
  }

  function orderedAtText(order) {
    const v = order.created_at ?? "";
    return typeof fmtDate === "function" ? fmtDate(v) : v;
  }

  /* ---------- Load ---------- */
  async function loadOrders(silent) {
    const container = document.getElementById("ordersListContainer");
    try {
      const res = await apiFetch("/api/admin/orders?pageSize=50");
      rawOrders = Array.isArray(res) ? res : ((res && res.orders) || []);

      const newCount = rawOrders.filter(o => normalizeStatus(o.status) === "new").length;
      if (silent === true && lastNewCount !== -1 && newCount > lastNewCount) {
        showToast("🔔 အော်ဒါအသစ် ရောက်ရှိလာပါသည်");
        try { if (navigator.vibrate) navigator.vibrate(200); } catch (_) {}
      }
      lastNewCount = newCount;

      applyFilters();
    } catch (error) {
      console.error("Load orders error:", error);
      if (silent === true) return;
      const msg = escapeHtml(error && error.message ? error.message : "Unknown error");
      container.innerHTML = `<div class="o-error"><i class="fa-solid fa-triangle-exclamation"></i>အော်ဒါ ဒေတာ ရယူ၍ မရပါ။<br><small>${msg}</small><br><br><a href="settings.html">Admin Key စစ်ဆေးရန် →</a></div>`;
    }
  }

  /* ---------- Search / date / tabs ---------- */
  function toggleSearch() {
    const box = document.getElementById("searchPopover");
    document.getElementById("searchBtn").classList.toggle("active");
    box.classList.toggle("show");
    if (box.classList.contains("show")) document.getElementById("searchInput").focus();
  }

  function toggleDate() {
    document.getElementById("datePopover").classList.toggle("show");
    document.getElementById("dateBtn").classList.toggle("active");
  }

  function clearDateFilter() {
    document.getElementById("filterDate").value = "";
    applyFilters();
    document.getElementById("datePopover").classList.remove("show");
    document.getElementById("dateBtn").classList.remove("active");
  }

  function filterStatus(status, btn) {
    currentStatus = String(status).toLowerCase();
    document.querySelectorAll(".o-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyFilters();
  }

  function updateCounts() {
    const c = { new: 0, cooking: 0, ready: 0, done: 0, all: rawOrders.length };
    rawOrders.forEach(o => {
      const s = normalizeStatus(o.status);
      if (s === "completed" || s === "cancelled") c.done++;
      else if (c[s] !== undefined) c[s]++;
    });
    for (const k of Object.keys(c)) {
      const el = document.getElementById("cnt-" + k);
      if (el) el.textContent = c[k];
    }
    const newTab = document.querySelector('.o-tab[data-status="new"]');
    if (newTab) newTab.classList.toggle("has-new", c.new > 0);
  }

  function applyFilters() {
    const searchInput = document.getElementById("searchInput");
    const dateInput = document.getElementById("filterDate");
    const query = searchInput ? searchInput.value.toLowerCase().trim() : "";
    const filterDateVal = dateInput ? dateInput.value : "";

    updateCounts();

    const filtered = rawOrders.filter(order => {
      const status = normalizeStatus(order.status);

      if (!query && currentStatus !== "all") {
        if (currentStatus === "done") {
          if (status !== "completed" && status !== "cancelled") return false;
        } else if (status !== currentStatus) {
          return false;
        }
      }

      if (query) {
        const voucher = String(order.voucher_code || "").toLowerCase();
        const name = String(getCustomerName(order)).toLowerCase();
        const phone = String(getPhone(order)).toLowerCase();
        if (!voucher.includes(query) && !name.includes(query) && !phone.includes(query)) return false;
      }

      if (filterDateVal && getOrderDate(order) !== filterDateVal) return false;
      return true;
    });

    renderOrders(filtered);
  }

  /* ---------- Render ---------- */
  function renderItems(items) {
    if (!items.length) {
      return `<div class="oc-items-box"><div class="oc-noitems"><i class="fa-regular fa-circle-question"></i> ဤအော်ဒါတွင် ပစ္စည်းစာရင်း မသိမ်းထားပါ (အော်ဒါဟောင်း ဖြစ်နိုင်သည်)။<br>Telegram မက်ဆေ့ချ်တွင် ကြည့်ပါ။</div></div>`;
    }

    const totalQty = items.reduce((s, it) => s + getItemQty(it), 0);
    const rows = items.map(item => {
      const qty = getItemQty(item);
      const price = getItemPrice(item);
      const line = getItemLineTotal(item);
      return `
        <li>
          <span class="oc-qty">×${qty}</span>
          <span class="oc-iname">${escapeHtml(getItemName(item))}${price > 0 ? `<small>${formatMoney(price)} / ခု</small>` : ""}</span>
          <span class="oc-iprice">${line > 0 ? formatMoney(line) : "-"}</span>
        </li>`;
    }).join("");

    return `
      <div class="oc-items-box">
        <div class="oc-items-head"><span><i class="fa-solid fa-bag-shopping"></i> မှာယူထားသည့် ပစ္စည်းများ</span><span>${items.length} မျိုး • ${totalQty} ခု</span></div>
        <ul class="oc-items">${rows}</ul>
      </div>`;
  }

  function renderActions(order, status, payStatus) {
    const id = Number(order.id);
    let html = "";

    if (status === "new") {
      html += `<button class="oa-btn oa-accept" onclick="updateOrderStatus(${id}, 'Processing', this)" type="button"><i class="fa-solid fa-fire"></i> လက်ခံမည်</button>`;
    } else if (status === "cooking") {
      html += `<button class="oa-btn oa-ready" onclick="updateOrderStatus(${id}, 'Ready', this)" type="button"><i class="fa-solid fa-check"></i> အဆင်သင့်</button>`;
    } else if (status === "ready") {
      html += `<button class="oa-btn oa-complete" onclick="updateOrderStatus(${id}, 'Completed', this)" type="button"><i class="fa-solid fa-circle-check"></i> ပေးပြီး / ပြီးစီး</button>`;
    }

    if (payStatus !== "Paid" && status !== "cancelled") {
      html += `<button class="oa-btn oa-paid" onclick="togglePaymentStatus(${id}, 'Paid', this)" type="button"><i class="fa-solid fa-money-bill-wave"></i> ငွေရပြီ</button>`;
    }

    if (status === "new") {
      html += `<button class="oa-btn oa-cancel" onclick="updateOrderStatus(${id}, 'Cancelled', this)" type="button"><i class="fa-solid fa-xmark"></i> ပယ်ဖျက်</button>`;
    }

    return html ? `<div class="oc-actions">${html}</div>` : "";
  }

  function renderOrders(orders) {
    const container = document.getElementById("ordersListContainer");

    if (!Array.isArray(orders) || orders.length === 0) {
      container.innerHTML = `<div class="o-empty"><i class="fa-regular fa-folder-open"></i>အော်ဒါများ မရှိသေးပါ။</div>`;
      return;
    }

    const cards = orders.map(order => {
      const items = parseOrderItems(order);
      const status = normalizeStatus(order.status);
      const statusKey = STATUS_LABEL[status] ? status : "new";
      const payStatus = order.payment_status || "Pending";
      const payClass = payStatus === "Paid" ? "pay-paid" : payStatus === "Failed" ? "pay-failed" : "pay-pending";
      const total = getOrderTotal(order, items);
      const phone = getPhone(order);
      const href = phoneHref(phone);

      const pd = String(order.pickup_date || "").trim();
      const pt = String(order.pickup_time || "").trim();
      const pickup = (pd || pt)
        ? `<div class="oc-pickup">
             ${pd ? `<span class="oc-chip"><i class="fa-solid fa-calendar-day"></i> ${escapeHtml(pd)}</span>` : ""}
             ${pt ? `<span class="oc-chip"><i class="fa-solid fa-clock"></i> ${escapeHtml(pt)}</span>` : ""}
           </div>`
        : "";

      const phoneHtml = href
        ? `<a class="oc-phone" href="${escapeHtml(href)}"><i class="fa-solid fa-phone"></i> ${escapeHtml(phone)}</a>`
        : `<span class="oc-phone"><i class="fa-solid fa-phone"></i> ${escapeHtml(phone)}</span>`;

      return `
        <article class="oc oc-${statusKey}">
          <div class="oc-top">
            <div>
              <span class="oc-voucher">#${escapeHtml(cleanVoucher(order))}</span>
              <h3 class="oc-name">${escapeHtml(getCustomerName(order))}</h3>
              ${phoneHtml}
            </div>
            <div class="oc-right">
              <span class="oc-badge b-${statusKey}">${escapeHtml(STATUS_LABEL[statusKey])}</span>
              <span class="oc-time">${escapeHtml(orderedAtText(order))}</span>
            </div>
          </div>

          ${pickup}
          ${renderItems(items)}

          <div class="oc-foot">
            <div class="oc-foot-label">စုစုပေါင်း <span class="oc-pay ${payClass}">${escapeHtml(payStatus)}</span></div>
            <b class="oc-total">${formatMoney(total)}</b>
          </div>

          ${renderActions(order, status, payStatus)}
        </article>`;
    }).join("");

    container.innerHTML = `<div class="o-list">${cards}</div>`;
  }

  /* ---------- Updates ---------- */
  async function patchOrder(dbId, payload, btn, busyText, errText) {
    if (!dbId) return alert("Order ID မရှိပါ");
    busy = true;
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${busyText}`;
    }
    try {
      await apiFetch(`/api/admin/orders/${dbId}`, { method: "PATCH", body: JSON.stringify(payload) });
    } catch (error) {
      console.error(error);
      alert(errText);
    } finally {
      busy = false;
      loadOrders();
    }
  }

  function updateOrderStatus(dbId, newStatus, btn) {
    if (newStatus === "Cancelled" && !confirm("ဤအော်ဒါကို ပယ်ဖျက်မှာ သေချာပါသလား?")) return;
    return patchOrder(dbId, { status: newStatus }, btn, "ခဏစောင့်ပါ...", "Order Status ပြောင်း၍ မရပါ");
  }

  function togglePaymentStatus(dbId, newPayStatus, btn) {
    return patchOrder(dbId, { payment_status: newPayStatus }, btn, "သိမ်းနေသည်...", "Payment Status ပြောင်း၍ မရပါ");
  }

  window.onload = function () {
    if (typeof renderAdminLayout === "function") renderAdminLayout("orders");
    loadOrders();
    // ၁၅ စက္ကန့်တစ်ခါ အော်ဒါအသစ် အလိုအလျောက် စစ်မည်
    setInterval(() => { if (!document.hidden && !busy) loadOrders(true); }, 15000);
  };
</script>

</body>
</html>
