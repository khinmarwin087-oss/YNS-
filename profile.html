<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ကျွန်ုပ်၏ ပရိုဖိုင်</title>
<meta name="theme-color" content="#0A4A3B">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#0D5C49;--ink:#17231E;--sub:#62706A;--line:#E5EAE7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F6F7F5;color:var(--ink);font-family:'Noto Sans Myanmar',system-ui,sans-serif;line-height:1.6;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit}
.hero{background:linear-gradient(165deg,#12705A,#0A4A3B 55%,#072F26);color:#fff;border-radius:0 0 30px 30px;padding:calc(14px + env(safe-area-inset-top)) 18px 70px}
.top{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.back{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:20px}
.top h1{margin:0;font-size:20px;font-weight:800}
.wrap{max-width:560px;margin:-50px auto 0;padding:0 18px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 20px 34px -24px rgba(6,40,31,.5);margin-bottom:14px}
.av{width:96px;height:96px;border-radius:50%;margin:-60px auto 8px;background:#E1F0E9;border:4px solid #fff;overflow:hidden;display:grid;place-items:center;font-size:38px;color:var(--brand);box-shadow:0 8px 18px -8px rgba(0,0,0,.3)}
.av img{width:100%;height:100%;object-fit:cover}
.c{text-align:center}
.lnk{background:none;border:0;color:var(--brand);font-weight:700;font-size:13.5px;padding:4px 8px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,textarea{width:100%;border-radius:14px;border:1.5px solid var(--line);background:#F7F9F8;padding:12px 14px;font-size:15px;outline:0}
input:focus,textarea:focus{border-color:var(--brand);background:#fff}
input[readonly]{color:var(--sub)}
.btn{width:100%;height:50px;border:0;border-radius:16px;background:linear-gradient(145deg,#12705A,#0A4A3B);color:#fff;font-weight:800;font-size:15px;margin-top:14px}
.btn.g{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.r{background:#FDE8E8;color:#B42F2F}
.note{font-size:12.5px;color:var(--sub);margin:6px 0 0}
.ok{display:inline-block;background:#E3F1EB;color:#0A4A3B;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#17231E;color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="hero"><div class="top"><a class="back" id="back" href="./">‹</a><h1>ကျွန်ုပ်၏ ပရိုဖိုင်</h1></div></div>
<div class="wrap" id="app" style="display:none">
  <div class="card">
    <div class="av" id="av">👤</div>
    <div class="c">
      <button class="lnk" type="button" onclick="$('file').click()">📷 ဓာတ်ပုံ ရွေးမည်</button>
      <button class="lnk" type="button" id="rmph" onclick="rmPhoto()" style="color:#B42F2F;display:none">ဖျက်မည်</button>
      <input type="file" id="file" accept="image/*" style="display:none" onchange="pickPhoto(this)">
      <div id="em" class="note"></div>
    </div>
    <label for="f-name">အမည်</label>
    <input id="f-name" maxlength="60" autocomplete="name" placeholder="အမည်ဖြည့်ပါ">
    <label for="f-phone">ဖုန်းနံပါတ်</label>
    <input id="f-phone" readonly placeholder="မချိတ်ရသေး">
    <div id="phnote"></div>
    <label for="f-addr">လိပ်စာ</label>
    <textarea id="f-addr" rows="3" maxlength="200" placeholder="Delivery လိပ်စာ (လမ်း၊ ရပ်ကွက်၊ မြို့နယ်)"></textarea>
    <button class="btn" type="button" id="save" onclick="saveProfile()">သိမ်းမည်</button>
  </div>
  <div class="card" id="linkcard" style="display:none">
    <b>📱 ဖုန်းနံပါတ် ချိတ်ရန်</b>
    <p class="note">အရင် ဖုန်းနံပါတ်ဖြင့် သုံးခဲ့ဖူးလျှင် ထိုအကောင့်၏ အော်ဒါမှတ်တမ်း၊ ဆုများ ပြန်ရရန် ဖုန်းနံပါတ်ကို Telegram OTP ဖြင့် အတည်ပြုပြီး ဤ Google အကောင့်နှင့် ချိတ်ပါ။</p>
    <a class="btn g" id="linkbtn" href="#" style="display:flex;align-items:center;justify-content:center;text-decoration:none">ဖုန်းနံပါတ် ချိတ်မည်</a>
  </div>
  <div class="card"><button class="btn r" style="margin:0" onclick="outLogin()">အကောင့်ထွက်မည်</button></div>
</div>
<div id="guest" class="wrap" style="display:none"><div class="card c"><p>ပရိုဖိုင်ကြည့်ရန် အကောင့်ဝင်ပါ</p><a class="btn" id="loginbtn" href="#" style="display:flex;align-items:center;justify-content:center;text-decoration:none">အကောင့်ဝင်မည်</a></div></div>
<div class="toast" id="toast"></div>
<script>
const API = /(^|\.)myintharchickenbbq\.shop$/.test(location.hostname) ? location.origin : 'https://yns.khinmarwin087.workers.dev';
if (API === location.origin) (function () { const W = 'https://yns.khinmarwin087.workers.dev', of = window.fetch.bind(window);
  window.fetch = function (u, o) { const s = typeof u === 'string' ? u : ''; if (s.indexOf(location.origin + '/api/') !== 0) return of(u, o);
    const retry = () => of(W + s.slice(location.origin.length), o);
    return of(u, o).then(r => /json/i.test(r.headers.get('content-type') || '') ? r : retry(), retry); }; })();
const SHOP_Q = (new URLSearchParams(location.search).get('shop') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 30);
const SHOP_QS = SHOP_Q && SHOP_Q !== 'main' ? '?shop=' + SHOP_Q : '';
const $ = id => document.getElementById(id);
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); };
const TOK = (() => { try { return localStorage.getItem('user_token') || ''; } catch (_) { return ''; } })();
const home = './' + SHOP_QS, H = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOK };
$('back').href = home;
const loginUrl = (extra) => home + (SHOP_QS ? '&' : '?') + 'login=1&back=profile.html' + (extra || '');
$('loginbtn').href = loginUrl(); $('linkbtn').href = loginUrl('&link=1');
function paintPhoto(u) {
  if (u) { const i = document.createElement('img'); i.alt = ''; i.src = u; $('av').replaceChildren(i); } else $('av').textContent = '👤';
  $('rmph').style.display = u ? 'inline' : 'none';
}
async function load() {
  let me = null;
  if (TOK) { try { const r = await fetch(API + '/api/auth/me', { headers: H }); if (r.ok) me = (await r.json()).user; } catch (_) {} }
  if (!me) { $('guest').style.display = 'block'; return; }
  $('app').style.display = 'block';
  $('f-name').value = me.name || ''; $('f-addr').value = me.address || '';
  $('f-phone').value = me.phone ? '0' + me.phone.slice(2) : '';
  $('em').textContent = me.email ? 'Google: ' + me.email : '';
  $('phnote').innerHTML = me.phone ? '<span class="ok">✓ Telegram ဖြင့် အတည်ပြုပြီး</span>' : '<p class="note">ဖုန်းနံပါတ် မချိတ်ရသေးပါ — အောက်က ခလုတ်ဖြင့် ချိတ်နိုင်သည်</p>';
  $('linkcard').style.display = me.phone ? 'none' : 'block';
  paintPhoto(me.photo);
  try { const c = JSON.parse(localStorage.getItem('yns_cust') || '{}'); c.name = me.name || c.name || ''; if (me.phone) c.phone = '0' + me.phone.slice(2); if (me.address) c.address = me.address; localStorage.setItem('yns_cust', JSON.stringify(c)); } catch (_) {}
}
async function saveProfile() {
  const b = $('save'); b.disabled = true;
  try {
    const r = await fetch(API + '/api/auth/profile', { method: 'POST', headers: H, body: JSON.stringify({ name: $('f-name').value, address: $('f-addr').value }) });
    const d = await r.json(); toast(d.ok ? 'သိမ်းပြီးပါပြီ ✅' : (d.error || 'မအောင်မြင်ပါ'));
  } catch (_) { toast('အင်တာနက် စစ်ပါ'); } finally { b.disabled = false; }
}
function pickPhoto(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = async () => {
    const S = 320, k = Math.min(1, S / Math.min(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
    const c = document.createElement('canvas'); const side = Math.min(w, h); c.width = c.height = side;
    c.getContext('2d').drawImage(img, (w - side) / -2, (h - side) / -2, w, h); URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg', 0.82);
    try {
      const r = await fetch(API + '/api/auth/photo', { method: 'POST', headers: H, body: JSON.stringify({ data }) });
      const d = await r.json(); if (d.ok) { paintPhoto(d.photo); toast('ဓာတ်ပုံ တင်ပြီးပါပြီ ✅'); } else toast(d.error || 'မအောင်မြင်ပါ');
    } catch (_) { toast('အင်တာနက် စစ်ပါ'); }
  };
  img.onerror = () => toast('ပုံဖိုင် ဖတ်၍မရပါ'); img.src = url;
}
async function rmPhoto() { try { await fetch(API + '/api/auth/photo', { method: 'POST', headers: H, body: JSON.stringify({ remove: true }) }); paintPhoto(''); } catch (_) {} }
function outLogin() { if (!confirm('အကောင့်ထွက်မည်လား?')) return; try { localStorage.removeItem('user_token'); } catch (_) {} location.href = home; }
load();
</script>
</body>
</html>
